[25, "La periodicidad del inventario de existencias puede variar según:", ["El color del almacén", "La hora del día en que se realice", "El tipo de material y su rotación o importancia", "El número de empleados del organismo, sin relación con el material"], 2, "Materiales de alta rotación o especial relevancia suelen requerir inventarios más frecuentes que otros de uso ocasional."],
[25, "El recuento cíclico de existencias consiste en:", ["Contar el inventario completo cada día laborable", "Eliminar cualquier revisión periódica del stock", "Sustituir el inventario anual completo sin ninguna alternativa", "Revisar periódicamente una parte del inventario de forma rotativa, en vez de todo a la vez"], 3, "El recuento cíclico reparte la revisión del inventario a lo largo del tiempo, revisando distintas partes del almacén de forma rotativa."],
[25, "Un albarán no conformado (sin la firma de conformidad) puede generar, en el control de existencias:", ["Automáticamente el pago de la factura correspondiente", "Dudas sobre si la recepción del material fue correcta y completa", "La eliminación del registro de esa entrega", "Ninguna consecuencia relevante"], 1, "La firma de conformidad certifica que lo recibido coincide con lo indicado en el albarán; su ausencia puede generar dudas o disputas posteriores."],
[25, "El etiquetado con fecha de recepción en los materiales almacenados facilita, entre otras funciones:", ["Sustituir el control de existencias documental", "Eliminar la necesidad de un inventario periódico", "Aplicar el criterio de rotación de existencias (primero en entrar, primero en salir)", "Determinar el precio de venta del material"], 2, "Conocer la fecha de recepción de cada lote es clave para aplicar correctamente el principio de rotación FIFO."],
[25, "Un exceso de existencias respecto a las necesidades reales puede suponer, entre otros inconvenientes:", ["Una mejora directa del control de calidad", "Ninguna consecuencia relevante para la organización", "Una reducción automática de los costes de gestión", "Un uso ineficiente del espacio de almacenamiento y mayor riesgo de deterioro u obsolescencia"], 3, "El exceso de stock inmoviliza espacio y recursos, además de aumentar el riesgo de que el material se deteriore o quede obsoleto antes de usarse."],
[26, "El transporte de materiales combustibles o inflamables dentro de las instalaciones debe realizarse:", ["Sin ninguna precaución especial respecto a otros materiales", "Junto con materiales oxidantes en el mismo recipiente", "Sin señalización de ningún tipo", "Siguiendo los protocolos de seguridad establecidos, evitando fuentes de ignición próximas"], 3, "Estos materiales requieren protocolos específicos que reduzcan el riesgo de incendio o explosión durante su manejo y transporte."],
[26, "Antes de utilizar una carretilla o transpaleta para mover material, se debe comprobar:", ["Que no haya nadie más en el almacén", "El precio de adquisición del equipo", "El buen estado del equipo y que la carga esté correctamente estabilizada", "Únicamente el color del equipo"], 2, "Verificar el estado del equipo y la estabilidad de la carga previene accidentes durante el desplazamiento del material."],
[26, "El uso de equipos de elevación de cargas por parte del personal exige, con carácter general:", ["Contar con la formación adecuada para su manejo seguro", "No requerir ninguna formación específica", "Prescindir de cualquier revisión periódica del equipo", "Estar reservado exclusivamente a personal externo a la organización"], 0, "El manejo de maquinaria de elevación requiere formación específica para minimizar riesgos tanto para el operario como para terceros."],
[26, "Ante el derrame accidental de un material inflamable durante su transporte, la actuación inmediata recomendada es:", ["Alejar cualquier fuente de ignición y seguir el protocolo de emergencia o limpieza establecido", "Continuar la tarea ignorando el derrame", "Encender luces o equipos eléctricos cercanos sin ninguna precaución", "Limpiar el derrame con cualquier material absorbente sin comprobar su idoneidad"], 0, "Alejar fuentes de ignición y seguir el protocolo establecido es la pauta básica de seguridad ante un derrame de material inflamable."],
[26, "El etiquetado de un material combustible durante su almacenamiento y movimiento tiene como finalidad:", ["Indicar únicamente su precio de venta", "Ser opcional según el criterio de cada trabajador", "Informar sobre su peligrosidad y las precauciones necesarias en su manejo", "Sustituir cualquier ficha de seguridad"], 2, "El etiquetado normalizado (pictogramas de peligro) informa de forma rápida y clara sobre los riesgos del producto."],
[26, "El transporte de bombonas de gas dentro de unas instalaciones debe realizarse:", ["Rodándolas por el suelo para mayor rapidez", "Junto con materiales inflamables sin ninguna separación", "En posición vertical y con los medios de sujeción adecuados", "En cualquier posición sin ninguna sujeción"], 2, "El transporte vertical y bien sujeto de las bombonas de gas reduce el riesgo de fugas o daños en la válvula."],
[26, "Antes de utilizar una máquina o equipo de manejo de materiales por primera vez, el personal debe:", ["Esperar a que se produzca una avería para conocer sus limitaciones", "Utilizarla sin ninguna instrucción previa si parece sencilla", "Aprender por sí mismo mediante prueba y error", "Recibir la formación e información necesarias sobre su manejo seguro"], 3, "La formación previa es una obligación preventiva básica antes de utilizar cualquier equipo de trabajo, especialmente maquinaria."],
[26, "El etiquetado de recipientes que contienen materiales trasvasados desde su envase original debe:", ["Eliminarse al no tratarse ya del envase original", "Mantenerse igualmente identificado con la información de peligrosidad correspondiente", "Reducirse a una simple marca de color sin más detalle", "Sustituirse por un código interno sin información de riesgo"], 1, "Aunque se trasvase a otro recipiente, la información de peligrosidad debe mantenerse para garantizar una manipulación segura."],
[26, "El uso de equipos de protección individual (guantes, calzado de seguridad) en el manejo de materiales pesados o cortantes tiene como finalidad:", ["Aumentar la velocidad de ejecución de la tarea", "Eliminar la necesidad de evaluar el riesgo del material", "Sustituir la formación en manipulación de cargas", "Reducir el riesgo de lesiones durante la manipulación"], 3, "Los EPI son una medida de protección complementaria frente a riesgos que no pueden eliminarse completamente en origen."],
[26, "Ante el traslado de equipos o maquinaria pesada dentro de unas instalaciones, es recomendable:", ["Improvisar el recorrido sobre la marcha", "Planificar previamente el itinerario y despejar la zona de paso", "Prescindir de cualquier señalización durante el traslado", "Realizar el traslado en horas de máxima afluencia de personal"], 1, "Planificar el itinerario y despejar la zona reduce el riesgo de golpes, caídas o daños tanto a personas como a materiales."],
[26, "El código de colores y pictogramas en el transporte de mercancías peligrosas tiene como finalidad:", ["Informar rápidamente sobre el tipo de riesgo del material transportado", "Indicar exclusivamente el destino del envío", "Decorar el vehículo o embalaje de transporte", "Sustituir la documentación de transporte"], 0, "Permite identificar visualmente y de forma inmediata el tipo de peligro asociado al material, facilitando una respuesta adecuada ante incidentes."],
[26, "Antes de mover una carga con una carretilla elevadora, se debe comprobar, entre otros aspectos:", ["El horario de trabajo del conductor exclusivamente", "Únicamente el color de la carretilla", "Que la carga está bien sujeta y no supera la capacidad del equipo", "Que no haya luz solar directa en la zona"], 2, "Verificar la sujeción y el respeto a la capacidad máxima del equipo son comprobaciones básicas de seguridad antes de cualquier desplazamiento de carga."],
[26, "El almacenamiento y transporte de materiales combustibles debe alejarse, como norma general, de:", ["Áreas correctamente señalizadas", "Zonas con buena ventilación", "Espacios con temperatura controlada", "Fuentes de calor o posibles focos de ignición"], 3, "Evitar la proximidad a fuentes de calor o ignición es una medida básica de prevención frente a incendios en materiales combustibles."],
[26, "La formación en manejo de equipos de elevación de cargas debe incluir, entre otros contenidos:", ["Exclusivamente aspectos teóricos sin ninguna práctica", "Contenidos ajenos al propio equipo de trabajo", "Información exclusivamente comercial del fabricante", "Los límites de carga y las medidas de seguridad específicas del equipo"], 3, "Conocer los límites de carga y las medidas de seguridad específicas es esencial para un manejo seguro del equipo."],
[26, "Ante el transporte conjunto de varios materiales de distinta naturaleza, se debe comprobar previamente:", ["Su compatibilidad, evitando combinaciones peligrosas", "Que todos tengan el mismo color de embalaje", "Que procedan del mismo proveedor", "Que pesen exactamente lo mismo"], 0, "Comprobar la compatibilidad de los materiales evita reacciones peligrosas o incidentes durante su transporte conjunto."],
[26, "El uso de calzado de seguridad con puntera reforzada en tareas de manejo de materiales pesados tiene como finalidad:", ["Proteger los pies frente a la caída accidental de objetos", "Reducir el peso percibido de la carga", "Mejorar el rendimiento deportivo del trabajador", "Sustituir la necesidad de formación en manipulación"], 0, "La puntera reforzada protege frente a golpes o aplastamientos en caso de caída de la carga sobre el pie."],
[26, "El manejo de una traspaleta manual cargada debe realizarse, como norma de seguridad básica:", ["Tirando siempre de espaldas al recorrido", "Empujando en vez de tirando siempre que sea posible, con buena visibilidad del recorrido", "Sin comprobar la carga máxima admisible del equipo", "Con los ojos cerrados en tramos rectos"], 1, "Empujar con buena visibilidad del recorrido reduce el riesgo de colisiones y facilita un manejo más seguro del equipo."],
[26, "El uso de topes o calzos en las ruedas de un carro de transporte cargado en una superficie inclinada tiene como finalidad:", ["Evitar el desplazamiento accidental del carro", "Sustituir el freno del propio carro", "Facilitar su desplazamiento más rápido", "Aumentar la carga máxima permitida"], 0, "Los calzos inmovilizan el carro evitando que se desplace de forma incontrolada en superficies con pendiente."],
[26, "La señalización de una zona donde se están realizando movimientos de maquinaria pesada tiene como finalidad:", ["Reducir el tiempo necesario para completar la tarea", "Decorar la zona de trabajo", "Sustituir la necesidad de formación del personal", "Advertir a terceras personas del riesgo y delimitar la zona de trabajo"], 3, "Señalizar la zona informa a terceros del riesgo presente, reduciendo la posibilidad de accidentes durante el movimiento de maquinaria."],
[27, "La clasificación selectiva de residuos en un centro de trabajo tiene como objetivo principal:", ["Reducir el número de contenedores necesarios", "Aumentar el volumen total de residuos generados", "Facilitar su correcto reciclaje o tratamiento posterior según su naturaleza", "Sustituir la recogida municipal de basuras"], 2, "Separar los residuos por tipo (papel, plástico, orgánico, etc.) permite que cada fracción reciba el tratamiento de reciclaje adecuado."],
[27, "Los residuos de aparatos eléctricos y electrónicos (RAEE) deben gestionarse:", ["Sin ninguna consideración especial respecto a otros residuos", "Junto con el resto de residuos orgánicos", "Vertiéndolos directamente en cualquier contenedor genérico", "A través de puntos de recogida específicos, dado su carácter potencialmente peligroso"], 3, "Contienen componentes que pueden ser contaminantes o peligrosos, por lo que requieren una gestión diferenciada."],
[27, "El contenedor de color amarillo, en la recogida selectiva habitual, se destina a:", ["Papel y cartón", "Envases de plástico y metal", "Vidrio", "Residuos orgánicos"], 1, "Es el código de colores más extendido en la recogida selectiva municipal en España para envases ligeros."],
[27, "Los residuos peligrosos generados en un centro de trabajo (por ejemplo, tóner, pilas o productos químicos) deben:", ["Almacenarse indefinidamente sin ninguna gestión posterior", "Gestionarse de forma separada conforme a la normativa de residuos peligrosos", "Mezclarse con los residuos ordinarios del centro", "Verterse directamente por el desagüe"], 1, "Los residuos peligrosos requieren una gestión diferenciada y trazable, conforme a la normativa específica de residuos."],
[27, "El papel y cartón usado en una oficina, antes de su retirada selectiva, puede requerir:", ["Su depósito en el contenedor específico, libre de otros materiales contaminantes", "Triturarse obligatoriamente en todos los casos antes de reciclarlo", "Ser quemado en las propias instalaciones", "Mezclarse siempre con restos de comida"], 0, "Mantener el papel y cartón libre de otros materiales facilita su correcto reciclaje posterior."],
[27, "El contenedor de color azul, en la recogida selectiva habitual, se destina a:", ["Papel y cartón", "Residuos orgánicos", "Vidrio", "Envases de plástico y metal"], 0, "Es el código de colores extendido en la recogida selectiva municipal en España para el papel y cartón."],
[27, "El contenedor de color verde (iglú), en la recogida selectiva habitual, se destina a:", ["Papel y cartón", "Vidrio", "Pilas y baterías", "Envases ligeros"], 1, "El contenedor verde tipo iglú es el habitual para el vidrio en la recogida selectiva municipal."],
[27, "Las pilas y baterías usadas deben depositarse:", ["En cualquier punto sin ninguna consideración especial", "Junto con el resto de residuos orgánicos", "En puntos de recogida específicos habilitados para este tipo de residuo", "En el contenedor de papel y cartón"], 2, "Contienen sustancias potencialmente contaminantes y requieren una gestión diferenciada en puntos de recogida específicos."],
[27, "El principio de las 'tres erres' en la gestión de residuos hace referencia a:", ["Reducir, reutilizar y reciclar", "Recoger, retirar y rellenar", "Registrar, revisar y remitir", "Rechazar, reemplazar y renovar"], 0, "Es un principio ampliamente difundido de gestión ambiental que prioriza reducir el consumo, reutilizar y, finalmente, reciclar."],
[27, "La correcta gestión de residuos en un centro de trabajo puede contribuir a:", ["Eliminar cualquier obligación normativa en materia ambiental", "Aumentar de forma directa el presupuesto disponible", "Sustituir la necesidad de mantenimiento de instalaciones", "Reducir el impacto ambiental de la actividad del organismo"], 3, "Una gestión adecuada de residuos reduce el impacto ambiental, además de ser una obligación normativa en muchos casos."],
[27, "Ante la generación de un residuo cuya clasificación resulta dudosa, la actuación recomendada es:", ["Depositarlo en cualquier contenedor disponible sin más comprobación", "Consultar el protocolo interno o al responsable correspondiente antes de depositarlo", "Verterlo directamente al desagüe", "Acumularlo indefinidamente sin gestionarlo"], 1, "Ante la duda, consultar el protocolo o al responsable evita una gestión incorrecta que pueda tener consecuencias ambientales o normativas."],
[27, "El compostaje de residuos orgánicos es un proceso que permite:", ["Transformar la materia orgánica en un abono natural aprovechable", "Sustituir la recogida selectiva de otros residuos", "Incinerar el residuo de forma controlada", "Eliminar completamente cualquier residuo sin ningún aprovechamiento"], 0, "El compostaje aprovecha la descomposición controlada de la materia orgánica para obtener un producto reutilizable como abono."],
[27, "Los puntos limpios municipales están destinados principalmente a:", ["Almacenar residuos peligrosos de forma indefinida sin gestión posterior", "Recoger exclusivamente residuos orgánicos", "La recogida de residuos voluminosos o especiales no admitidos en la recogida ordinaria", "Sustituir por completo los contenedores de recogida selectiva ordinaria"], 2, "Los puntos limpios permiten depositar de forma diferenciada residuos voluminosos, electrónicos o especiales que no van en la recogida habitual."],
[27, "La reducción en origen, como parte de la gestión de residuos, hace referencia a:", ["Reciclar el mayor volumen posible de residuos ya generados", "Aumentar el volumen de compra de materiales de un solo uso", "Disminuir la cantidad de residuos generados desde el propio proceso o actividad", "Incinerar los residuos antes de su generación"], 2, "La reducción en origen prioriza generar menos residuos desde el principio, antes de recurrir a la reutilización o el reciclaje."],
[27, "El símbolo de reciclaje (las tres flechas) en un envase indica, con carácter general:", ["Que el producto no genera ningún residuo", "Que el envase debe incinerarse obligatoriamente", "Que el envase es totalmente biodegradable", "Que el material del envase es potencialmente reciclable"], 3, "El símbolo de las tres flechas identifica materiales que pueden reciclarse a través de los circuitos correspondientes."],
[27, "El almacenamiento temporal de residuos dentro de un centro de trabajo, antes de su retirada, debe realizarse:", ["Sin ninguna limitación de tiempo de almacenamiento", "En cualquier espacio disponible sin ningún criterio", "Junto con material de oficina de uso habitual", "En condiciones adecuadas que eviten riesgos para la salud o el medio ambiente"], 3, "El almacenamiento temporal debe respetar unas condiciones mínimas de seguridad e higiene hasta su retirada por el gestor correspondiente."],
[27, "La correcta separación de residuos desde el origen (en el propio puesto de trabajo) facilita:", ["Reducir la vida útil de los materiales reciclables", "Un reciclaje posterior más eficiente y de mayor calidad", "Aumentar el volumen total de residuos generados", "Sustituir la necesidad de contenedores específicos"], 1, "Separar correctamente desde el origen evita la contaminación entre distintos tipos de residuos, mejorando la calidad del reciclaje posterior."],
[27, "Los residuos de aceites usados (por ejemplo, de mantenimiento de vehículos) deben gestionarse:", ["Vertiéndolos por el desagüe convencional", "Mezclados con los residuos orgánicos", "A través de un gestor autorizado de residuos peligrosos", "Sin ninguna gestión específica"], 2, "Los aceites usados son residuos peligrosos que requieren una gestión específica a través de gestores autorizados."],
[27, "La normativa de residuos suele establecer una jerarquía de gestión que prioriza, en primer lugar:", ["El vertido directo en vertedero", "La prevención en la generación del residuo", "La incineración sin ningún criterio previo", "El almacenamiento indefinido sin tratamiento"], 1, "La jerarquía de residuos sitúa la prevención como primera opción, seguida de la reutilización, el reciclaje, la valorización y, en último lugar, la eliminación."],
[27, "La incineración de residuos sin el tratamiento y control adecuados puede provocar:", ["Una reducción garantizada de cualquier impacto ambiental", "Emisiones contaminantes perjudiciales para el medio ambiente y la salud", "La eliminación total y segura de cualquier residuo", "Ningún efecto relevante sobre la calidad del aire"], 1, "Una incineración no controlada puede generar emisiones tóxicas, por lo que debe realizarse únicamente en instalaciones autorizadas y con los controles adecuados."],
[28, "Ante una fuga de agua en una tubería, la primera actuación recomendada es:", ["Cerrar la llave de paso general o la más cercana a la fuga", "Aplicar cinta aislante eléctrica como reparación definitiva", "Ignorar la fuga si es de poco caudal", "Intentar reparar la tubería sin cortar antes el suministro"], 0, "Cortar el suministro de agua es el primer paso para evitar que la fuga siga causando daños mientras se gestiona la reparación."],
[28, "Antes de manipular una instalación eléctrica, aunque sea una tarea sencilla, se debe:", ["Prescindir de cualquier comprobación previa", "Usar herramientas metálicas sin ningún tipo de aislamiento", "Cortar la corriente en el cuadro eléctrico correspondiente", "Trabajar con la corriente conectada para comprobar el fallo en tiempo real"], 2, "Cortar la corriente antes de manipular una instalación eléctrica es la norma básica de seguridad frente a electrocución."],
[28, "Una llave allen (o llave hexagonal) se utiliza principalmente para:", ["Cortar cables eléctricos", "Sellar juntas de fontanería", "Nivelar superficies de albañilería", "Apretar o aflojar tornillos con cabeza hexagonal interior"], 3, "Es una herramienta habitual en mobiliario y pequeñas reparaciones con tornillería de cabeza hexagonal interior."],
[28, "En una pequeña reparación de carpintería, el uso de tacos y tornillos adecuados al tipo de pared es importante para:", ["Reducir el tiempo de secado de la pintura", "Sustituir la necesidad de nivelar el elemento", "Garantizar una fijación segura y duradera del elemento instalado", "Evitar el uso de cualquier herramienta eléctrica"], 2, "Usar el taco y tornillo adecuados al material de la pared (yeso, ladrillo, hormigón) evita que la fijación ceda con el tiempo."],
[28, "El termostato de una instalación de calefacción tiene como función:", ["Sustituir la caldera del sistema", "Regular la temperatura deseada, activando o desactivando el sistema de forma automática", "Filtrar el aire de la instalación", "Medir el consumo eléctrico del edificio"], 1, "El termostato controla automáticamente el funcionamiento del sistema de calefacción según la temperatura configurada."],
[28, "Ante un atasco leve en un desagüe, una primera actuación básica de mantenimiento es:", ["Ignorar el atasco hasta que se resuelva solo", "Utilizar un desatascador manual (ventosa) antes de recurrir a productos químicos agresivos", "Desmontar la tubería sin ninguna precaución", "Verter siempre productos químicos corrosivos como primera opción"], 1, "El uso de un desatascador manual es una primera medida sencilla y menos agresiva que los productos químicos."],
[28, "El mantenimiento básico de un sistema de aire acondicionado incluye, entre otras tareas:", ["Aumentar la potencia del equipo sin criterio técnico", "Eliminar la necesidad de cualquier revisión técnica", "Sustituir la instalación eléctrica completa cada mes", "La limpieza periódica de filtros"], 3, "La limpieza de filtros es una tarea de mantenimiento básico que mejora la eficiencia y calidad del aire del sistema."],
[28, "Al detectar una puerta o cerradura que no cierra correctamente, una posible causa habitual a revisar es:", ["El desajuste de las bisagras o del propio mecanismo de la cerradura", "La presión del agua del edificio", "Un fallo exclusivamente en la instalación eléctrica del edificio", "Un problema en la red de fontanería"], 0, "Las bisagras desajustadas o un mecanismo de cerradura deteriorado son causas frecuentes de mal funcionamiento de puertas."],
[28, "Ante un enchufe o toma de corriente que produce chispas al conectar un aparato, la actuación correcta es:", ["Forzar la conexión introduciendo el enchufe de otra manera", "Seguir utilizándolo si el aparato funciona correctamente", "Repararlo uno mismo sin formación eléctrica específica", "Dejar de utilizarlo y comunicar la incidencia para su revisión por personal cualificado"], 3, "Las chispas al conectar un aparato pueden indicar un fallo eléctrico que debe ser revisado por personal cualificado, evitando riesgos de descarga o incendio."],
[28, "El desatascador de ventosa para desagües funciona principalmente mediante:", ["Calor generado por fricción", "Productos químicos corrosivos incorporados", "La generación de presión y succión que desplaza el obstáculo", "Vibración ultrasónica"], 2, "El efecto de presión y succión que genera la ventosa ayuda a desplazar o disolver el material que obstruye la tubería."],
[28, "Una de las causas más habituales de goteo en un grifo es:", ["Un problema de calefacción del edificio", "Un fallo en la instalación eléctrica cercana", "Una avería en la caldera de calefacción", "El desgaste de la junta o zapata interior"], 3, "El desgaste de juntas o zapatas es la causa más frecuente de los goteos en grifería, siendo una reparación sencilla en la mayoría de los casos."],
[28, "El uso de un nivel de burbuja en pequeñas tareas de carpintería o albañilería sirve para:", ["Medir la temperatura ambiente", "Cortar materiales con precisión", "Comprobar la horizontalidad o verticalidad de una superficie o elemento", "Detectar fugas eléctricas"], 2, "El nivel de burbuja es una herramienta básica para verificar que un elemento está correctamente horizontal o vertical antes de fijarlo."],
[28, "Ante la detección de humedades en una pared de un edificio administrativo, es recomendable:", ["Sellar la zona con cinta adhesiva como solución definitiva", "Ignorar la humedad si no afecta visualmente a la pintura", "Comunicar la incidencia para su valoración y reparación por personal especializado", "Aplicar pintura directamente sin investigar la causa"], 2, "Las humedades pueden tener causas diversas (filtraciones, condensación, fugas) que requieren una valoración técnica antes de una reparación efectiva."],
[28, "El mantenimiento preventivo de una caldera de calefacción debe realizarse, con carácter general:", ["Nunca, si el equipo es relativamente nuevo", "Solo en caso de que lo solicite expresamente el usuario final", "Únicamente cuando se produce una avería", "De forma periódica por personal cualificado, conforme a la normativa aplicable"], 3, "Las calderas requieren revisiones periódicas obligatorias que garantizan su correcto funcionamiento y seguridad."],
[28, "Al realizar una pequeña reparación de pintura en una pared, antes de aplicar la pintura es recomendable:", ["Limpiar y preparar adecuadamente la superficie", "Aplicar varias capas sin dejar tiempo de secado entre ellas", "Utilizar siempre el color más oscuro disponible", "Aplicar la pintura directamente sobre cualquier superficie sin preparación"], 0, "Una superficie limpia y bien preparada mejora la adherencia y el acabado final de la pintura."],
[28, "El destornillador de estrella (Phillips), frente al plano, se caracteriza por:", ["Adaptarse a tornillos con cabeza en forma de cruz", "Servir únicamente para tornillos muy grandes", "Utilizarse exclusivamente en instalaciones eléctricas", "No tener ninguna diferencia práctica con el destornillador plano"], 0, "El destornillador de estrella se adapta al tipo de ranura en cruz de determinados tornillos, distinto del tipo plano o ranurado simple."],
[28, "El uso de una llave inglesa o llave ajustable permite:", ["Cortar tuberías de cualquier material", "Detectar fugas eléctricas", "Adaptarse a distintos tamaños de tuercas o tornillos", "Medir la presión de una instalación"], 2, "Su apertura ajustable la hace versátil para trabajar con diferentes tamaños de tuercas y tornillos en tareas de mantenimiento."],
[28, "La revisión periódica de las juntas de estanqueidad en instalaciones de fontanería tiene como finalidad:", ["Aumentar la presión del sistema", "Sustituir el mantenimiento de la caldera", "Reducir el consumo eléctrico del edificio", "Prevenir fugas de agua en las conexiones"], 3, "Unas juntas deterioradas son una causa habitual de pequeñas fugas en conexiones de fontanería, por lo que su revisión periódica es preventiva."],
[28, "Una fuga de gas detectada por el olor característico debe motivar, como primera actuación:", ["Ventilar la zona, no accionar interruptores eléctricos y avisar al servicio correspondiente", "Utilizar cualquier llama para localizar el origen de la fuga", "Ignorar el olor si es leve", "Encender una luz para ver mejor la zona"], 0, "Ventilar sin generar chispas ni llamas y avisar cuanto antes es la pauta de seguridad básica ante una sospecha de fuga de gas."],
[28, "El uso de un multímetro en tareas básicas de electricidad permite:", ["Medir la temperatura ambiente de una sala", "Cortar cables eléctricos con precisión", "Medir magnitudes eléctricas como la tensión o la continuidad de un circuito", "Sustituir un interruptor diferencial"], 2, "El multímetro es una herramienta de medición eléctrica básica, útil para comprobar tensión, continuidad u otros parámetros."],
[28, "El uso de guantes aislantes es especialmente recomendable en tareas de mantenimiento que impliquen:", ["Tareas de jardinería sin ningún riesgo eléctrico", "Manipulación de elementos con posible tensión eléctrica residual", "Tareas exclusivamente de pintura", "Tareas de limpieza de cristales"], 1, "Los guantes aislantes son una medida de protección frente al riesgo de contacto eléctrico en tareas de mantenimiento."],
[28, "Las herramientas de mantenimiento deben revisarse periódicamente para comprobar:", ["Únicamente su color o aspecto estético", "Su fecha de fabricación exclusivamente", "El precio de mercado actual de cada herramienta", "Su buen estado de conservación y funcionamiento seguro"], 3, "Una herramienta deteriorada puede fallar durante su uso, aumentando el riesgo de accidente; su revisión periódica es una medida preventiva básica."],
[29, "Los extintores de un edificio deben someterse a revisión periódica, con carácter general, según:", ["Solo si se ha producido un incendio previo", "La normativa de instalaciones de protección contra incendios vigente", "Ningún criterio normativo específico", "El criterio exclusivo del fabricante sin normativa aplicable"], 1, "La normativa de instalaciones de protección contra incendios establece las revisiones periódicas obligatorias de los extintores."],
[29, "Un extintor de polvo polivalente (ABC) es adecuado, con carácter general, para fuegos de tipo:", ["Exclusivamente metales", "Exclusivamente equipos eléctricos en tensión", "Exclusivamente líquidos inflamables", "Sólidos, líquidos y gases inflamables"], 3, "El polvo ABC es un agente extintor polivalente, apto para las clases de fuego más habituales (sólidos, líquidos y gases)."],
[29, "Las puertas cortafuegos deben mantenerse, con carácter general, en condiciones de:", ["Bloqueo definitivo para evitar su apertura", "Apertura permanente para facilitar el paso", "Cierre efectivo, sin elementos que impidan su funcionamiento (como cuñas o objetos que las mantengan abiertas)", "Ausencia total de mantenimiento periódico"], 2, "Las puertas cortafuegos deben poder cerrarse correctamente para cumplir su función de compartimentación ante un incendio; bloquearlas abiertas anula su eficacia."],
[29, "La señalización de un extintor en un edificio debe ser:", ["Retirada una vez instalado el extintor", "Visible, permanente y fácilmente identificable desde distintos puntos del recinto", "Opcional, sin ningún criterio de visibilidad", "Sustituida por indicaciones verbales del personal"], 1, "La señalización adecuada permite localizar rápidamente el extintor en caso de emergencia."],
[29, "Antes de utilizar un extintor, una comprobación básica que cualquier persona puede realizar es:", ["Desmontar la válvula del extintor", "Verificar que el manómetro (si lo tiene) marca la presión correcta y que el precinto está intacto", "Ignorar cualquier indicador visual del propio equipo", "Agitar el extintor de forma violenta antes de cualquier comprobación"], 1, "El manómetro y el precinto son indicadores visuales básicos del estado operativo de un extintor."],
[29, "El mantenimiento de las vías de evacuación de un edificio exige, entre otras medidas:", ["Utilizarlas habitualmente como zona de almacenamiento temporal", "Cerrarlas con llave durante el horario laboral", "Reducir su anchura si el espacio es limitado", "Mantenerlas libres de obstáculos en todo momento"], 3, "Las vías de evacuación deben permanecer siempre despejadas para garantizar una salida segura en caso de emergencia."],
[29, "La clase de fuego correspondiente a materiales sólidos como madera, papel o tejidos se denomina:", ["Clase C", "Clase B", "Clase D", "Clase A"], 3, "La clasificación de fuegos distingue la clase A para combustibles sólidos, la B para líquidos, la C para gases y la D para metales."],
[29, "La clase de fuego correspondiente a líquidos inflamables como gasolina o aceites se denomina:", ["Clase A", "Clase C", "Clase D", "Clase B"], 3, "La clase B de fuegos corresponde a líquidos y sólidos licuables inflamables."],
[29, "Un extintor debe someterse, con carácter general, a una revisión anual por parte de:", ["Un organismo distinto en cada revisión sin ningún registro", "Nadie, si el extintor no se ha utilizado nunca", "Una empresa mantenedora autorizada", "El propio personal del edificio sin ninguna cualificación"], 2, "La normativa de protección contra incendios exige revisiones periódicas por empresas mantenedoras autorizadas, además de comprobaciones visuales más frecuentes."],
[29, "La retimbrado o prueba de presión de un extintor debe realizarse, con carácter general, cada:", ["Diez años en todos los casos sin excepción", "Cinco años, según la vida útil y normativa del extintor", "Nunca es necesario si el extintor no se ha usado", "Un mes"], 1, "La retimbrado es una prueba periódica de presión exigida por la normativa para verificar la resistencia del recipiente del extintor."],
[29, "Las puertas cortafuegos suelen incorporar un mecanismo de cierre automático que:", ["Garantiza que la puerta se cierre por sí sola tras su apertura", "Elimina la necesidad de manija o pomo en la puerta", "Mantiene la puerta siempre abierta de forma automática", "Bloquea la puerta de forma permanente"], 0, "El cierre automático asegura que la puerta cumpla su función de compartimentación ante un incendio, incluso si se ha abierto momentáneamente."],
[29, "La detección de un extintor con el precinto roto o el indicador de presión fuera del rango normal debe:", ["Comunicarse para su revisión o sustitución inmediata", "Sustituirse por cualquier otro objeto similar", "Repararse por cualquier persona sin formación específica", "Ignorarse si el extintor parece visualmente en buen estado"], 0, "Un precinto roto o una presión anómala son señales de que el extintor puede no funcionar correctamente y debe revisarse cuanto antes."],
[29, "El plan de autoprotección de un edificio administrativo debe incluir, entre otros elementos:", ["La lista de proveedores del organismo", "Únicamente el presupuesto de mantenimiento del edificio", "El horario laboral del personal", "La identificación de riesgos y las medidas de actuación ante una emergencia"], 3, "El plan de autoprotección recoge el análisis de riesgos, los medios disponibles y los protocolos de actuación ante emergencias."],
[29, "El simulacro periódico de evacuación de un edificio tiene como finalidad principal:", ["Reducir el número de extintores necesarios", "Comprobar y mejorar la respuesta del personal ante una emergencia real", "Evaluar el rendimiento laboral del personal", "Sustituir la necesidad de un plan de autoprotección"], 1, "Los simulacros permiten entrenar y evaluar la respuesta ante una emergencia, detectando posibles mejoras en el protocolo."],
[29, "La ubicación de los extintores en un edificio debe permitir, entre otros criterios:", ["Un acceso rápido y sin obstáculos en caso de emergencia", "Estar situados únicamente en las plantas superiores", "Estar ocultos para no afectar a la decoración", "Cambiar de ubicación con frecuencia sin ninguna señalización"], 0, "Los extintores deben ubicarse en puntos accesibles y visibles, conforme a la normativa de protección contra incendios."],
[29, "El extintor de dióxido de carbono (CO2) es especialmente adecuado para fuegos que afectan a:", ["Metales combustibles", "Materiales sólidos como madera o papel", "Equipos eléctricos en tensión", "Aceites de cocina exclusivamente"], 2, "El CO2 no deja residuo y no es conductor de electricidad, por lo que resulta adecuado para fuegos en equipos eléctricos."],
[29, "Los extintores portátiles instalados en un edificio deben quedar recogidos, entre otros datos, en:", ["El contrato laboral del personal de mantenimiento", "Un registro o plan de mantenimiento del propio edificio", "El plan de igualdad del organismo", "Ningún documento específico"], 1, "Llevar un registro de los extintores y su mantenimiento facilita el seguimiento de las revisiones obligatorias periódicas."],
[29, "La franja de seguridad delante de un extintor debe mantenerse:", ["Libre de obstáculos que impidan su rápida localización y uso", "Señalizada únicamente en edificios de nueva construcción", "Reducida al mínimo espacio posible", "Ocupada con material de uso frecuente"], 0, "Mantener despejada la zona frente al extintor garantiza que pueda utilizarse sin demora en caso de emergencia."],
[29, "La accesibilidad de las puertas cortafuegos para su apertura en caso de emergencia debe garantizarse mediante:", ["Barreras adicionales que dificulten su apertura rápida", "Mecanismos de apertura sencilla desde el interior, sin necesidad de llave", "Cerraduras que requieran llave específica en todo momento", "Ausencia de cualquier mecanismo de apertura de emergencia"], 1, "Las puertas de evacuación deben poder abrirse fácilmente desde el interior en caso de emergencia, sin necesidad de llave."],
[29, "La formación básica en el uso de extintores dirigida al personal de un edificio tiene como finalidad:", ["Sustituir la intervención de los servicios de bomberos en cualquier caso", "Eliminar la necesidad de un plan de autoprotección", "Reducir el número de extintores necesarios en el edificio", "Que sepan actuar con seguridad ante un conato de incendio"], 3, "Conocer el manejo básico de un extintor permite una primera intervención segura ante un conato de incendio, sin sustituir la actuación de los servicios de emergencia en incendios de mayor envergadura."],
[30, "La comprobación periódica del nivel de aceite del motor de un vehículo tiene como finalidad:", ["Sustituir la revisión de los neumáticos", "Garantizar una lubricación adecuada de los componentes del motor", "Aumentar la velocidad máxima del vehículo", "Reducir el consumo de combustible de forma directa"], 1, "Un nivel de aceite adecuado es esencial para la correcta lubricación y funcionamiento del motor, evitando averías graves."],
[30, "La presión de los neumáticos de un vehículo debe revisarse periódicamente porque una presión incorrecta puede provocar:", ["Un desgaste irregular y mayor riesgo de reventón o pérdida de control", "Una reducción del consumo de combustible en todos los casos", "Una mejora automática de la seguridad sin ningún riesgo asociado", "Ningún efecto relevante sobre la conducción"], 0, "Una presión inadecuada afecta a la estabilidad, el desgaste del neumático y aumenta el riesgo de accidente."],
[30, "El líquido refrigerante de un vehículo tiene como función principal:", ["Sustituir el líquido de frenos", "Mantener la temperatura del motor dentro de unos márgenes adecuados", "Limpiar el parabrisas", "Lubricar las piezas móviles del motor"], 1, "El líquido refrigerante evita el sobrecalentamiento del motor, manteniendo su temperatura de funcionamiento óptima."],
[30, "Antes de emprender un trayecto con un vehículo de la organización, una comprobación básica recomendable es:", ["Revisar visualmente luces, neumáticos y niveles básicos (aceite, refrigerante)", "Revisar únicamente el color de la carrocería", "No realizar ninguna comprobación si el vehículo se usó recientemente", "Comprobar exclusivamente el nivel de combustible"], 0, "Una revisión visual básica antes de cada trayecto ayuda a detectar anomalías que puedan comprometer la seguridad."],
[30, "El desgaste de las pastillas de freno de un vehículo debe revisarse periódicamente porque:", ["No afecta en ningún caso a la seguridad del vehículo", "Un desgaste excesivo reduce la capacidad de frenado y compromete la seguridad", "Solo influye en el consumo de combustible", "Es un elemento que no requiere ningún mantenimiento"], 1, "Las pastillas de freno desgastadas reducen la eficacia de frenado, siendo un elemento de seguridad crítico a revisar periódicamente."],
[30, "La ficha o cartilla de mantenimiento de un vehículo de la organización sirve para:", ["Fijar el precio de reventa del vehículo", "Sustituir el permiso de circulación", "Eliminar la necesidad de la Inspección Técnica de Vehículos (ITV)", "Registrar las revisiones, reparaciones e incidencias del vehículo a lo largo del tiempo"], 3, "Permite llevar un control histórico del mantenimiento realizado, útil para la gestión y seguridad del vehículo."],
[30, "La revisión del nivel de líquido de frenos de un vehículo es importante porque un nivel bajo puede indicar:", ["Una avería en el sistema de climatización", "Un problema exclusivamente estético del vehículo", "Un posible desgaste de las pastillas de freno o una fuga en el sistema", "Un fallo en la batería del vehículo"], 2, "Un nivel bajo de líquido de frenos puede deberse al desgaste normal de las pastillas o a una fuga, ambos aspectos relevantes para la seguridad."],
[30, "La Inspección Técnica de Vehículos (ITV) tiene como finalidad:", ["Fijar el precio de mercado del vehículo", "Sustituir el mantenimiento periódico del vehículo", "Verificar que el vehículo cumple los requisitos técnicos y de seguridad exigidos", "Renovar automáticamente el permiso de conducir del titular"], 2, "La ITV es una revisión periódica obligatoria que comprueba el estado técnico y de seguridad del vehículo conforme a la normativa vigente."],
[30, "El desgaste irregular de los neumáticos de un vehículo puede deberse, entre otras causas, a:", ["La antigüedad de la batería", "El color de la carrocería del vehículo", "El tipo de combustible utilizado exclusivamente", "Una alineación o presión inadecuada de las ruedas"], 3, "Una alineación incorrecta o una presión inadecuada son causas habituales de desgaste irregular en los neumáticos."],
[30, "La comprobación del funcionamiento de las luces de un vehículo antes de un trayecto es importante porque:", ["Solo es relevante en los meses de invierno", "No tiene relación con la seguridad del trayecto", "Afecta directamente a la seguridad vial, tanto propia como de terceros", "Sustituye la necesidad de revisar los neumáticos"], 2, "Unas luces en mal estado comprometen la visibilidad y la seguridad, tanto para quien conduce como para el resto de usuarios de la vía."],
[30, "La batería de un vehículo debe revisarse periódicamente porque su deterioro puede provocar:", ["Dificultades de arranque o fallos en el sistema eléctrico del vehículo", "Un aumento del rendimiento del motor", "Ninguna incidencia relevante para el vehículo", "Una reducción automática del consumo de combustible"], 0, "Una batería deteriorada es una causa habitual de problemas de arranque y de funcionamiento de los sistemas eléctricos del vehículo."],
[30, "Ante una anomalía detectada en un vehículo de la organización durante su uso, el protocolo habitual exige:", ["Comunicarlo cuanto antes al responsable de la flota o mantenimiento", "Ignorar la anomalía si el vehículo sigue funcionando", "Repararlo por cuenta propia sin comunicarlo", "Utilizar el vehículo con normalidad de forma indefinida"], 0, "Comunicar cuanto antes cualquier anomalía permite gestionar su revisión y evitar que se agrave o derive en un problema de seguridad."],
[30, "El manómetro de un compresor o sistema neumático de un vehículo indica:", ["El kilometraje total del vehículo", "La temperatura del motor", "La presión del sistema en un momento dado", "El nivel de combustible disponible"], 2, "El manómetro mide la presión, siendo una herramienta básica de control en sistemas neumáticos o de frenos de aire."],
[30, "La revisión del estado de las escobillas del limpiaparabrisas de un vehículo es relevante especialmente porque:", ["Afecta a la visibilidad del conductor en condiciones de lluvia", "Solo es relevante en vehículos muy antiguos", "No influye en ningún caso en la seguridad de la conducción", "Sustituye la necesidad de revisar los frenos"], 0, "Unas escobillas deterioradas reducen la visibilidad en condiciones de lluvia, comprometiendo la seguridad de la conducción."],
[30, "Ante un testigo o luz de avería encendida en el salpicadero de un vehículo, la actuación recomendada es:", ["Aumentar la velocidad para llegar antes al taller", "Desconectar el testigo para que deje de molestar", "Ignorar la luz si el vehículo parece funcionar con normalidad", "Revisar cuanto antes la causa, evitando ignorar la advertencia"], 3, "Los testigos del salpicadero avisan de posibles anomalías que conviene revisar cuanto antes para evitar averías mayores."],
[30, "La rotación periódica de neumáticos en un vehículo tiene como finalidad:", ["Reducir el consumo de combustible de forma directa", "Aumentar la velocidad máxima del vehículo", "Sustituir la necesidad de revisar la presión", "Conseguir un desgaste más uniforme entre todas las ruedas"], 3, "Rotar los neumáticos entre los distintos ejes ayuda a igualar su desgaste, prolongando su vida útil."],
[30, "El nivel de líquido limpiaparabrisas de un vehículo debe revisarse periódicamente para:", ["Mejorar el rendimiento del motor", "Evitar el desgaste de los neumáticos", "Garantizar una correcta limpieza del parabrisas durante la conducción", "Sustituir el líquido refrigerante del motor"], 2, "Un nivel adecuado de líquido limpiaparabrisas asegura poder limpiar el cristal cuando sea necesario para mantener la visibilidad."],
[30, "El par de apriete correcto en las tuercas de las ruedas de un vehículo es importante para:", ["Reducir el consumo de combustible directamente", "Sustituir la necesidad de revisar la presión de los neumáticos", "Evitar que la rueda se afloje o se dañen los espárragos", "Aumentar la velocidad máxima del vehículo"], 2, "Un apriete inadecuado (excesivo o insuficiente) puede provocar el aflojamiento de la rueda o dañar los elementos de sujeción."],
[30, "La comprobación del estado de las correas del motor de un vehículo forma parte de:", ["Un trámite administrativo sin relación mecánica", "Una tarea exclusiva de la Inspección Técnica de Vehículos", "Una revisión que nunca afecta al funcionamiento del vehículo", "El mantenimiento preventivo básico recomendado por el fabricante"], 3, "Las correas desgastadas pueden romperse y afectar gravemente al funcionamiento del motor, por lo que forman parte del mantenimiento preventivo habitual."],
[30, "El símbolo de advertencia en el tablero de un vehículo relativo a la presión de los neumáticos indica:", ["Una avería en el sistema de climatización", "Un problema en la batería del vehículo", "Un fallo en el sistema de frenos", "Que uno o más neumáticos presentan una presión distinta a la recomendada"], 3, "Los sistemas de control de presión de neumáticos avisan cuando la presión se aleja de los valores recomendados por el fabricante."],
[30, "La revisión del filtro de aire del motor de un vehículo es relevante porque un filtro obstruido puede provocar:", ["Una mejora automática de la potencia del motor", "Una reducción del rendimiento del motor y mayor consumo de combustible", "Ningún efecto relevante sobre el funcionamiento del vehículo", "Una reducción del desgaste de los neumáticos"], 1, "Un filtro de aire obstruido dificulta la combustión adecuada, afectando negativamente al rendimiento y consumo del motor."],
[20, "Ante una llamada telefónica de aviso de bomba u otra amenaza recibida en el puesto de control de acceso, la actuación prioritaria es:", ["Mantener la calma, recabar el máximo de datos posibles y activar el protocolo establecido", "Comunicarlo únicamente al finalizar la jornada", "Ignorar la llamada si parece una broma", "Colgar inmediatamente sin recabar ninguna información"], 0, "Recabar información y seguir el protocolo de seguridad es la pauta recomendada ante cualquier amenaza telefónica, sin prejuzgar su veracidad."],
[20, "El uso de un torno o barrera física en el acceso a un edificio tiene como finalidad principal:", ["Decorar la entrada del edificio", "Reducir la necesidad de identificación", "Regular el paso ordenado de personas y reforzar el control de acceso", "Sustituir completamente al personal de control"], 2, "Estos elementos físicos ayudan a ordenar el flujo de personas y refuerzan, sin sustituir, el control ejercido por el personal."],
[20, "Ante la comprobación de que una persona visitante ha superado el tiempo previsto de visita sin salir del edificio, la actuación recomendada es:", ["Anular las acreditaciones de todas las personas visitantes", "Ignorar la circunstancia sin ninguna comprobación", "Bloquear todas las salidas del edificio de forma inmediata", "Verificar su situación con el departamento visitado, siguiendo el protocolo interno"], 3, "Contactar con el departamento visitado permite verificar la situación de forma proporcionada, sin adoptar medidas desproporcionadas."],
[20, "La formación en atención al público del personal de control de acceso debe incluir, entre otros contenidos:", ["Contenidos ajenos a la atención a personas", "Técnicas de comunicación y gestión de situaciones conflictivas", "Formación jurídica especializada en derecho penal", "Exclusivamente contenidos técnicos de cerrajería"], 1, "La atención a personas visitantes, incluidas situaciones difíciles, requiere formación específica en comunicación y gestión de conflictos."],
[20, "Ante un corte de suministro eléctrico que afecta al sistema de control de acceso electrónico, se debe:", ["Activar el protocolo de contingencia manual previsto", "Permitir el acceso sin ningún tipo de registro ni control", "Abandonar el puesto de control", "Impedir cualquier acceso hasta que se restablezca la corriente"], 0, "Los protocolos de contingencia permiten mantener un control básico manual ante fallos técnicos, evitando tanto el bloqueo total como la ausencia de control."],
[20, "El trato hacia todas las personas visitantes en el control de acceso debe regirse por el principio de:", ["Igualdad de trato, sin discriminación por ningún motivo", "Prioridad exclusiva según la apariencia de la persona", "Discrecionalidad total sin ningún criterio", "Preferencia según el nivel de estudios de la persona"], 0, "La igualdad de trato es un principio básico de la atención a la ciudadanía, también aplicable a las funciones de control de acceso."],
[20, "Un plano de evacuación visible en el puesto de control de acceso permite:", ["Sustituir el plan de autoprotección completo", "Reducir la necesidad de simulacros periódicos", "Conocer las vías de salida y apoyar la gestión de una emergencia", "Decorar el puesto de trabajo"], 2, "Tener el plano a la vista facilita una respuesta más rápida y coordinada del personal de control en caso de emergencia."],
[20, "Ante la detección de una persona que intenta acceder tras haber sido previamente expulsada del edificio por motivos disciplinarios, la actuación correcta es:", ["Denegar el acceso y, si es necesario, avisar al responsable de seguridad", "Resolver la situación por cuenta propia sin dar parte a nadie", "Ignorar la situación si la persona se muestra tranquila", "Permitir el acceso para evitar un conflicto"], 0, "Corresponde respetar la medida adoptada y seguir el protocolo interno, dando parte a quien corresponda si la situación lo requiere."],
[21, "El orden del día de una reunión debe estar disponible, como buena práctica organizativa:", ["Únicamente si lo solicita expresamente la persona que preside", "Nunca, al considerarse información confidencial", "Solo al finalizar la reunión", "Antes del inicio del acto, para que el personal de apoyo pueda prepararlo adecuadamente"], 3, "Conocer el orden del día con antelación permite preparar la sala, los materiales y los medios técnicos conforme al desarrollo previsto del acto."],
[21, "La previsión de asientos accesibles para personas con movilidad reducida en un acto público debe planificarse:", ["Exclusivamente en la última fila de la sala", "Solo si lo solicita expresamente una persona con discapacidad", "Con antelación, en zonas de fácil acceso y evacuación", "Nunca, al ser una cuestión menor"], 2, "Prever este tipo de plazas con antelación forma parte de la accesibilidad universal en la organización de actos públicos."],
[21, "Ante la necesidad de grabar en vídeo un acto institucional, es importante comprobar previamente:", ["El correcto encuadre, sonido y almacenamiento del dispositivo de grabación", "El horario de finalización exacto del acto, sin más comprobaciones", "La opinión personal del técnico sobre el contenido del acto", "Únicamente el color del fondo de la sala"], 0, "Verificar el equipo de grabación con antelación evita perder contenido relevante por fallos técnicos durante el acto."],
[21, "El servicio de catering o refrigerio en una reunión institucional debe coordinarse, entre otros aspectos, según:", ["El color corporativo del organismo", "El presupuesto anual completo del departamento", "El número de asistentes y el horario previsto del acto", "La antigüedad del edificio"], 2, "Conocer el número de asistentes y el horario permite ajustar adecuadamente el servicio de catering a las necesidades reales del acto."],
[21, "Ante la ausencia imprevista de la persona encargada de la megafonía justo antes de un acto, el personal de apoyo debe:", ["Suspender automáticamente el acto sin buscar alternativas", "Buscar una solución alternativa inmediata siguiendo el protocolo interno disponible", "Ignorar la incidencia y comenzar el acto sin sonido", "Culpar públicamente a la persona ausente durante el acto"], 1, "Contar con protocolos de contingencia y buscar soluciones inmediatas minimiza el impacto de imprevistos de última hora."],
[21, "La recogida de firmas de asistencia en una reunión o formación sirve para:", ["Sustituir el acta de la reunión", "Determinar el salario de los asistentes", "Dejar constancia documental de la participación de cada persona", "Evaluar el rendimiento del personal asistente"], 2, "El registro de firmas certifica quién ha asistido efectivamente al acto, siendo útil a efectos de justificación o control interno."],
[21, "Al recibir a una autoridad o cargo institucional en un acto, el protocolo de acogida incluye habitualmente:", ["Un trato idéntico al de cualquier persona sin distinción protocolaria", "Una recepción organizada conforme al orden de precedencia correspondiente", "La improvisación total del recibimiento", "Ausencia de cualquier organización específica"], 1, "En actos institucionales, el protocolo de precedencia determina cómo se organiza la recepción de las autoridades asistentes."],
[22, "El mantenimiento de un nivel adecuado de existencias de consumibles de oficina (papel, tóner, grapas) es importante para:", ["Sustituir el control de calidad de los documentos", "Aumentar el gasto innecesario del departamento", "Reducir la necesidad de mantenimiento de los equipos", "Evitar interrupciones en las tareas administrativas del día a día"], 3, "Disponer de existencias suficientes de consumibles evita retrasos en tareas cotidianas por falta de material."],
[22, "El uso de fundas o carpetas colgantes en un archivador tiene como finalidad:", ["Reducir el espacio de almacenamiento necesario", "Facilitar la clasificación y localización de documentos por categorías", "Sustituir el índice del archivo", "Eliminar la necesidad de etiquetado"], 1, "Las carpetas colgantes organizadas por categorías facilitan la localización rápida de los documentos archivados."],
[22, "Al preparar dossieres o carpetas informativas para una reunión, una tarea auxiliar habitual es:", ["Modificar el contenido de los documentos sin autorización", "Destruir los documentos sobrantes sin ningún criterio", "Sustituir el contenido por resúmenes propios no autorizados", "Ordenar y grapar o encuadernar los documentos según el índice previsto"], 3, "Preparar los dossieres conforme al índice previsto asegura que la documentación entregada esté completa y correctamente ordenada."],
[22, "La verificación de la calidad de impresión antes de una tirada grande de copias permite:", ["Sustituir la necesidad de revisar el contenido del documento", "Reducir la vida útil de la impresora", "Detectar errores de impresión evitando el desperdicio de material", "Aumentar el tiempo total de la tarea sin ningún beneficio"], 2, "Una comprobación previa evita imprimir un volumen elevado de copias defectuosas, ahorrando tiempo y material."],
[22, "El uso de separadores o pestañas en una carpeta de gran volumen documental tiene como finalidad:", ["Reducir el grosor total de la carpeta", "Facilitar la localización rápida de las distintas secciones del documento", "Aumentar el tiempo de consulta del documento", "Sustituir la necesidad de un índice general"], 1, "Los separadores permiten acceder directamente a una sección concreta sin necesidad de revisar todo el documento."],
[23, "La correcta identificación del código postal en un envío es importante porque:", ["Determina el precio del envío exclusivamente por peso", "No tiene ninguna influencia en el proceso de reparto", "Facilita y agiliza la clasificación y reparto del envío", "Sustituye la necesidad de indicar la dirección completa"], 2, "El código postal es clave en los sistemas automatizados de clasificación postal, agilizando el reparto correcto del envío."],
[23, "Ante un envío internacional, además de los datos habituales, suele ser necesario indicar:", ["Únicamente el nombre del destinatario", "La fecha de nacimiento del destinatario", "El color del embalaje", "El país de destino de forma clara y, en su caso, información aduanera"], 3, "Los envíos internacionales requieren datos adicionales, como el país de destino, y en ciertos casos, información aduanera del contenido."],
[23, "La firma de conformidad al recibir un envío certificado implica:", ["Reconocer la recepción efectiva del envío en ese momento", "Aceptar automáticamente el contenido sin ninguna reserva posible", "Anular el envío recibido", "Sustituir cualquier trámite posterior relacionado con el envío"], 0, "La firma certifica el momento de la entrega, sin perjuicio de que puedan plantearse incidencias posteriores sobre el contenido si procede."],
[23, "El registro de salida de correspondencia oficial permite, entre otras funciones:", ["Acreditar la fecha en que un documento salió del organismo hacia su destinatario", "Eliminar la necesidad de conservar copia del documento enviado", "Determinar el coste total del envío", "Sustituir el registro de entrada del destinatario"], 0, "El registro de salida certifica cuándo se remitió oficialmente un documento, siendo relevante para el cómputo de plazos y el control documental."],
[23, "Ante un envío de gran volumen o peso que supera las condiciones habituales del servicio postal ordinario, conviene:", ["Consultar previamente las condiciones del servicio de paquetería adecuado", "Enviarlo igualmente sin comprobar ninguna condición", "Rechazar cualquier envío que no sea de tamaño estándar", "Fraccionar el envío sin ningún criterio"], 0, "Comprobar previamente las condiciones del servicio evita incidencias o la devolución del envío por incumplir los requisitos del servicio elegido."],
[24, "La zonificación de un almacén (dividirlo en áreas según el tipo de material) tiene como finalidad:", ["Organizar el espacio de forma lógica, facilitando la gestión y la seguridad", "Aumentar el tiempo de búsqueda de los materiales", "Sustituir la necesidad de control de existencias", "Reducir la superficie útil del almacén"], 0, "Zonificar el almacén facilita tanto la localización de materiales como la aplicación de medidas de seguridad específicas según el tipo de producto."],
[24, "El almacenamiento de material de oficina (papel, consumibles) no requiere, con carácter general, las mismas medidas que el almacenamiento de:", ["Documentación administrativa", "Productos químicos o materiales peligrosos", "Otro material de oficina similar", "Mobiliario ligero"], 1, "El material de oficina convencional no presenta los riesgos asociados a productos químicos o peligrosos, que exigen medidas específicas adicionales."],
[24, "Ante la recepción de un pedido de material con daños visibles en el embalaje, la actuación adecuada es:", ["Almacenarlo directamente sin ninguna comprobación", "Rechazar automáticamente todo el pedido sin verificar el contenido", "Ignorar el daño si el pedido no es urgente", "Verificar el contenido y dejar constancia de la incidencia antes de su almacenamiento"], 3, "Comprobar el contenido y documentar la incidencia permite gestionar correctamente una posible reclamación al proveedor."],
[24, "La altura máxima de apilado de cajas en un almacén debe respetar, entre otros criterios:", ["El número de personas disponibles en ese momento", "La rapidez con la que se quiera completar la tarea", "La resistencia de las cajas inferiores y la estabilidad del conjunto", "Únicamente el criterio estético del almacén"], 2, "Superar la resistencia o estabilidad del apilado puede provocar el colapso de la pila, con riesgo para personas y materiales."],
[25, "La codificación interna de materiales mediante números o referencias facilita, entre otras ventajas:", ["Aumentar el precio de los materiales", "Evitar confusiones entre productos con nombres similares", "Reducir la necesidad de personal de almacén", "Sustituir la necesidad de fichas de control"], 1, "Un sistema de codificación claro evita errores derivados de la similitud en la denominación de distintos productos."],
[25, "El control de existencias mediante hojas de cálculo o programas informáticos, frente al registro manual en papel, ofrece como ventaja principal:", ["Mayor rapidez y facilidad para consultar y actualizar la información", "Un coste siempre inferior en cualquier caso", "La eliminación total de cualquier posibilidad de error", "La sustitución completa de los inventarios físicos periódicos"], 0, "Los sistemas informáticos agilizan la consulta y actualización de datos, aunque no eliminan la necesidad de verificaciones físicas periódicas."],
[25, "Ante una entrada de material sin el correspondiente pedido previo registrado, la actuación adecuada es:", ["Incorporarlo automáticamente sin ninguna comprobación", "Destruirlo por precaución", "Verificar su procedencia antes de incorporarlo al registro de existencias", "Rechazarlo siempre de forma sistemática"], 2, "Verificar la procedencia de un material no esperado evita incorporar errores o materiales no autorizados al control de existencias."],
[25, "El uso de un sistema de doble verificación (una persona registra, otra comprueba) en el control de existencias tiene como finalidad:", ["Aumentar el tiempo de gestión sin ninguna ventaja", "Reducir el riesgo de errores en el registro de entradas y salidas", "Duplicar innecesariamente el trabajo sin ningún beneficio", "Sustituir la necesidad de inventario físico"], 1, "La doble verificación es una medida de control que reduce la probabilidad de errores en el registro de movimientos de material."],
[26, "El uso de eslingas o cinchas para la elevación de cargas con equipos mecánicos exige, entre otras comprobaciones:", ["Elevar la carga sin comprobar su equilibrio", "Verificar que su capacidad es adecuada para el peso de la carga a elevar", "Prescindir de cualquier revisión periódica del equipo", "Utilizar cualquier eslinga disponible sin comprobar su estado"], 1, "Comprobar la capacidad y el estado de las eslingas es esencial para evitar su rotura durante la elevación de una carga."],
[26, "El transporte de materiales de vidrio o frágiles requiere, entre otras precauciones:", ["Apilarlos sin ninguna protección intermedia", "Ninguna precaución especial respecto a otros materiales", "Un embalaje o sujeción adecuados que eviten golpes durante el desplazamiento", "Transportarlos siempre a la máxima velocidad posible"], 2, "Los materiales frágiles requieren protección adicional frente a golpes o vibraciones durante su manejo y transporte."],
[26, "Ante el uso compartido de un montacargas o ascensor de servicio para materiales y personas, se debe respetar:", ["Las normas de uso y capacidad máxima establecidas para cada situación", "La prioridad absoluta de los materiales sobre las personas en todo momento", "Ninguna limitación específica", "El uso exclusivo para materiales en cualquier caso"], 0, "Respetar las normas de uso y capacidad evita situaciones de riesgo tanto para las personas como para los materiales transportados."],
[26, "La revisión periódica de las cadenas o cables de un equipo de elevación tiene como finalidad:", ["Sustituir la necesidad de formación del personal operador", "Reducir el peso máximo de la carga admitida", "Aumentar la velocidad de elevación del equipo", "Detectar desgastes o daños que puedan comprometer su resistencia"], 3, "Un cable o cadena desgastados pueden romperse durante el uso, por lo que su revisión periódica es una medida de seguridad esencial."],

/* ============ STORAGE (window.storage con fallback a localStorage) ============ */
async function storageGet(key){
  try{ if(window.storage){ const r = await window.storage.get(key); return r ? r.value : null; } }catch(e){}
  try{ return localStorage.getItem(key); }catch(e){}
  return null;
}
async function storageSet(key,value){
  try{ if(window.storage){ await window.storage.set(key,value); return; } }catch(e){}
  try{ localStorage.setItem(key,value); }catch(e){}
}

function buildAll(){
  const out=[];
  QUESTIONS.forEach((q,i)=> out.push({id:'b'+i, tema:q[0], question:q[1], options:q[2], correct:q[3], explanation:q[4]||null}));
  customQuestions.forEach((q,i)=> out.push({id:'c'+i, tema:q[0], question:q[1], options:q[2], correct:q[3], explanation:q[4]||null}));
  return out;
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

async function loadAll(){
  try{ const un = await storageGet('user_name'); if(un) userName = un; }catch(e){}
  try{ const c = await storageGet('custom_questions'); if(c) customQuestions = JSON.parse(c); }catch(e){}
  try{ const f = await storageGet('failed_ids'); if(f) failedIds = new Set(JSON.parse(f)); }catch(e){}
  try{ const fl = await storageGet('flagged_ids'); if(fl) flaggedIds = new Set(JSON.parse(fl)); }catch(e){}
  try{ const qs = await storageGet('question_stats'); if(qs) questionStats = JSON.parse(qs); }catch(e){}
  try{ const s = await storageGet('tema_stats'); if(s) temaStats = JSON.parse(s); }catch(e){}
  try{ const d = await storageGet('dark_mode'); if(d) darkMode = d === '1'; }catch(e){}
  try{ const s = await storageGet('sound_enabled'); if(s!==null && s!==undefined) soundEnabled = s === '1'; }catch(e){}
  try{ const fs = await storageGet('font_size'); if(fs) fontSize = fs; }catch(e){}
  try{ const em = await storageGet('exam_mode'); if(em){ examMode = em === '1'; examModePreference = examMode; } }catch(e){}
  try{
    const migrated = await storageGet('exam_mode_fix_v1');
    if(!migrated){
      // Corrige un valor de "modo examen" que pudo quedar mal guardado por un fallo anterior del simulacro oficial
      examMode = false; examModePreference = false;
      await storageSet('exam_mode', '0');
      await storageSet('exam_mode_fix_v1', '1');
    }
  }catch(e){}
  try{ const sh = await storageGet('sessions_history'); if(sh) sessionsHistory = JSON.parse(sh); }catch(e){}
  try{ const tt = await storageGet('total_tests'); if(tt) totalTestsCompleted = Number(tt)||0; }catch(e){}
  try{ const sd = await storageGet('study_dates'); if(sd) studyDates = new Set(JSON.parse(sd)); }catch(e){}
  applyDarkMode();
  applyFontSize();
  render();
}

function sendLog(accion, extra){
  if(!SHEET_WEBHOOK_URL) return; // sin URL configurada, no se envía nada a ningún sitio
  try{
    const payload = Object.assign({
      nombre: userName || "(sin nombre)",
      accion: accion,
      fechaCliente: new Date().toLocaleString('es-ES'),
    }, extra || {});
    fetch(SHEET_WEBHOOK_URL, {
      method: 'POST',
      mode: 'no-cors', // Apps Script no admite CORS estándar; no leemos respuesta, solo enviamos
      headers: {'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(()=>{ /* sin conexión: se ignora silenciosamente, no interrumpe el uso de la app */ });
  }catch(e){ /* nunca debe romper la app por un fallo de red */ }
}

let _audioCtx = null;
function getAudioCtx(){
  if(!_audioCtx){
    try{ _audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return null; }
  }
  if(_audioCtx.state === 'suspended'){ _audioCtx.resume(); }
  return _audioCtx;
}
function playTone(freq, startTime, duration, ctx, type='sine', gainPeak=0.18){
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, startTime);
  gain.gain.setValueAtTime(0, startTime);
  gain.gain.linearRampToValueAtTime(gainPeak, startTime+0.015);
  gain.gain.exponentialRampToValueAtTime(0.0001, startTime+duration);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(startTime); osc.stop(startTime+duration+0.02);
}
function playCorrectSound(){
  if(!soundEnabled) return;
  const ctx = getAudioCtx(); if(!ctx) return;
  const now = ctx.currentTime;
  playTone(587.33, now, 0.11, ctx, 'sine');       // Re5
  playTone(880.00, now+0.09, 0.16, ctx, 'sine');  // La5
}
function playWrongSound(){
  if(!soundEnabled) return;
  const ctx = getAudioCtx(); if(!ctx) return;
  const now = ctx.currentTime;
  playTone(196.00, now, 0.22, ctx, 'sawtooth', 0.12);     // Sol3
  playTone(174.61, now+0.1, 0.24, ctx, 'sawtooth', 0.12); // Fa3
}

function computeStreak(){
  let streak = 0;
  const d = new Date();
  const todayStr = d.toISOString().slice(0,10);
  if(!studyDates.has(todayStr)){ d.setDate(d.getDate()-1); }
  while(true){
    const s = d.toISOString().slice(0,10);
    if(studyDates.has(s)){ streak++; d.setDate(d.getDate()-1); }
    else break;
  }
  return streak;
}

function weakestTemas(n){
  return Object.entries(TEMAS).map(([num,name])=>{
    const st = temaStats[num]||{attempts:0,correct:0};
    const pct = st.attempts>0 ? st.correct/st.attempts*100 : null;
    return {num:Number(num), name, pct, attempts:st.attempts};
  }).filter(t=>t.pct!==null && t.attempts>=3).sort((a,b)=>a.pct-b.pct).slice(0,n);
}

function allQuestions_count(){ return QUESTIONS.length + customQuestions.length; }

function renderQuiz(){
  const q = quizPool[currentIndex];
  const answered = answers[currentIndex];
  const progressPct = Math.round((currentIndex/quizPool.length)*100);
  const letters = ["A","B","C","D"];
  const isFlagged = flaggedIds.has(q.id);

  const showFeedback = answered && !examMode;
  const optionsHtml = q.options.map((opt,i)=>{
    let cls = "option";
    if(showFeedback){
      cls += " disabled";
      if(i===q.correct) cls += " correct";
      else if(i===answered.chosen) cls += " wrong";
    } else if(examMode && answered && i===answered.chosen){
      cls += " selected";
    }
    return `<div class="${cls}" data-opt="${i}"><span class="letter">${letters[i]}</span><span>${opt}</span></div>`;
  }).join("");

  let feedback = "";
  if(showFeedback){
    if(answered.chosen === q.correct){
      feedback = `<div class="feedback ok">Correcto.</div>`;
    } else if(answered.chosen === null){
      feedback = `<div class="feedback no">Sin responder. La correcta es la <b>${letters[q.correct]}) ${q.options[q.correct]}</b>.</div>`;
    } else {
      feedback = `<div class="feedback no">Incorrecto. La respuesta correcta es la <b>${letters[q.correct]}) ${q.options[q.correct]}</b>.</div>`;
    }
    if(q.explanation){
      feedback += `<div class="small" style="margin-top:6px;">${q.explanation}</div>`;
    }
    const qst = questionStats[q.id];
    if(qst && qst.fails>0){
      feedback += `<div class="small" style="margin-top:6px;color:var(--gold);">Ya has fallado esta pregunta ${qst.fails} ${qst.fails===1?'vez':'veces'} antes. Repásala con atención.</div>`;
    }
  }

  const timerHtml = quizEndTime ? `<div id="timerDisplay" class="timerBox">--:--</div>` : "";
  const isLast = currentIndex===quizPool.length-1;
  const canAdvance = examMode || answered;
  const nextLabel = isLast ? (examMode ? "Finalizar test" : "Ver resultados") : "Siguiente";

  return `
  <header class="app">
    <h1>Test en curso ${examMode?'<span class="tag" style="margin-left:8px;">MODO EXAMEN</span>':''}</h1>
    <div class="headerRight">
      <button class="iconBtn" id="soundToggle" title="${soundEnabled?'Silenciar sonidos':'Activar sonidos'}">${soundEnabled?'🔊':'🔇'}</button>
      ${timerHtml}
      <div class="tag">${currentIndex+1} / ${quizPool.length}</div>
    </div>
  </header>
  <div class="progress-bar"><div class="progress-fill" style="width:${progressPct}%"></div></div>
  <div class="card">
    <div class="qmeta">
      <span>Tema ${q.tema} · ${TEMAS[q.tema]||''}</span>
      <button class="flagBtn ${isFlagged?'active':''}" id="flagBtn" title="Marcar como duda">${isFlagged?'★ Duda':'☆ Marcar duda'}</button>
    </div>
    <p class="qtext">${q.question}</p>
    ${optionsHtml}
    ${feedback}
  </div>
  <div class="footer-nav">
    <button class="btn secondary" id="quitBtn">Salir</button>
    ${examMode ? `<button class="btn secondary" id="prevBtn" ${currentIndex===0?'disabled':''}>Anterior</button>` : ""}
    <button class="btn" id="nextBtn" ${canAdvance?'':'disabled'}>${nextLabel}</button>
  </div>
  ${examMode && !isLast ? `<div style="text-align:center;margin-top:12px;"><a class="link-btn" id="finishNowBtn">Finalizar test ahora</a></div>` : ""}
  `;
}

function renderEvolutionCard(){
  if(sessionsHistory.length<2) return "";
  const recent = sessionsHistory.slice(-12);
  const w = 300, h = 70, pad = 6;
  const stepX = (w-2*pad)/(recent.length-1);
  const pts = recent.map((s,i)=>{
    const x = pad + i*stepX;
    const y = pad + (h-2*pad) * (1 - s.pct/100);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(" ");
  const circles = recent.map((s,i)=>{
    const x = pad + i*stepX;
    const y = pad + (h-2*pad) * (1 - s.pct/100);
    return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.5" fill="var(--green)"></circle>`;
  }).join("");
  const first = recent[0].pct, last = recent[recent.length-1].pct;
  const trend = last>=first ? "↑" : "↓";
  return `
  <div class="card">
    <h2 class="section">Tu evolución (últimos ${recent.length} tests)</h2>
    <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px;overflow:visible;">
      <polyline points="${pts}" fill="none" stroke="var(--green)" stroke-width="2"></polyline>
      ${circles}
    </svg>
    <p class="small" style="margin-top:6px;">De ${first}% a ${last}% de acierto ${trend}</p>
  </div>`;
}

function renderResults(){
  const total = quizPool.length;
  let correctCount=0, wrongCount=0, blankCount=0, netScore=0;
  answers.forEach((a,i)=>{
    const q = quizPool[i];
    if(a.chosen===null){ blankCount++; }
    else if(a.chosen===q.correct){ correctCount++; netScore += 1; }
    else{ wrongCount++; netScore -= penaltyFraction; }
  });
  const notaSobre10 = (netScore/total*10).toFixed(2);

  const byTema = {};
  answers.forEach((a,i)=>{
    const q = quizPool[i];
    if(!byTema[q.tema]) byTema[q.tema] = {ok:0,total:0};
    byTema[q.tema].total++;
    if(a.chosen===q.correct) byTema[q.tema].ok++;
  });
  const temaRows = Object.entries(byTema).sort((a,b)=>a[0]-b[0]).map(([tema,v])=>{
    return `<div class="tema-result"><span>Tema ${tema} · ${TEMAS[tema]}</span><span class="badge">${v.ok}/${v.total}</span></div>`;
  }).join("");

  const wrongList = answers.map((a,i)=>({a,q:quizPool[i]})).filter(x=>x.a.chosen!==x.q.correct).map(({a,q})=>{
    const letters=["A","B","C","D"];
    const tuResp = a.chosen===null ? "sin responder" : `${letters[a.chosen]}) ${q.options[a.chosen]}`;
    return `<div class="card" style="padding:16px;">
      <div class="qmeta">Tema ${q.tema}</div>
      <p style="margin:0 0 8px;font-size:.95rem;">${q.question}</p>
      <p class="small" style="margin:0;">Tu respuesta: ${tuResp}<br>Correcta: ${letters[q.correct]}) ${q.options[q.correct]}</p>
    </div>`;
  }).join("");

  const totalMs = questionElapsed.reduce((a,b)=>a+b,0);
  const avgMs = total>0 ? totalMs/total : 0;
  const avgSec = Math.round(avgMs/1000);
  const avgTimeStr = avgSec>=60 ? `${Math.floor(avgSec/60)} min ${avgSec%60}s` : `${avgSec}s`;

  return `
  ${headerHtml("Resultados", total + " preguntas")}
  <div class="card" style="text-align:center;">
    <div class="score-big">${correctCount}/${total}</div>
    <div class="small" style="margin-top:6px;">${correctCount} aciertos · ${wrongCount} fallos · ${blankCount} en blanco</div>
    <div class="small" style="margin-top:6px;">Tiempo medio por pregunta: <b>${avgTimeStr}</b></div>
    ${penaltyFraction>0 ? `<div class="small" style="margin-top:10px;">Nota con penalización: <b>${netScore.toFixed(2)}</b> puntos (${notaSobre10} sobre 10)</div>` : ""}
  </div>
  ${renderEvolutionCard()}
  <div class="card">
    <h2 class="section">Resultado por tema</h2>
    ${temaRows}
  </div>
  ${wrongList ? `<h2 class="section" style="margin:20px 0 12px;">Repaso de fallos</h2>${wrongList}` : `<p class="small">¡Sin fallos! Buen trabajo.</p>`}
  <div class="row" style="margin-top:16px;">
    <button class="btn wide" id="backHome">Volver al inicio</button>
    ${wrongCount>0 ? `<button class="btn secondary wide" id="exportFails">Exportar fallos (.txt)</button>` : ""}
  </div>
  `;
}

function renderStats(){
  const rows = Object.entries(TEMAS).map(([num,name])=>{
    const st = temaStats[num] || {attempts:0, correct:0};
    const pct = st.attempts>0 ? Math.round(st.correct/st.attempts*100) : null;
    return {num,name,attempts:st.attempts,correct:st.correct,pct};
  }).sort((a,b)=>{
    if(a.pct===null && b.pct===null) return a.num-b.num;
    if(a.pct===null) return 1;
    if(b.pct===null) return -1;
    return a.pct-b.pct;
  });

  const rowsHtml = rows.map(r=>{
    const pctDisplay = r.pct===null ? "—" : r.pct+"%";
    const barWidth = r.pct===null ? 0 : r.pct;
    return `<div class="statRow">
      <span class="name">T${r.num} · ${r.name}</span>
      <div class="statBar"><div style="width:${barWidth}%"></div></div>
      <span class="pct">${pctDisplay}</span>
    </div>`;
  }).join("");

  return `
  ${headerHtml("Estadísticas", "por tema")}
  <div class="card">
    <p class="small">Acumulado de todas tus sesiones de test, ordenado de peor a mejor % de acierto, para ver de un vistazo qué temas tienes más flojos.</p>
    ${rowsHtml}
  </div>
  <div class="row">
    <button class="btn wide" id="backHome3">Volver al inicio</button>
    <button class="link-btn" id="resetStats">Reiniciar estadísticas</button>
  </div>
  `;
}
