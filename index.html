[24, "El almacenamiento de líquidos en garrafas o bidones debe realizarse, como norma general:", ["Directamente sobre el suelo con escasa base ni sujeción", "Apilados sin límite de altura", "Sobre superficies estables y con sistemas de contención ante posibles derrames", "Junto a fuentes de calor con escasa distancia de seguridad"], 2, "Una base estable y sistemas de contención (cubetos) reducen el riesgo de vertidos y sus consecuencias si se produce un derrame."],
[24, "La rotulación de 'prohibido fumar' en una zona de almacenamiento de materiales inflamables tiene como finalidad:", ["Detallar la composición química completa del producto", "Prevenir un foco de ignición evidente en una zona de riesgo", "Indicar el horario de trabajo del personal", "Decorar la zona de almacenamiento"], 1, "Es una señalización de seguridad que informa de una prohibición directamente relacionada con la prevención de incendios en zonas de riesgo."],
[24, "El uso de contenedores homologados para residuos peligrosos almacenados temporalmente es obligatorio porque:", ["Reduce el volumen de residuos generado", "Elimina el riesgo de derrame durante su transporte", "Es una recomendación sin carácter obligatorio", "Garantiza una contención adecuada y facilita su gestión posterior por un gestor autorizado"], 3, "Los contenedores homologados garantizan la contención y trazabilidad adecuadas de los residuos peligrosos hasta su retirada por un gestor autorizado."],
[25, "Una ficha de control de existencias recoge habitualmente, entre otros datos:", ["El nombre del proveedor", "La ubicación geográfica del edificio", "Las entradas, salidas y el saldo o stock disponible de un material", "El horario laboral del almacén"], 2, "Permite llevar un seguimiento actualizado de las cantidades disponibles de cada material a lo largo del tiempo."],
[25, "El albarán de entrega, en el control de existencias, es el documento que:", ["Se utiliza para material peligroso", "Es opcional y aporta escaso control documental", "Acompaña a la mercancía y detalla los artículos entregados, sin efectos fiscales de factura", "Sirve como justificante principal para la declaración de impuestos"], 2, "El albarán certifica la entrega física de la mercancía; la factura, si procede, es un documento distinto de efectos fiscales."],
[25, "El inventario periódico de existencias tiene como finalidad principal:", ["Comprobar que el stock físico coincide con los registros documentales", "Determinar el precio de compra de cada artículo", "Reducir automáticamente el precio de los materiales", "Eliminar la necesidad de fichas de control"], 0, "El inventario permite detectar diferencias entre lo registrado y lo realmente disponible, corrigiendo posibles errores o pérdidas."],
[25, "El stock de seguridad de un material es:", ["El material que se considera obsoleto", "La cantidad máxima permitida legalmente", "El material pendiente de devolución al proveedor", "La cantidad mínima que se mantiene en almacén para evitar rupturas de suministro"], 3, "Es un colchón de existencias mínimo que evita quedarse sin material ante retrasos de suministro o picos de demanda."],
[25, "El registro de salidas de material debe reflejar, entre otros datos:", ["La firma del almacenista", "La cantidad, fecha y destino o solicitante del material entregado", "El precio de compra original del material", "La marca del vehículo de transporte utilizado"], 1, "Estos datos permiten trazar el uso del material y mantener actualizado el control de existencias."],
[25, "El control de existencias mediante código de barras o etiquetas identificativas facilita:", ["Eliminar la necesidad de personal en el almacén", "Un seguimiento más ágil y preciso de las entradas y salidas de material", "Eliminar la necesidad de cualquier registro documental", "Aumentar el precio de los materiales almacenados"], 1, "El uso de códigos identificativos agiliza el registro de movimientos y reduce errores respecto al control manual."],
[25, "La diferencia entre el stock teórico (registrado) y el stock físico (real) de un almacén se denomina habitualmente:", ["Rotura de stock", "Descuadre o desviación de inventario", "Punto de pedido", "Stock de seguridad"], 1, "Cuando lo registrado documentalmente no coincide con lo que físicamente hay en el almacén, se produce un descuadre que conviene investigar y corregir."],
[25, "El punto de pedido de un material es:", ["El nivel de existencias a partir del cual conviene realizar un nuevo pedido", "La fecha de caducidad del producto", "La cantidad máxima que puede almacenarse", "El precio mínimo de venta del material"], 0, "Marca el nivel de stock que activa la necesidad de reponer el material antes de que se agote."],
[25, "Una ficha de material bien cumplimentada debe permitir conocer, en cualquier momento:", ["La cantidad disponible y el histórico de movimientos de ese material", "El nombre del proveedor habitual", "La ubicación exacta de la sede central del organismo", "El precio de venta al público"], 0, "Una ficha de material actualizada es una herramienta de control que refleja la situación y el histórico de un material concreto."],
[25, "Ante una rotura de stock (falta de existencias) de un material esencial, la actuación recomendada es:", ["Ignorar la situación hasta la siguiente revisión periódica", "Informar a quien corresponda para gestionar una reposición urgente", "Reducir el registro de salidas para disimular la falta de stock", "Reclamar el material a un proveedor distinto sin autorización"], 1, "Comunicar la rotura de stock permite activar cuanto antes el proceso de reposición y minimizar el impacto en el servicio."],
[25, "La revisión periódica de las fechas de caducidad de los materiales almacenados es especialmente relevante en:", ["Mobiliario de oficina de uso duradero", "Productos químicos, sanitarios o de consumo con vida útil limitada", "Materiales metálicos con escasa caducidad", "Documentación archivada permanentemente"], 1, "Los productos con vida útil limitada requieren un seguimiento específico de caducidad para evitar su uso indebido una vez vencidos."],
[25, "El sistema de gestión de almacén conocido como ABC clasifica los materiales según:", ["Su importancia o valor relativo dentro del conjunto de existencias", "Su color de embalaje y presentación comercial", "El idioma de su etiquetado y documentación adjunta", "Su fecha de fabricación y caducidad del producto"], 0, "El análisis ABC prioriza el control según el valor o relevancia de cada material, dedicando más atención a los de mayor impacto."],
[25, "Una salida de material sin la documentación correspondiente puede provocar:", ["Descuadres en el control de existencias difíciles de justificar posteriormente", "Escaso efecto relevante en la gestión del almacén", "La reducción automática del stock de seguridad", "Una mejora automática del control de inventario"], 0, "Toda salida debe quedar documentada para mantener la trazabilidad y evitar descuadres entre el registro y las existencias reales."],
[25, "El código de referencia interno de un material en el control de existencias sirve para:", ["Determinar su ubicación exacta sin necesidad de etiquetado físico", "Determinar automáticamente su ubicación física en el almacén", "Fijar su precio de venta", "Identificarlo de forma unívoca dentro del sistema de gestión del almacén"], 3, "Un código de referencia único facilita la identificación y gestión del material dentro del sistema interno, evitando confusiones con productos similares."],
[25, "Ante una discrepancia detectada entre el inventario físico y el registrado, la actuación adecuada es:", ["Eliminar el material del registro sin más trámite", "Modificar el inventario físico para que coincida con el registro sin comprobar nada", "Investigar la causa y regularizar el registro conforme al procedimiento establecido", "Ignorar la diferencia si es de poca cuantía"], 2, "Investigar la causa antes de regularizar evita que errores o pérdidas se repitan sin ser detectados."],
[25, "La periodicidad del inventario de existencias puede variar según:", ["El color del almacén", "La hora del día en que se realice", "El tipo de material y su rotación o importancia", "El número de empleados del organismo, sin relación con el material"], 2, "Materiales de alta rotación o especial relevancia suelen requerir inventarios más frecuentes que otros de uso ocasional."],
[25, "El recuento cíclico de existencias consiste en:", ["Contar el inventario completo cada día laborable", "Eliminar cualquier revisión periódica del stock", "Requerir la paralización de toda la actividad del almacén durante varios días", "Revisar periódicamente una parte del inventario de forma rotativa, en vez de todo a la vez"], 3, "El recuento cíclico reparte la revisión del inventario a lo largo del tiempo, revisando distintas partes del almacén de forma rotativa."],
[25, "Un albarán no conformado (sin la firma de conformidad) puede generar, en el control de existencias:", ["Automáticamente el pago de la factura correspondiente", "Dudas sobre si la recepción del material fue correcta y completa", "La eliminación del registro de esa entrega", "Escasa consecuencia relevante"], 1, "La firma de conformidad certifica que lo recibido coincide con lo indicado en el albarán; su ausencia puede generar dudas o disputas posteriores."],
[25, "El etiquetado con fecha de recepción en los materiales almacenados facilita, entre otras funciones:", ["Determinar automáticamente el precio de venta del material", "Eliminar la necesidad de un inventario periódico", "Aplicar el criterio de rotación de existencias (primero en entrar, primero en salir)", "Determinar el proveedor habitual del material"], 2, "Conocer la fecha de recepción de cada lote es clave para aplicar correctamente el principio de rotación FIFO."],
[25, "Un exceso de existencias respecto a las necesidades reales puede suponer, entre otros inconvenientes:", ["Una mejora directa del control de calidad", "Escasa consecuencia relevante para la organización", "Una reducción automática de los costes de gestión", "Un uso ineficiente del espacio de almacenamiento y mayor riesgo de deterioro u obsolescencia"], 3, "El exceso de stock inmoviliza espacio y recursos, además de aumentar el riesgo de que el material se deteriore o quede obsoleto antes de usarse."],
[26, "El transporte de materiales combustibles o inflamables dentro de las instalaciones debe realizarse:", ["Con escasa precaución especial respecto a otros materiales", "Junto con materiales oxidantes en el mismo recipiente", "Sin señalización de escaso tipo", "Siguiendo los protocolos de seguridad establecidos, evitando fuentes de ignición próximas"], 3, "Estos materiales requieren protocolos específicos que reduzcan el riesgo de incendio o explosión durante su manejo y transporte."],
[26, "Antes de utilizar una carretilla o transpaleta para mover material, se debe comprobar:", ["Que no haya nadie más en el almacén", "El precio de adquisición del equipo", "El buen estado del equipo y que la carga esté correctamente estabilizada", "El color del equipo"], 2, "Verificar el estado del equipo y la estabilidad de la carga previene accidentes durante el desplazamiento del material."],
[26, "El uso de equipos de elevación de cargas por parte del personal exige, con carácter general:", ["Contar con la formación adecuada para su manejo seguro", "No requerir formación específica más allá de la experiencia previa", "Prescindir de la revisión periódica del equipo si funciona correctamente", "Estar reservado al personal externo con certificado específico"], 0, "El manejo de maquinaria de elevación requiere formación específica para minimizar riesgos tanto para el operario como para terceros."],
[26, "Ante el derrame accidental de un material inflamable durante su transporte, la actuación inmediata recomendada es:", ["Alejar cualquier fuente de ignición y seguir el protocolo de emergencia o limpieza establecido", "Continuar la tarea ignorando el derrame", "Encender luces o equipos eléctricos cercanos con escasa precaución", "Limpiar el derrame con cualquier material absorbente sin comprobar su idoneidad"], 0, "Alejar fuentes de ignición y seguir el protocolo establecido es la pauta básica de seguridad ante un derrame de material inflamable."],
[26, "El etiquetado de un material combustible durante su almacenamiento y movimiento tiene como finalidad:", ["Indicar su precio de venta", "Ser opcional según el criterio de cada trabajador", "Informar sobre su peligrosidad y las precauciones necesarias en su manejo", "Detallar el precio de mercado del material combustible"], 2, "El etiquetado normalizado (pictogramas de peligro) informa de forma rápida y clara sobre los riesgos del producto."],
[26, "El transporte de bombonas de gas dentro de unas instalaciones debe realizarse:", ["Rodándolas por el suelo para mayor rapidez", "Junto con materiales inflamables con escasa separación", "En posición vertical y con los medios de sujeción adecuados", "En cualquier posición con escasa sujeción"], 2, "El transporte vertical y bien sujeto de las bombonas de gas reduce el riesgo de fugas o daños en la válvula."],
[26, "Antes de utilizar una máquina o equipo de manejo de materiales por primera vez, el personal debe:", ["Esperar a que se produzca una avería para conocer sus limitaciones", "Utilizarla con escasa instrucción previa si parece sencilla", "Aprender por sí mismo mediante prueba y error", "Recibir la formación e información necesarias sobre su manejo seguro"], 3, "La formación previa es una obligación preventiva básica antes de utilizar cualquier equipo de trabajo, especialmente maquinaria."],
[26, "El etiquetado de recipientes que contienen materiales trasvasados desde su envase original debe:", ["Eliminarse al no tratarse ya del envase original", "Mantenerse igualmente identificado con la información de peligrosidad correspondiente", "Reducirse a una simple marca de color sin más detalle", "Cambiar según el país de origen de la mercancía"], 1, "Aunque se trasvase a otro recipiente, la información de peligrosidad debe mantenerse para garantizar una manipulación segura."],
[26, "El uso de equipos de protección individual (guantes, calzado de seguridad) en el manejo de materiales pesados o cortantes tiene como finalidad:", ["Aumentar la velocidad de ejecución de la tarea", "Eliminar la necesidad de evaluar el riesgo del material", "Reducir el precio del equipamiento de seguridad", "Reducir el riesgo de lesiones durante la manipulación"], 3, "Los EPI son una medida de protección complementaria frente a riesgos que no pueden eliminarse completamente en origen."],
[26, "Ante el traslado de equipos o maquinaria pesada dentro de unas instalaciones, es recomendable:", ["Improvisar el recorrido sobre la marcha", "Planificar previamente el itinerario y despejar la zona de paso", "Prescindir de cualquier señalización durante el traslado", "Realizar el traslado en horas de máxima afluencia de personal"], 1, "Planificar el itinerario y despejar la zona reduce el riesgo de golpes, caídas o daños tanto a personas como a materiales."],
[26, "El código de colores y pictogramas en el transporte de mercancías peligrosas tiene como finalidad:", ["Informar rápidamente sobre el tipo de riesgo del material transportado", "Indicar el destino del envío", "Decorar el vehículo o embalaje de transporte", "Determinar el precio del transporte de la mercancía"], 0, "Permite identificar visualmente y de forma inmediata el tipo de peligro asociado al material, facilitando una respuesta adecuada ante incidentes."],
[26, "Antes de mover una carga con una carretilla elevadora, se debe comprobar, entre otros aspectos:", ["El horario de trabajo del conductor, como aspecto principal", "El color de la carretilla, como aspecto principal", "Que la carga está bien sujeta y no supera la capacidad del equipo", "Que no haya luz solar directa en la zona"], 2, "Verificar la sujeción y el respeto a la capacidad máxima del equipo son comprobaciones básicas de seguridad antes de cualquier desplazamiento de carga."],
[26, "El almacenamiento y transporte de materiales combustibles debe alejarse, como norma general, de:", ["Áreas correctamente señalizadas", "Zonas con buena ventilación", "Espacios con temperatura controlada", "Fuentes de calor o posibles focos de ignición"], 3, "Evitar la proximidad a fuentes de calor o ignición es una medida básica de prevención frente a incendios en materiales combustibles."],
[26, "La formación en manejo de equipos de elevación de cargas debe incluir, entre otros contenidos:", ["Aspectos teóricos, sin apenas contenido práctico", "Contenidos generales, ajenos al equipo de trabajo concreto", "Información de tipo comercial sobre el fabricante", "Los límites de carga y las medidas de seguridad específicas del equipo"], 3, "Conocer los límites de carga y las medidas de seguridad específicas es esencial para un manejo seguro del equipo."],
[26, "Ante el transporte conjunto de varios materiales de distinta naturaleza, se debe comprobar previamente:", ["Su compatibilidad, evitando combinaciones peligrosas", "Que todos tengan el mismo color de embalaje", "Que procedan del mismo proveedor", "Que pesen exactamente lo mismo"], 0, "Comprobar la compatibilidad de los materiales evita reacciones peligrosas o incidentes durante su transporte conjunto."],
[26, "El uso de calzado de seguridad con puntera reforzada en tareas de manejo de materiales pesados tiene como finalidad:", ["Proteger los pies frente a la caída accidental de objetos", "Reducir el peso percibido de la carga", "Mejorar el rendimiento deportivo del trabajador", "Aumentar la velocidad de desplazamiento del trabajador"], 0, "La puntera reforzada protege frente a golpes o aplastamientos en caso de caída de la carga sobre el pie."],
[26, "El manejo de una traspaleta manual cargada debe realizarse, como norma de seguridad básica:", ["Tirando siempre de espaldas al recorrido", "Empujando en vez de tirando siempre que sea posible, con buena visibilidad del recorrido", "Sin comprobar la carga máxima admisible del equipo", "Con los ojos cerrados en tramos rectos"], 1, "Empujar con buena visibilidad del recorrido reduce el riesgo de colisiones y facilita un manejo más seguro del equipo."],
[26, "El uso de topes o calzos en las ruedas de un carro de transporte cargado en una superficie inclinada tiene como finalidad:", ["Evitar el desplazamiento accidental del carro", "Aumentar la velocidad máxima de desplazamiento del carro", "Facilitar su desplazamiento más rápido", "Aumentar la carga máxima permitida"], 0, "Los calzos inmovilizan el carro evitando que se desplace de forma incontrolada en superficies con pendiente."],
[26, "La señalización de una zona donde se están realizando movimientos de maquinaria pesada tiene como finalidad:", ["Reducir el tiempo necesario para completar la tarea", "Decorar la zona de trabajo", "Facilitar el acceso de vehículos a la zona", "Advertir a terceras personas del riesgo y delimitar la zona de trabajo"], 3, "Señalizar la zona informa a terceros del riesgo presente, reduciendo la posibilidad de accidentes durante el movimiento de maquinaria."],
[27, "La clasificación selectiva de residuos en un centro de trabajo tiene como objetivo principal:", ["Reducir el número de contenedores necesarios", "Aumentar el volumen total de residuos generados", "Facilitar su correcto reciclaje o tratamiento posterior según su naturaleza", "Reducir de forma directa la factura eléctrica del centro"], 2, "Separar los residuos por tipo (papel, plástico, orgánico, etc.) permite que cada fracción reciba el tratamiento de reciclaje adecuado."],
[27, "Los residuos de aparatos eléctricos y electrónicos (RAEE) deben gestionarse:", ["Con escasa consideración especial respecto a otros residuos", "Junto con el resto de residuos orgánicos", "Vertiéndolos directamente en cualquier contenedor genérico", "A través de puntos de recogida específicos, dado su carácter potencialmente peligroso"], 3, "Contienen componentes que pueden ser contaminantes o peligrosos, por lo que requieren una gestión diferenciada."],
[27, "El contenedor de color amarillo, en la recogida selectiva habitual, se destina a:", ["Papel y cartón", "Envases de plástico y metal", "Vidrio", "Residuos orgánicos"], 1, "Es el código de colores más extendido en la recogida selectiva municipal en España para envases ligeros."],
[27, "Los residuos peligrosos generados en un centro de trabajo (por ejemplo, tóner, pilas o productos químicos) deben:", ["Almacenarse indefinidamente con escasa gestión posterior", "Gestionarse de forma separada conforme a la normativa de residuos peligrosos", "Mezclarse con los residuos ordinarios del centro", "Verterse directamente por el desagüe"], 1, "Los residuos peligrosos requieren una gestión diferenciada y trazable, conforme a la normativa específica de residuos."],
[27, "El papel y cartón usado en una oficina, antes de su retirada selectiva, puede requerir:", ["Su depósito en el contenedor específico, libre de otros materiales contaminantes", "Triturarse antes de reciclarlo, en la mayoría de los casos", "Ser quemado en las propias instalaciones", "Mezclarse con restos de comida, como paso habitual"], 0, "Mantener el papel y cartón libre de otros materiales facilita su correcto reciclaje posterior."],
[27, "El contenedor de color azul, en la recogida selectiva habitual, se destina a:", ["Papel y cartón", "Residuos orgánicos", "Vidrio", "Envases de plástico y metal"], 0, "Es el código de colores extendido en la recogida selectiva municipal en España para el papel y cartón."],
[27, "El contenedor de color verde (iglú), en la recogida selectiva habitual, se destina a:", ["Papel y cartón", "Vidrio", "Pilas y baterías", "Envases ligeros"], 1, "El contenedor verde tipo iglú es el habitual para el vidrio en la recogida selectiva municipal."],
[27, "Las pilas y baterías usadas deben depositarse:", ["En cualquier punto con escasa consideración especial", "Junto con el resto de residuos orgánicos", "En puntos de recogida específicos habilitados para este tipo de residuo", "En el contenedor de papel y cartón"], 2, "Contienen sustancias potencialmente contaminantes y requieren una gestión diferenciada en puntos de recogida específicos."],
[27, "El principio de las 'tres erres' en la gestión de residuos hace referencia a:", ["Reducir, reutilizar y reciclar", "Recoger, retirar y rellenar", "Registrar, revisar y remitir", "Rechazar, reemplazar y renovar"], 0, "Es un principio ampliamente difundido de gestión ambiental que prioriza reducir el consumo, reutilizar y, finalmente, reciclar."],
[27, "La correcta gestión de residuos en un centro de trabajo puede contribuir a:", ["Eliminar cualquier obligación normativa en materia ambiental", "Aumentar de forma directa el presupuesto disponible", "Reducir de forma directa el gasto en material de oficina", "Reducir el impacto ambiental de la actividad del organismo"], 3, "Una gestión adecuada de residuos reduce el impacto ambiental, además de ser una obligación normativa en muchos casos."],
[27, "Ante la generación de un residuo cuya clasificación resulta dudosa, la actuación recomendada es:", ["Depositarlo en cualquier contenedor disponible sin más comprobación", "Consultar el protocolo interno o al responsable correspondiente antes de depositarlo", "Verterlo directamente al desagüe", "Acumularlo indefinidamente sin gestionarlo"], 1, "Ante la duda, consultar el protocolo o al responsable evita una gestión incorrecta que pueda tener consecuencias ambientales o normativas."],
[27, "El compostaje de residuos orgánicos es un proceso que permite:", ["Transformar la materia orgánica en un abono natural aprovechable", "Eliminar la necesidad de contenedores para el resto de residuos", "Incinerar el residuo de forma controlada", "Eliminar completamente cualquier residuo con escaso aprovechamiento"], 0, "El compostaje aprovecha la descomposición controlada de la materia orgánica para obtener un producto reutilizable como abono."],
[27, "Los puntos limpios municipales están destinados principalmente a:", ["Almacenar residuos peligrosos durante un tiempo prolongado, sin gestión posterior", "Recoger de forma preferente residuos orgánicos", "La recogida de residuos voluminosos o especiales no admitidos en la recogida ordinaria", "Centralizar en un solo punto la totalidad de la gestión de residuos del municipio"], 2, "Los puntos limpios permiten depositar de forma diferenciada residuos voluminosos, electrónicos o especiales que no van en la recogida habitual."],
[27, "La reducción en origen, como parte de la gestión de residuos, hace referencia a:", ["Reciclar el mayor volumen posible de residuos ya generados", "Aumentar el volumen de compra de materiales de un solo uso", "Disminuir la cantidad de residuos generados desde el propio proceso o actividad", "Incinerar los residuos antes de su generación"], 2, "La reducción en origen prioriza generar menos residuos desde el principio, antes de recurrir a la reutilización o el reciclaje."],
[27, "El símbolo de reciclaje (las tres flechas) en un envase indica, con carácter general:", ["Que el producto genera escasos residuos", "Que el envase debe incinerarse como método preferente", "Que el envase es mayoritariamente biodegradable", "Que el material del envase es potencialmente reciclable"], 3, "El símbolo de las tres flechas identifica materiales que pueden reciclarse a través de los circuitos correspondientes."],
[27, "El almacenamiento temporal de residuos dentro de un centro de trabajo, antes de su retirada, debe realizarse:", ["Con escasa limitación de tiempo de almacenamiento", "En cualquier espacio disponible con escaso criterio", "Junto con material de oficina de uso habitual", "En condiciones adecuadas que eviten riesgos para la salud o el medio ambiente"], 3, "El almacenamiento temporal debe respetar unas condiciones mínimas de seguridad e higiene hasta su retirada por el gestor correspondiente."],
[27, "La correcta separación de residuos desde el origen (en el propio puesto de trabajo) facilita:", ["Reducir la vida útil de los materiales reciclables", "Un reciclaje posterior más eficiente y de mayor calidad", "Aumentar el volumen total de residuos generados", "Reducir el volumen total de residuos generados"], 1, "Separar correctamente desde el origen evita la contaminación entre distintos tipos de residuos, mejorando la calidad del reciclaje posterior."],
[27, "Los residuos de aceites usados (por ejemplo, de mantenimiento de vehículos) deben gestionarse:", ["Vertiéndolos por el desagüe convencional", "Mezclados con los residuos orgánicos", "A través de un gestor autorizado de residuos peligrosos", "Con escasa gestión específica"], 2, "Los aceites usados son residuos peligrosos que requieren una gestión específica a través de gestores autorizados."],
[27, "La normativa de residuos suele establecer una jerarquía de gestión que prioriza, en primer lugar:", ["El vertido directo en vertedero", "La prevención en la generación del residuo", "La incineración con escaso criterio previo", "El almacenamiento indefinido sin tratamiento"], 1, "La jerarquía de residuos sitúa la prevención como primera opción, seguida de la reutilización, el reciclaje, la valorización y, en último lugar, la eliminación."],
[27, "La incineración de residuos sin el tratamiento y control adecuados puede provocar:", ["Una reducción notable de cualquier impacto ambiental", "Emisiones contaminantes perjudiciales para el medio ambiente y la salud", "La eliminación completa y segura de cualquier residuo", "Escaso efecto sobre la calidad del aire"], 1, "Una incineración no controlada puede generar emisiones tóxicas, por lo que debe realizarse únicamente en instalaciones autorizadas y con los controles adecuados."],
[28, "Ante una fuga de agua en una tubería, la primera actuación recomendada es:", ["Cerrar la llave de paso general o la más cercana a la fuga", "Aplicar cinta aislante eléctrica como reparación definitiva", "Ignorar la fuga si es de poco caudal", "Intentar reparar la tubería sin cortar antes el suministro"], 0, "Cortar el suministro de agua es el primer paso para evitar que la fuga siga causando daños mientras se gestiona la reparación."],
[28, "Antes de manipular una instalación eléctrica, aunque sea una tarea sencilla, se debe:", ["Prescindir de cualquier comprobación previa", "Usar herramientas metálicas con escaso aislamiento", "Cortar la corriente en el cuadro eléctrico correspondiente", "Trabajar con la corriente conectada para comprobar el fallo en tiempo real"], 2, "Cortar la corriente antes de manipular una instalación eléctrica es la norma básica de seguridad frente a electrocución."],
[28, "Una llave allen (o llave hexagonal) se utiliza principalmente para:", ["Cortar cables eléctricos", "Sellar juntas de fontanería", "Nivelar superficies de albañilería", "Apretar o aflojar tornillos con cabeza hexagonal interior"], 3, "Es una herramienta habitual en mobiliario y pequeñas reparaciones con tornillería de cabeza hexagonal interior."],
[28, "En una pequeña reparación de carpintería, el uso de tacos y tornillos adecuados al tipo de pared es importante para:", ["Reducir el tiempo de secado de la pintura", "Reducir el tiempo total de la reparación", "Garantizar una fijación segura y duradera del elemento instalado", "Evitar el uso de cualquier herramienta eléctrica"], 2, "Usar el taco y tornillo adecuados al material de la pared (yeso, ladrillo, hormigón) evita que la fijación ceda con el tiempo."],
[28, "El termostato de una instalación de calefacción tiene como función:", ["Determinar la presión del circuito de calefacción", "Regular la temperatura deseada, activando o desactivando el sistema de forma automática", "Filtrar el aire de la instalación", "Medir el consumo eléctrico del edificio"], 1, "El termostato controla automáticamente el funcionamiento del sistema de calefacción según la temperatura configurada."],
[28, "Ante un atasco leve en un desagüe, una primera actuación básica de mantenimiento es:", ["Ignorar el atasco hasta que se resuelva solo", "Utilizar un desatascador manual (ventosa) antes de recurrir a productos químicos agresivos", "Desmontar la tubería con escasa precaución", "Verter siempre productos químicos corrosivos como primera opción"], 1, "El uso de un desatascador manual es una primera medida sencilla y menos agresiva que los productos químicos."],
[28, "El mantenimiento básico de un sistema de aire acondicionado incluye, entre otras tareas:", ["Aumentar la potencia del equipo sin criterio técnico", "Eliminar la necesidad de cualquier revisión técnica", "Requerir la intervención de un técnico especializado a diario", "La limpieza periódica de filtros"], 3, "La limpieza de filtros es una tarea de mantenimiento básico que mejora la eficiencia y calidad del aire del sistema."],
[28, "Al detectar una puerta o cerradura que no cierra correctamente, una posible causa habitual a revisar es:", ["El desajuste de las bisagras o del propio mecanismo de la cerradura", "La presión del agua del edificio", "Un fallo en la instalación eléctrica del edificio", "Un problema en la red de fontanería"], 0, "Las bisagras desajustadas o un mecanismo de cerradura deteriorado son causas frecuentes de mal funcionamiento de puertas."],
[28, "Ante un enchufe o toma de corriente que produce chispas al conectar un aparato, la actuación correcta es:", ["Forzar la conexión introduciendo el enchufe de otra manera", "Seguir utilizándolo si el aparato funciona correctamente", "Repararlo uno mismo sin formación eléctrica específica", "Dejar de utilizarlo y comunicar la incidencia para su revisión por personal cualificado"], 3, "Las chispas al conectar un aparato pueden indicar un fallo eléctrico que debe ser revisado por personal cualificado, evitando riesgos de descarga o incendio."],
[28, "El desatascador de ventosa para desagües funciona principalmente mediante:", ["Calor generado por fricción", "Productos químicos corrosivos incorporados", "La generación de presión y succión que desplaza el obstáculo", "Vibración ultrasónica"], 2, "El efecto de presión y succión que genera la ventosa ayuda a desplazar o disolver el material que obstruye la tubería."],
[28, "Una de las causas más habituales de goteo en un grifo es:", ["Un problema de calefacción del edificio", "Un fallo en la instalación eléctrica cercana", "Una avería en la caldera de calefacción", "El desgaste de la junta o zapata interior"], 3, "El desgaste de juntas o zapatas es la causa más frecuente de los goteos en grifería, siendo una reparación sencilla en la mayoría de los casos."],
[28, "El uso de un nivel de burbuja en pequeñas tareas de carpintería o albañilería sirve para:", ["Medir la temperatura ambiente de la estancia de trabajo", "Cortar materiales con precisión milimétrica", "Comprobar la horizontalidad o verticalidad de una superficie o elemento", "Detectar fugas eléctricas en la instalación"], 2, "El nivel de burbuja es una herramienta básica para verificar que un elemento está correctamente horizontal o vertical antes de fijarlo."],
[28, "Ante la detección de humedades en una pared de un edificio administrativo, es recomendable:", ["Sellar la zona con cinta adhesiva como solución definitiva", "Ignorar la humedad si no afecta visualmente a la pintura", "Comunicar la incidencia para su valoración y reparación por personal especializado", "Aplicar pintura directamente sin investigar la causa"], 2, "Las humedades pueden tener causas diversas (filtraciones, condensación, fugas) que requieren una valoración técnica antes de una reparación efectiva."],
[28, "El mantenimiento preventivo de una caldera de calefacción debe realizarse, con carácter general:", ["Cada varios años, con independencia de su antigüedad", "Si lo solicita expresamente el usuario final", "Cuando se produce una avería, sin revisiones previas", "De forma periódica por personal cualificado, conforme a la normativa aplicable"], 3, "Las calderas requieren revisiones periódicas obligatorias que garantizan su correcto funcionamiento y seguridad."],
[28, "Al realizar una pequeña reparación de pintura en una pared, antes de aplicar la pintura es recomendable:", ["Limpiar y preparar adecuadamente la superficie", "Aplicar varias capas sin dejar tiempo de secado entre ellas", "Utilizar siempre el color más oscuro disponible", "Aplicar la pintura directamente sobre cualquier superficie sin preparación"], 0, "Una superficie limpia y bien preparada mejora la adherencia y el acabado final de la pintura."],
[28, "El destornillador de estrella (Phillips), frente al plano, se caracteriza por:", ["Adaptarse a tornillos con cabeza en forma de cruz", "Servir de forma preferente para tornillos muy grandes", "Utilizarse de forma habitual en instalaciones eléctricas", "Tener escasa diferencia práctica con el destornillador plano"], 0, "El destornillador de estrella se adapta al tipo de ranura en cruz de determinados tornillos, distinto del tipo plano o ranurado simple."],
[28, "El uso de una llave inglesa o llave ajustable permite:", ["Cortar tuberías de cualquier material", "Detectar fugas eléctricas", "Adaptarse a distintos tamaños de tuercas o tornillos", "Medir la presión de una instalación"], 2, "Su apertura ajustable la hace versátil para trabajar con diferentes tamaños de tuercas y tornillos en tareas de mantenimiento."],
[28, "La revisión periódica de las juntas de estanqueidad en instalaciones de fontanería tiene como finalidad:", ["Aumentar la presión del sistema", "Determinar la presión máxima del circuito de agua", "Reducir el consumo eléctrico del edificio", "Prevenir fugas de agua en las conexiones"], 3, "Unas juntas deterioradas son una causa habitual de pequeñas fugas en conexiones de fontanería, por lo que su revisión periódica es preventiva."],
[28, "Una fuga de gas detectada por el olor característico debe motivar, como primera actuación:", ["Ventilar la zona, no accionar interruptores eléctricos y avisar al servicio correspondiente", "Utilizar cualquier llama para localizar el origen de la fuga", "Ignorar el olor si es leve", "Encender una luz para ver mejor la zona"], 0, "Ventilar sin generar chispas ni llamas y avisar cuanto antes es la pauta de seguridad básica ante una sospecha de fuga de gas."],
[28, "El uso de un multímetro en tareas básicas de electricidad permite:", ["Medir la temperatura ambiente de una sala", "Cortar cables eléctricos con precisión", "Medir magnitudes eléctricas como la tensión o la continuidad de un circuito", "Reparar directamente una avería eléctrica detectada"], 2, "El multímetro es una herramienta de medición eléctrica básica, útil para comprobar tensión, continuidad u otros parámetros."],
[28, "El uso de guantes aislantes es especialmente recomendable en tareas de mantenimiento que impliquen:", ["Tareas de jardinería con escaso riesgo eléctrico", "Manipulación de elementos con posible tensión eléctrica residual", "Tareas de pintura", "Tareas de limpieza de cristales"], 1, "Los guantes aislantes son una medida de protección frente al riesgo de contacto eléctrico en tareas de mantenimiento."],
[28, "Las herramientas de mantenimiento deben revisarse periódicamente para comprobar:", ["Su color o aspecto estético, con carácter principal", "Su fecha de fabricación, como dato principal", "El precio de mercado actual de cada herramienta", "Su buen estado de conservación y funcionamiento seguro"], 3, "Una herramienta deteriorada puede fallar durante su uso, aumentando el riesgo de accidente; su revisión periódica es una medida preventiva básica."],
[29, "Los extintores de un edificio deben someterse a revisión periódica, con carácter general, según:", ["Un incendio previo, como único desencadenante de la revisión", "La normativa de instalaciones de protección contra incendios vigente", "Un criterio no normativo, a decisión de cada organismo", "El criterio del fabricante, sin normativa aplicable"], 1, "La normativa de instalaciones de protección contra incendios establece las revisiones periódicas obligatorias de los extintores."],
[29, "Un extintor de polvo polivalente (ABC) es adecuado, con carácter general, para fuegos de tipo:", ["Metales, con carácter preferente", "Equipos eléctricos en tensión, de forma prioritaria", "Líquidos inflamables, de forma prioritaria", "Sólidos, líquidos y gases inflamables"], 3, "El polvo ABC es un agente extintor polivalente, apto para las clases de fuego más habituales (sólidos, líquidos y gases)."],
[29, "Las puertas cortafuegos deben mantenerse, con carácter general, en condiciones de:", ["Bloqueo definitivo para evitar su apertura accidental", "Apertura permanente para facilitar el paso de personas", "Cierre efectivo, sin elementos que impidan su funcionamiento (como cuñas o objetos que las mantengan abiertas)", "Ausencia total de mantenimiento periódico programado"], 2, "Las puertas cortafuegos deben poder cerrarse correctamente para cumplir su función de compartimentación ante un incendio; bloquearlas abiertas anula su eficacia."],
[29, "La señalización de un extintor en un edificio debe ser:", ["Retirada una vez instalado el extintor", "Visible, permanente y fácilmente identificable desde distintos puntos del recinto", "Opcional, con escaso criterio de visibilidad", "Sustituida por indicaciones verbales del personal"], 1, "La señalización adecuada permite localizar rápidamente el extintor en caso de emergencia."],
[29, "Antes de utilizar un extintor, una comprobación básica que cualquier persona puede realizar es:", ["Desmontar la válvula del extintor", "Verificar que el manómetro (si lo tiene) marca la presión correcta y que el precinto está intacto", "Ignorar cualquier indicador visual del propio equipo", "Agitar el extintor de forma violenta antes de cualquier comprobación"], 1, "El manómetro y el precinto son indicadores visuales básicos del estado operativo de un extintor."],
[29, "El mantenimiento de las vías de evacuación de un edificio exige, entre otras medidas:", ["Utilizarlas habitualmente como zona de almacenamiento temporal", "Cerrarlas con llave durante el horario laboral", "Reducir su anchura si el espacio es limitado", "Mantenerlas libres de obstáculos en todo momento"], 3, "Las vías de evacuación deben permanecer siempre despejadas para garantizar una salida segura en caso de emergencia."],
[29, "La clase de fuego correspondiente a materiales sólidos como madera, papel o tejidos se denomina:", ["Clase C", "Clase B", "Clase D", "Clase A"], 3, "La clasificación de fuegos distingue la clase A para combustibles sólidos, la B para líquidos, la C para gases y la D para metales."],
[29, "La clase de fuego correspondiente a líquidos inflamables como gasolina o aceites se denomina:", ["Clase A", "Clase C", "Clase D", "Clase B"], 3, "La clase B de fuegos corresponde a líquidos y sólidos licuables inflamables."],
[29, "Un extintor debe someterse, con carácter general, a una revisión anual por parte de:", ["Un organismo distinto en cada revisión con escaso registro", "Nadie, si el extintor conserva su aspecto exterior en buen estado", "Una empresa mantenedora autorizada", "El propio personal del edificio con escasa cualificación"], 2, "La normativa de protección contra incendios exige revisiones periódicas por empresas mantenedoras autorizadas, además de comprobaciones visuales más frecuentes."],
[29, "La retimbrado o prueba de presión de un extintor debe realizarse, con carácter general, cada:", ["Diez años, con independencia del uso del extintor", "Cinco años, según la vida útil y normativa del extintor", "Si el extintor ha sido utilizado previamente, con carácter general", "Un mes"], 1, "La retimbrado es una prueba periódica de presión exigida por la normativa para verificar la resistencia del recipiente del extintor."],
[29, "Las puertas cortafuegos suelen incorporar un mecanismo de cierre automático que:", ["Garantiza que la puerta se cierre por sí sola tras su apertura", "Elimina la necesidad de manija o pomo en la puerta", "Mantiene la puerta siempre abierta de forma automática", "Bloquea la puerta de forma permanente"], 0, "El cierre automático asegura que la puerta cumpla su función de compartimentación ante un incendio, incluso si se ha abierto momentáneamente."],
[29, "La detección de un extintor con el precinto roto o el indicador de presión fuera del rango normal debe:", ["Comunicarse para su revisión o sustitución inmediata", "Depender del color del extintor más cercano", "Repararse por cualquier persona sin formación específica", "Ignorarse si el extintor parece visualmente en buen estado"], 0, "Un precinto roto o una presión anómala son señales de que el extintor puede no funcionar correctamente y debe revisarse cuanto antes."],
[29, "El plan de autoprotección de un edificio administrativo debe incluir, entre otros elementos:", ["La lista de proveedores del organismo", "El presupuesto de mantenimiento del edificio", "El horario laboral del personal", "La identificación de riesgos y las medidas de actuación ante una emergencia"], 3, "El plan de autoprotección recoge el análisis de riesgos, los medios disponibles y los protocolos de actuación ante emergencias."],
[29, "El simulacro periódico de evacuación de un edificio tiene como finalidad principal:", ["Reducir el número de extintores necesarios", "Comprobar y mejorar la respuesta del personal ante una emergencia real", "Evaluar el rendimiento laboral del personal", "Reducir el tiempo de respuesta de los servicios de emergencia"], 1, "Los simulacros permiten entrenar y evaluar la respuesta ante una emergencia, detectando posibles mejoras en el protocolo."],
[29, "La ubicación de los extintores en un edificio debe permitir, entre otros criterios:", ["Un acceso rápido y sin obstáculos en caso de emergencia", "Estar situados de forma preferente en las plantas superiores", "Estar ocultos para no afectar a la decoración", "Cambiar de ubicación con cierta frecuencia, sin más criterio"], 0, "Los extintores deben ubicarse en puntos accesibles y visibles, conforme a la normativa de protección contra incendios."],
[29, "El extintor de dióxido de carbono (CO2) es especialmente adecuado para fuegos que afectan a:", ["Metales combustibles", "Materiales sólidos como madera o papel", "Equipos eléctricos en tensión", "Aceites de cocina"], 2, "El CO2 no deja residuo y no es conductor de electricidad, por lo que resulta adecuado para fuegos en equipos eléctricos."],
[29, "Los extintores portátiles instalados en un edificio deben quedar recogidos, entre otros datos, en:", ["El contrato laboral del personal de mantenimiento", "Un registro o plan de mantenimiento del propio edificio", "El plan de igualdad del organismo", "Escaso documento específico"], 1, "Llevar un registro de los extintores y su mantenimiento facilita el seguimiento de las revisiones obligatorias periódicas."],
[29, "La franja de seguridad delante de un extintor debe mantenerse:", ["Libre de obstáculos que impidan su rápida localización y uso", "Señalizada en edificios de nueva construcción", "Reducida al mínimo espacio posible", "Ocupada con material de uso frecuente"], 0, "Mantener despejada la zona frente al extintor garantiza que pueda utilizarse sin demora en caso de emergencia."],
[29, "La accesibilidad de las puertas cortafuegos para su apertura en caso de emergencia debe garantizarse mediante:", ["Barreras adicionales que dificulten su apertura rápida", "Mecanismos de apertura sencilla desde el interior, sin necesidad de llave", "Cerraduras que requieran llave específica en todo momento", "Ausencia de cualquier mecanismo de apertura de emergencia"], 1, "Las puertas de evacuación deben poder abrirse fácilmente desde el interior en caso de emergencia, sin necesidad de llave."],
[29, "La formación básica en el uso de extintores dirigida al personal de un edificio tiene como finalidad:", ["Cualificar profesionalmente al personal como bombero", "Eliminar la necesidad de un plan de autoprotección", "Reducir el número de extintores necesarios en el edificio", "Que sepan actuar con seguridad ante un conato de incendio"], 3, "Conocer el manejo básico de un extintor permite una primera intervención segura ante un conato de incendio, sin sustituir la actuación de los servicios de emergencia en incendios de mayor envergadura."],
[30, "La comprobación periódica del nivel de aceite del motor de un vehículo tiene como finalidad:", ["Determinar el consumo de combustible del vehículo", "Garantizar una lubricación adecuada de los componentes del motor", "Aumentar la velocidad máxima del vehículo", "Reducir el consumo de combustible de forma directa"], 1, "Un nivel de aceite adecuado es esencial para la correcta lubricación y funcionamiento del motor, evitando averías graves."],
[30, "La presión de los neumáticos de un vehículo debe revisarse periódicamente porque una presión incorrecta puede provocar:", ["Un desgaste irregular y mayor riesgo de reventón o pérdida de control", "Una reducción del consumo de combustible, en la mayoría de los casos", "Una mejora en la seguridad, sin apenas riesgo asociado", "Escaso efecto sobre la conducción"], 0, "Una presión inadecuada afecta a la estabilidad, el desgaste del neumático y aumenta el riesgo de accidente."],
[30, "El líquido refrigerante de un vehículo tiene como función principal:", ["Determinar la presión de los neumáticos", "Mantener la temperatura del motor dentro de unos márgenes adecuados", "Limpiar el parabrisas", "Lubricar las piezas móviles del motor"], 1, "El líquido refrigerante evita el sobrecalentamiento del motor, manteniendo su temperatura de funcionamiento óptima."],
[30, "Antes de emprender un trayecto con un vehículo de la organización, una comprobación básica recomendable es:", ["Revisar visualmente luces, neumáticos y niveles básicos (aceite, refrigerante)", "Revisar de forma preferente el color de la carrocería", "Prescindir de comprobación si el vehículo se usó recientemente", "Comprobar el nivel de combustible, con carácter principal"], 0, "Una revisión visual básica antes de cada trayecto ayuda a detectar anomalías que puedan comprometer la seguridad."],
[30, "El desgaste de las pastillas de freno de un vehículo debe revisarse periódicamente porque:", ["Tener escasa relación con la seguridad del vehículo", "Un desgaste excesivo reduce la capacidad de frenado y compromete la seguridad", "Influir de forma principal en el consumo de combustible", "Ser un elemento de mantenimiento poco frecuente"], 1, "Las pastillas de freno desgastadas reducen la eficacia de frenado, siendo un elemento de seguridad crítico a revisar periódicamente."],
[30, "La ficha o cartilla de mantenimiento de un vehículo de la organización sirve para:", ["Fijar el precio de reventa del vehículo", "Acreditar la titularidad legal del vehículo", "Eliminar la necesidad de la Inspección Técnica de Vehículos (ITV)", "Registrar las revisiones, reparaciones e incidencias del vehículo a lo largo del tiempo"], 3, "Permite llevar un control histórico del mantenimiento realizado, útil para la gestión y seguridad del vehículo."],
[30, "La revisión del nivel de líquido de frenos de un vehículo es importante porque un nivel bajo puede indicar:", ["Una avería en el sistema de climatización", "Un problema estético del vehículo", "Un posible desgaste de las pastillas de freno o una fuga en el sistema", "Un fallo en la batería del vehículo"], 2, "Un nivel bajo de líquido de frenos puede deberse al desgaste normal de las pastillas o a una fuga, ambos aspectos relevantes para la seguridad."],
[30, "La Inspección Técnica de Vehículos (ITV) tiene como finalidad:", ["Fijar el precio de mercado del vehículo", "Reparar directamente las averías detectadas durante la prueba", "Verificar que el vehículo cumple los requisitos técnicos y de seguridad exigidos", "Renovar automáticamente el permiso de conducir del titular"], 2, "La ITV es una revisión periódica obligatoria que comprueba el estado técnico y de seguridad del vehículo conforme a la normativa vigente."],
[30, "El desgaste irregular de los neumáticos de un vehículo puede deberse, entre otras causas, a:", ["La antigüedad de la batería", "El color de la carrocería del vehículo", "El tipo de combustible utilizado", "Una alineación o presión inadecuada de las ruedas"], 3, "Una alineación incorrecta o una presión inadecuada son causas habituales de desgaste irregular en los neumáticos."],
[30, "La comprobación del funcionamiento de las luces de un vehículo antes de un trayecto es importante porque:", ["Ser relevante de forma preferente en los meses de invierno", "Tener escasa relación con la seguridad del trayecto", "Afectar directamente a la seguridad vial, tanto propia como de terceros", "Ser relevante de forma preferente en vehículos muy antiguos"], 2, "Unas luces en mal estado comprometen la visibilidad y la seguridad, tanto para quien conduce como para el resto de usuarios de la vía."],
[30, "La batería de un vehículo debe revisarse periódicamente porque su deterioro puede provocar:", ["Dificultades de arranque o fallos en el sistema eléctrico del vehículo", "Un aumento del rendimiento del motor", "Escasa incidencia relevante para el vehículo", "Una reducción automática del consumo de combustible"], 0, "Una batería deteriorada es una causa habitual de problemas de arranque y de funcionamiento de los sistemas eléctricos del vehículo."],
[30, "Ante una anomalía detectada en un vehículo de la organización durante su uso, el protocolo habitual exige:", ["Comunicarlo cuanto antes al responsable de la flota o mantenimiento", "Ignorar la anomalía si el vehículo sigue funcionando", "Repararlo por cuenta propia sin comunicarlo", "Utilizar el vehículo con normalidad de forma indefinida"], 0, "Comunicar cuanto antes cualquier anomalía permite gestionar su revisión y evitar que se agrave o derive en un problema de seguridad."],
[30, "El manómetro de un compresor o sistema neumático de un vehículo indica:", ["El kilometraje total del vehículo", "La temperatura del motor", "La presión del sistema en un momento dado", "El nivel de combustible disponible"], 2, "El manómetro mide la presión, siendo una herramienta básica de control en sistemas neumáticos o de frenos de aire."],
[30, "La revisión del estado de las escobillas del limpiaparabrisas de un vehículo es relevante especialmente porque:", ["Afecta a la visibilidad del conductor en condiciones de lluvia", "Ser relevante de forma preferente en vehículos muy antiguos", "Influir de forma escasa en la seguridad de la conducción", "Depender del color de la carrocería del vehículo"], 0, "Unas escobillas deterioradas reducen la visibilidad en condiciones de lluvia, comprometiendo la seguridad de la conducción."],
[30, "Ante un testigo o luz de avería encendida en el salpicadero de un vehículo, la actuación recomendada es:", ["Aumentar la velocidad para llegar antes al taller", "Desconectar el testigo para que deje de molestar", "Ignorar la luz si el vehículo parece funcionar con normalidad", "Revisar cuanto antes la causa, evitando ignorar la advertencia"], 3, "Los testigos del salpicadero avisan de posibles anomalías que conviene revisar cuanto antes para evitar averías mayores."],
[30, "La rotación periódica de neumáticos en un vehículo tiene como finalidad:", ["Reducir el consumo de combustible de forma directa", "Aumentar la velocidad máxima del vehículo", "Determinar la vida útil restante del neumático", "Conseguir un desgaste más uniforme entre todas las ruedas"], 3, "Rotar los neumáticos entre los distintos ejes ayuda a igualar su desgaste, prolongando su vida útil."],
[30, "El nivel de líquido limpiaparabrisas de un vehículo debe revisarse periódicamente para:", ["Mejorar el rendimiento del motor", "Evitar el desgaste de los neumáticos", "Garantizar una correcta limpieza del parabrisas durante la conducción", "Determinar el nivel de aceite del motor"], 2, "Un nivel adecuado de líquido limpiaparabrisas asegura poder limpiar el cristal cuando sea necesario para mantener la visibilidad."],
[30, "El par de apriete correcto en las tuercas de las ruedas de un vehículo es importante para:", ["Reducir el consumo de combustible directamente", "Determinar el ángulo de dirección de las ruedas", "Evitar que la rueda se afloje o se dañen los espárragos", "Aumentar la velocidad máxima del vehículo"], 2, "Un apriete inadecuado (excesivo o insuficiente) puede provocar el aflojamiento de la rueda o dañar los elementos de sujeción."],
[30, "La comprobación del estado de las correas del motor de un vehículo forma parte de:", ["Un trámite administrativo sin relación mecánica", "Una tarea exclusiva de la Inspección Técnica de Vehículos", "Una revisión de carácter meramente estético, sin relación con el funcionamiento", "El mantenimiento preventivo básico recomendado por el fabricante"], 3, "Las correas desgastadas pueden romperse y afectar gravemente al funcionamiento del motor, por lo que forman parte del mantenimiento preventivo habitual."],
[30, "El símbolo de advertencia en el tablero de un vehículo relativo a la presión de los neumáticos indica:", ["Una avería en el sistema de climatización", "Un problema en la batería del vehículo", "Un fallo en el sistema de frenos", "Que uno o más neumáticos presentan una presión distinta a la recomendada"], 3, "Los sistemas de control de presión de neumáticos avisan cuando la presión se aleja de los valores recomendados por el fabricante."],
[30, "La revisión del filtro de aire del motor de un vehículo es relevante porque un filtro obstruido puede provocar:", ["Una mejora automática de la potencia del motor", "Una reducción del rendimiento del motor y mayor consumo de combustible", "Escaso efecto relevante sobre el funcionamiento del vehículo", "Una reducción del desgaste de los neumáticos"], 1, "Un filtro de aire obstruido dificulta la combustión adecuada, afectando negativamente al rendimiento y consumo del motor."],
[20, "Ante una llamada telefónica de aviso de bomba u otra amenaza recibida en el puesto de control de acceso, la actuación prioritaria es:", ["Mantener la calma, recabar el máximo de datos posibles y activar el protocolo establecido", "Comunicarlo al finalizar la jornada", "Ignorar la llamada si parece una broma", "Colgar inmediatamente sin recabar escasa información"], 0, "Recabar información y seguir el protocolo de seguridad es la pauta recomendada ante cualquier amenaza telefónica, sin prejuzgar su veracidad."],
[20, "El uso de un torno o barrera física en el acceso a un edificio tiene como finalidad principal:", ["Decorar la entrada del edificio", "Reducir la necesidad de identificación", "Regular el paso ordenado de personas y reforzar el control de acceso", "Eximir al organismo de contar con personal de control"], 2, "Estos elementos físicos ayudan a ordenar el flujo de personas y refuerzan, sin sustituir, el control ejercido por el personal."],
[20, "Ante la comprobación de que una persona visitante ha superado el tiempo previsto de visita sin salir del edificio, la actuación recomendada es:", ["Anular las acreditaciones de todas las personas visitantes", "Ignorar la circunstancia con escasa comprobación", "Bloquear todas las salidas del edificio de forma inmediata", "Verificar su situación con el departamento visitado, siguiendo el protocolo interno"], 3, "Contactar con el departamento visitado permite verificar la situación de forma proporcionada, sin adoptar medidas desproporcionadas."],
[20, "La formación en atención al público del personal de control de acceso debe incluir, entre otros contenidos:", ["Contenidos ajenos a la atención a personas", "Técnicas de comunicación y gestión de situaciones conflictivas", "Formación jurídica especializada en derecho penal", "Contenidos técnicos de cerrajería"], 1, "La atención a personas visitantes, incluidas situaciones difíciles, requiere formación específica en comunicación y gestión de conflictos."],
[20, "Ante un corte de suministro eléctrico que afecta al sistema de control de acceso electrónico, se debe:", ["Activar el protocolo de contingencia manual previsto", "Permitir el acceso con escaso registro ni control", "Abandonar el puesto de control", "Impedir cualquier acceso hasta que se restablezca la corriente"], 0, "Los protocolos de contingencia permiten mantener un control básico manual ante fallos técnicos, evitando tanto el bloqueo total como la ausencia de control."],
[20, "El trato hacia todas las personas visitantes en el control de acceso debe regirse por el principio de:", ["Igualdad de trato, sin discriminación por ningún motivo", "Prioridad exclusiva según la apariencia de la persona", "Discrecionalidad total con escaso criterio", "Preferencia según el nivel de estudios de la persona"], 0, "La igualdad de trato es un principio básico de la atención a la ciudadanía, también aplicable a las funciones de control de acceso."],
[20, "Un plano de evacuación visible en el puesto de control de acceso permite:", ["Determinar automáticamente las causas de una emergencia", "Reducir la necesidad de simulacros periódicos", "Conocer las vías de salida y apoyar la gestión de una emergencia", "Decorar el puesto de trabajo"], 2, "Tener el plano a la vista facilita una respuesta más rápida y coordinada del personal de control en caso de emergencia."],
[20, "Ante la detección de una persona que intenta acceder tras haber sido previamente expulsada del edificio por motivos disciplinarios, la actuación correcta es:", ["Denegar el acceso y, si es necesario, avisar al responsable de seguridad", "Resolver la situación por cuenta propia sin dar parte a nadie", "Ignorar la situación si la persona se muestra tranquila", "Permitir el acceso para evitar un conflicto"], 0, "Corresponde respetar la medida adoptada y seguir el protocolo interno, dando parte a quien corresponda si la situación lo requiere."],
[21, "El orden del día de una reunión debe estar disponible, como buena práctica organizativa:", ["Si lo solicita expresamente la persona que preside, como único supuesto", "Considerarse información confidencial, en todo caso", "Estar disponible al finalizar la reunión, con carácter principal", "Antes del inicio del acto, para que el personal de apoyo pueda prepararlo adecuadamente"], 3, "Conocer el orden del día con antelación permite preparar la sala, los materiales y los medios técnicos conforme al desarrollo previsto del acto."],
[21, "La previsión de asientos accesibles para personas con movilidad reducida en un acto público debe planificarse:", ["En la última fila de la sala, como único emplazamiento", "Si lo solicita expresamente una persona con discapacidad, como criterio principal", "Con antelación, en zonas de fácil acceso y evacuación", "Como una cuestión menor, sin necesidad de planificación"], 2, "Prever este tipo de plazas con antelación forma parte de la accesibilidad universal en la organización de actos públicos."],
[21, "Ante la necesidad de grabar en vídeo un acto institucional, es importante comprobar previamente:", ["El correcto encuadre, sonido y almacenamiento del dispositivo de grabación", "El horario de finalización exacto del acto, sin más comprobaciones", "La opinión personal del técnico sobre el contenido del acto", "El color del fondo de la sala"], 0, "Verificar el equipo de grabación con antelación evita perder contenido relevante por fallos técnicos durante el acto."],
[21, "El servicio de catering o refrigerio en una reunión institucional debe coordinarse, entre otros aspectos, según:", ["El color corporativo del organismo", "El presupuesto anual completo del departamento", "El número de asistentes y el horario previsto del acto", "La antigüedad del edificio"], 2, "Conocer el número de asistentes y el horario permite ajustar adecuadamente el servicio de catering a las necesidades reales del acto."],
[21, "Ante la ausencia imprevista de la persona encargada de la megafonía justo antes de un acto, el personal de apoyo debe:", ["Suspender automáticamente el acto sin buscar alternativas", "Buscar una solución alternativa inmediata siguiendo el protocolo interno disponible", "Ignorar la incidencia y comenzar el acto sin sonido", "Culpar públicamente a la persona ausente durante el acto"], 1, "Contar con protocolos de contingencia y buscar soluciones inmediatas minimiza el impacto de imprevistos de última hora."],
[21, "La recogida de firmas de asistencia en una reunión o formación sirve para:", ["Determinar el aforo máximo de la sala de reuniones", "Determinar el salario de los asistentes", "Dejar constancia documental de la participación de cada persona", "Evaluar el rendimiento del personal asistente"], 2, "El registro de firmas certifica quién ha asistido efectivamente al acto, siendo útil a efectos de justificación o control interno."],
[21, "Al recibir a una autoridad o cargo institucional en un acto, el protocolo de acogida incluye habitualmente:", ["Un trato idéntico al de cualquier persona sin distinción protocolaria", "Una recepción organizada conforme al orden de precedencia correspondiente", "La improvisación total del recibimiento", "Ausencia de cualquier organización específica"], 1, "En actos institucionales, el protocolo de precedencia determina cómo se organiza la recepción de las autoridades asistentes."],
[22, "El mantenimiento de un nivel adecuado de existencias de consumibles de oficina (papel, tóner, grapas) es importante para:", ["Reducir el tiempo de espera en la fotocopiadora", "Aumentar el gasto innecesario del departamento", "Reducir la necesidad de mantenimiento de los equipos", "Evitar interrupciones en las tareas administrativas del día a día"], 3, "Disponer de existencias suficientes de consumibles evita retrasos en tareas cotidianas por falta de material."],
[22, "El uso de fundas o carpetas colgantes en un archivador tiene como finalidad:", ["Reducir el espacio de almacenamiento necesario", "Facilitar la clasificación y localización de documentos por categorías", "Reducir el número de documentos que se pueden archivar", "Eliminar la necesidad de etiquetado"], 1, "Las carpetas colgantes organizadas por categorías facilitan la localización rápida de los documentos archivados."],
[22, "Al preparar dossieres o carpetas informativas para una reunión, una tarea auxiliar habitual es:", ["Modificar el contenido de los documentos sin autorización", "Destruir los documentos sobrantes con escaso criterio", "Reducir el número de copias entregadas a cada asistente", "Ordenar y grapar o encuadernar los documentos según el índice previsto"], 3, "Preparar los dossieres conforme al índice previsto asegura que la documentación entregada esté completa y correctamente ordenada."],
[22, "La verificación de la calidad de impresión antes de una tirada grande de copias permite:", ["Reducir el consumo de tóner de la impresora", "Reducir la vida útil de la impresora", "Detectar errores de impresión evitando el desperdicio de material", "Aumentar el tiempo total de la tarea con escaso beneficio"], 2, "Una comprobación previa evita imprimir un volumen elevado de copias defectuosas, ahorrando tiempo y material."],
[22, "El uso de separadores o pestañas en una carpeta de gran volumen documental tiene como finalidad:", ["Reducir el grosor total de la carpeta", "Facilitar la localización rápida de las distintas secciones del documento", "Aumentar el tiempo de consulta del documento", "Aumentar el precio de encuadernación del documento"], 1, "Los separadores permiten acceder directamente a una sección concreta sin necesidad de revisar todo el documento."],
[23, "La correcta identificación del código postal en un envío es importante porque:", ["Determina el precio del envío por peso", "Tiene escasa influencia en el proceso de reparto", "Facilita y agiliza la clasificación y reparto del envío", "Determina el precio del franqueo aplicable"], 2, "El código postal es clave en los sistemas automatizados de clasificación postal, agilizando el reparto correcto del envío."],
[23, "Ante un envío internacional, además de los datos habituales, suele ser necesario indicar:", ["El nombre del destinatario", "La fecha de nacimiento del destinatario", "El color del embalaje", "El país de destino de forma clara y, en su caso, información aduanera"], 3, "Los envíos internacionales requieren datos adicionales, como el país de destino, y en ciertos casos, información aduanera del contenido."],
[23, "La firma de conformidad al recibir un envío certificado implica:", ["Reconocer la recepción efectiva del envío en ese momento", "Aceptar automáticamente el contenido con escasa reserva posible", "Anular el envío recibido", "Determinar el precio final del envío certificado"], 0, "La firma certifica el momento de la entrega, sin perjuicio de que puedan plantearse incidencias posteriores sobre el contenido si procede."],
[23, "El registro de salida de correspondencia oficial permite, entre otras funciones:", ["Acreditar la fecha en que un documento salió del organismo hacia su destinatario", "Eliminar la necesidad de conservar copia del documento enviado", "Determinar el coste total del envío", "Determinar la ruta de reparto del envío"], 0, "El registro de salida certifica cuándo se remitió oficialmente un documento, siendo relevante para el cómputo de plazos y el control documental."],
[23, "Ante un envío de gran volumen o peso que supera las condiciones habituales del servicio postal ordinario, conviene:", ["Consultar previamente las condiciones del servicio de paquetería adecuado", "Enviarlo igualmente sin comprobar escasa condición", "Rechazar cualquier envío que no sea de tamaño estándar", "Fraccionar el envío con escaso criterio"], 0, "Comprobar previamente las condiciones del servicio evita incidencias o la devolución del envío por incumplir los requisitos del servicio elegido."],
[24, "La zonificación de un almacén (dividirlo en áreas según el tipo de material) tiene como finalidad:", ["Organizar el espacio de forma lógica, facilitando la gestión y la seguridad", "Aumentar el tiempo de búsqueda de los materiales", "Reducir el precio de adquisición de los materiales", "Reducir la superficie útil del almacén"], 0, "Zonificar el almacén facilita tanto la localización de materiales como la aplicación de medidas de seguridad específicas según el tipo de producto."],
[24, "El almacenamiento de material de oficina (papel, consumibles) no requiere, con carácter general, las mismas medidas que el almacenamiento de:", ["Documentación administrativa", "Productos químicos o materiales peligrosos", "Otro material de oficina similar", "Mobiliario ligero"], 1, "El material de oficina convencional no presenta los riesgos asociados a productos químicos o peligrosos, que exigen medidas específicas adicionales."],
[24, "Ante la recepción de un pedido de material con daños visibles en el embalaje, la actuación adecuada es:", ["Almacenarlo directamente con escasa comprobación", "Rechazar automáticamente todo el pedido sin verificar el contenido", "Ignorar el daño si el pedido no es urgente", "Verificar el contenido y dejar constancia de la incidencia antes de su almacenamiento"], 3, "Comprobar el contenido y documentar la incidencia permite gestionar correctamente una posible reclamación al proveedor."],
[24, "La altura máxima de apilado de cajas en un almacén debe respetar, entre otros criterios:", ["El número de personas disponibles en ese momento", "La rapidez con la que se quiera completar la tarea", "La resistencia de las cajas inferiores y la estabilidad del conjunto", "El criterio estético del almacén"], 2, "Superar la resistencia o estabilidad del apilado puede provocar el colapso de la pila, con riesgo para personas y materiales."],
[25, "La codificación interna de materiales mediante números o referencias facilita, entre otras ventajas:", ["Aumentar el precio de los materiales", "Evitar confusiones entre productos con nombres similares", "Reducir la necesidad de personal de almacén", "Determinar automáticamente el precio de cada material"], 1, "Un sistema de codificación claro evita errores derivados de la similitud en la denominación de distintos productos."],
[25, "El control de existencias mediante hojas de cálculo o programas informáticos, frente al registro manual en papel, ofrece como ventaja principal:", ["Mayor rapidez y facilidad para consultar y actualizar la información", "Un coste generalmente inferior en la mayoría de los casos", "Una reducción notable de la posibilidad de error humano", "La sustitución, en gran medida, de los inventarios físicos periódicos"], 0, "Los sistemas informáticos agilizan la consulta y actualización de datos, aunque no eliminan la necesidad de verificaciones físicas periódicas."],
[25, "Ante una entrada de material sin el correspondiente pedido previo registrado, la actuación adecuada es:", ["Incorporarlo automáticamente con escasa comprobación", "Destruirlo por precaución", "Verificar su procedencia antes de incorporarlo al registro de existencias", "Rechazarlo siempre de forma sistemática"], 2, "Verificar la procedencia de un material no esperado evita incorporar errores o materiales no autorizados al control de existencias."],
[25, "El uso de un sistema de doble verificación (una persona registra, otra comprueba) en el control de existencias tiene como finalidad:", ["Aumentar el tiempo de gestión con escasa ventaja", "Reducir el riesgo de errores en el registro de entradas y salidas", "Duplicar innecesariamente el trabajo con escaso beneficio", "Reducir el tiempo de entrega de los proveedores"], 1, "La doble verificación es una medida de control que reduce la probabilidad de errores en el registro de movimientos de material."],
[26, "El uso de eslingas o cinchas para la elevación de cargas con equipos mecánicos exige, entre otras comprobaciones:", ["Elevar la carga sin comprobar su equilibrio", "Verificar que su capacidad es adecuada para el peso de la carga a elevar", "Prescindir de cualquier revisión periódica del equipo", "Utilizar cualquier eslinga disponible sin comprobar su estado"], 1, "Comprobar la capacidad y el estado de las eslingas es esencial para evitar su rotura durante la elevación de una carga."],
[26, "El transporte de materiales de vidrio o frágiles requiere, entre otras precauciones:", ["Apilarlos con escasa protección intermedia", "Escasa precaución especial respecto a otros materiales", "Un embalaje o sujeción adecuados que eviten golpes durante el desplazamiento", "Transportarlos siempre a la máxima velocidad posible"], 2, "Los materiales frágiles requieren protección adicional frente a golpes o vibraciones durante su manejo y transporte."],
[26, "Ante el uso compartido de un montacargas o ascensor de servicio para materiales y personas, se debe respetar:", ["Las normas de uso y capacidad máxima establecidas para cada situación", "La prioridad de los materiales sobre las personas, con carácter general", "Escasas limitaciones específicas de uso", "El uso preferente para materiales, salvo excepciones puntuales"], 0, "Respetar las normas de uso y capacidad evita situaciones de riesgo tanto para las personas como para los materiales transportados."],
[26, "La revisión periódica de las cadenas o cables de un equipo de elevación tiene como finalidad:", ["Aumentar la velocidad máxima de elevación del equipo", "Reducir el peso máximo de la carga admitida", "Reducir el tiempo de mantenimiento anual del equipo", "Detectar desgastes o daños que puedan comprometer su resistencia"], 3, "Un cable o cadena desgastados pueden romperse durante el uso, por lo que su revisión periódica es una medida de seguridad esencial."],
[26, "Ante el desplazamiento de mobiliario pesado entre distintas dependencias, es recomendable:", ["Evitar el uso de cualquier medio auxiliar disponible", "Improvisar el traslado con escasa planificación previa", "Contar con los medios auxiliares y, si es necesario, el personal de apoyo adecuado", "Realizarlo siempre en solitario independientemente del peso"], 2, "Planificar el traslado con los medios y apoyo adecuados reduce el riesgo de lesiones y daños al mobiliario."],
[27, "El contenedor marrón, cada vez más habitual en la recogida selectiva municipal, se destina a:", ["El papel y cartón", "Los envases ligeros", "El vidrio", "Los residuos orgánicos o biorresiduos"], 3, "El contenedor marrón se ha ido implantando progresivamente para la recogida separada de la fracción orgánica de los residuos."],
[27, "El etiquetado de un contenedor de residuos con el tipo de material admitido tiene como finalidad:", ["Reducir el volumen total de residuos generados", "Reducir la frecuencia de recogida", "Facilitar una correcta separación por parte de las personas usuarias", "Decorar el espacio donde se ubica"], 2, "Un etiquetado claro ayuda a que las personas depositen cada residuo en el contenedor correcto, mejorando la calidad de la separación."],
[27, "Los residuos de tóner y cartuchos de impresora deben gestionarse:", ["Junto con el papel y cartón habitual", "Con escasa consideración especial", "A través de puntos de recogida específicos, dado su carácter potencialmente contaminante", "Vertiéndolos en el contenedor de residuos orgánicos"], 2, "Contienen componentes que pueden ser contaminantes, por lo que suelen contar con circuitos de recogida específicos, muchas veces gestionados por el propio fabricante o proveedor."],
[27, "La formación del personal en materia de gestión de residuos contribuye principalmente a:", ["Eliminar cualquier obligación normativa en la materia", "Mejorar la correcta separación y reducir errores en la clasificación", "Reducir de forma directa el consumo de agua del centro", "Aumentar la cantidad total de residuos generados"], 1, "Un personal bien formado comete menos errores de clasificación, mejorando la eficacia de todo el sistema de gestión de residuos."],
[27, "Ante la generación de un residuo voluminoso (por ejemplo, mobiliario en desuso) en el centro de trabajo, la vía adecuada de gestión suele ser:", ["Almacenarlo indefinidamente en cualquier espacio disponible", "Trocearlo con escaso criterio para reducir su volumen", "Su retirada a través del servicio o punto limpio correspondiente", "Depositarlo junto a los contenedores de recogida ordinaria"], 2, "Los residuos voluminosos requieren, con carácter general, una gestión diferenciada a través de servicios o puntos limpios específicos."],
[28, "El uso de una sierra manual en pequeñas tareas de carpintería requiere, entre otras precauciones:", ["Utilizar la herramienta sin comprobar su estado de afilado", "Sujetar la pieza con los dedos cerca de la zona de corte para mayor precisión", "Prescindir de cualquier sujeción de la pieza", "Sujetar firmemente la pieza a cortar y mantener las manos alejadas de la trayectoria de corte"], 3, "Sujetar bien la pieza y mantener las manos alejadas de la trayectoria de corte son medidas básicas de seguridad en el uso de herramientas de corte."],
[28, "Ante una bombilla o luminaria fundida en una dependencia administrativa, antes de sustituirla se debe:", ["Cambiarla con la corriente conectada, si se actúa con cuidado", "Cortar la alimentación eléctrica correspondiente si el tipo de instalación lo requiere", "Ignorar la avería si la sala tiene otra iluminación", "Utilizar el primer tipo de bombilla disponible, sin comprobar su compatibilidad"], 1, "Cortar la corriente cuando el tipo de instalación lo requiere es una medida básica de seguridad frente al riesgo eléctrico."],
[28, "El sellado de juntas con silicona en tareas de fontanería o carpintería tiene como finalidad:", ["Evitar filtraciones de agua o aire en la unión de dos elementos", "Decorar la superficie tratada", "Determinar el color final del acabado", "Aumentar la resistencia estructural del elemento"], 0, "La silicona sella las juntas evitando el paso de agua o aire, siendo habitual en instalaciones de fontanería o en encuentros de materiales."],
[28, "Ante un pequeño desperfecto en el pavimento de una zona de paso (baldosa suelta, por ejemplo), la actuación recomendada es:", ["Aumentar el tránsito por esa zona para comprobar su resistencia", "Señalizar el riesgo y gestionar su reparación cuanto antes", "Repararlo con materiales inadecuados con escasa garantía", "Ignorar el desperfecto si no genera molestias inmediatas"], 1, "Señalizar y reparar cuanto antes un desperfecto en el suelo previene caídas y otros accidentes en zonas de paso."],
[28, "El mantenimiento de las persianas o toldos de un edificio incluye, entre otras tareas:", ["Su desmontaje, a la espera de valorar su sustitución", "Escasa necesidad de revisión periódica", "Su sustitución, salvo que se detecte una avería previa", "La comprobación periódica de los mecanismos de accionamiento"], 3, "Revisar periódicamente los mecanismos de apertura y cierre previene averías mayores y prolonga la vida útil del elemento."],
[29, "El extintor de agua pulverizada, frente al de polvo, resulta especialmente adecuado para fuegos de:", ["Materiales sólidos (clase A)", "Equipos eléctricos en tensión", "Metales combustibles (clase D)", "Líquidos inflamables (clase B)"], 0, "El agua es especialmente eficaz en fuegos de materiales sólidos, mientras que no es adecuada para fuegos eléctricos o de líquidos inflamables."],
[29, "La comprobación visual periódica de un extintor (sin necesidad de ser una revisión oficial) puede incluir:", ["Desmontar el equipo para inspeccionar su interior", "Verificar que no está obstaculizado y que su indicador de presión es correcto", "Agitarlo violentamente con escaso motivo", "Retirar su señalización para simplificar la comprobación"], 1, "Una comprobación visual sencilla y periódica ayuda a detectar problemas evidentes entre las revisiones oficiales obligatorias."],
