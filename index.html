<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Agrupación Profesional Personal de Apoyo - IVAP</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1b2430">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --ink:#1b2430; --paper:#f7f5f0; --card:#ffffff; --line:#dcd6c8;
    --green:#2f5d4f; --green-dark:#1f3f36; --red:#8a2b2b; --gold:#a3742b; --muted:#6b6459;
    --shadow: 0 1px 2px rgba(27,36,48,.06), 0 6px 20px rgba(27,36,48,.06);
  }
  body.dark{
    --ink:#eae5da; --paper:#171b1f; --card:#20262c; --line:#3d464c;
    --green:#5fae95; --green-dark:#8fd3bd; --red:#e08787; --gold:#d9ac5f; --muted:#a9ada6;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
  }
  html.fs-sm{font-size:15px;}
  html.fs-md{font-size:16px;}
  html.fs-lg{font-size:18.5px;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;-webkit-font-smoothing:antialiased;transition:background .2s,color .2s;}
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 60px;}
  header.app{display:flex;align-items:baseline;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:22px;gap:10px;}
  header.app h1{font-size:1.3rem;letter-spacing:.02em;margin:0;font-weight:700;}
  header.app .tag{font-family:ui-monospace,Menlo,monospace;font-size:.72rem;color:var(--muted);letter-spacing:.06em;white-space:nowrap;}
  .headerRight{display:flex;align-items:center;gap:10px;}
  .iconBtn{border:1px solid var(--line);background:var(--card);border-radius:50%;width:32px;height:32px;cursor:pointer;font-size:.95rem;line-height:1;color:var(--ink);}
  .card{background:var(--card);border:1px solid var(--line);border-radius:4px;box-shadow:var(--shadow);padding:22px;margin-bottom:18px;}
  h2.section{font-size:.78rem;text-transform:uppercase;letter-spacing:.12em;color:var(--gold);margin:0 0 14px;font-family:ui-monospace,Menlo,monospace;border-bottom:1px solid var(--line);padding-bottom:8px;}
  .btn{font-family:ui-monospace,Menlo,monospace;font-size:.85rem;letter-spacing:.03em;border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:11px 18px;border-radius:2px;cursor:pointer;}
  .btn.secondary{background:transparent;color:var(--ink);}
  .btn.wide{width:100%;}
  .btn:disabled{opacity:.4;cursor:default;}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .num-input,select.field{width:100px;padding:9px;font-family:ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:2px;font-size:.9rem;background:var(--card);color:var(--ink);}
  input[type="text"].field{width:100%;padding:12px;border:1px solid var(--line);border-radius:2px;font-size:1rem;background:var(--card);color:var(--ink);box-sizing:border-box;}
  select.field{width:auto;}
  .tema-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:.86rem;max-height:300px;overflow-y:auto;padding-right:4px;}
  @media (max-width:560px){.tema-grid{grid-template-columns:1fr;}}
  .tema-item{display:flex;align-items:flex-start;gap:8px;line-height:1.3;padding:4px 0;border-bottom:1px dashed var(--line);}
  .tema-item input{margin-top:4px;flex-shrink:0;}
  .tema-actions{display:flex;gap:14px;margin:10px 0 14px;font-size:.8rem;}
  .tema-actions a,.link-btn{color:var(--green);cursor:pointer;text-decoration:underline;background:none;border:none;font-size:.85rem;padding:0;font-family:inherit;}
  .progress-bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:16px;}
  .progress-fill{height:100%;background:var(--green);transition:width .25s ease;}
  .qmeta{font-family:ui-monospace,Menlo,monospace;font-size:.72rem;color:var(--muted);letter-spacing:.05em;margin-bottom:10px;text-transform:uppercase;display:flex;justify-content:space-between;}
  .qtext{font-size:1.12rem;line-height:1.5;margin:0 0 20px;}
  .option{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:3px;padding:13px 14px;margin-bottom:10px;cursor:pointer;font-size:.98rem;line-height:1.4;background:var(--card);transition:border-color .15s,background .15s;}
  .option:hover{border-color:var(--green);}
  .option .letter{font-family:ui-monospace,Menlo,monospace;font-weight:700;color:var(--gold);flex-shrink:0;}
  .option.correct{border-color:var(--green);background:rgba(47,93,79,.12);}
  .option.correct .letter{color:var(--green);}
  .option.wrong{border-color:var(--red);background:rgba(138,43,43,.12);}
  .option.wrong .letter{color:var(--red);}
  .option.disabled{cursor:default;}
  .option.selected{border-color:var(--gold);background:rgba(163,116,43,.12);}
  .flagBtn{border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:.72rem;padding:3px 8px;border-radius:10px;cursor:pointer;font-family:ui-monospace,Menlo,monospace;white-space:nowrap;}
  .flagBtn.active{border-color:var(--gold);color:var(--gold);background:rgba(163,116,43,.12);}
  .feedback{margin-top:6px;padding:12px 14px;border-radius:3px;font-size:.88rem;line-height:1.5;}
  .feedback.ok{background:rgba(47,93,79,.12);border:1px solid var(--green);color:var(--green-dark);}
  .feedback.no{background:rgba(138,43,43,.12);border:1px solid var(--red);color:var(--red);}
  .footer-nav{display:flex;justify-content:space-between;align-items:center;margin-top:18px;}
  .score-big{font-size:2.6rem;font-weight:700;font-family:ui-monospace,Menlo,monospace;}
  .tema-result{display:flex;justify-content:space-between;font-size:.85rem;padding:7px 0;border-bottom:1px dashed var(--line);}
  .badge{font-family:ui-monospace,Menlo,monospace;font-size:.72rem;padding:2px 7px;border-radius:10px;background:var(--line);color:var(--ink);}
  textarea{width:100%;min-height:140px;font-family:ui-monospace,Menlo,monospace;font-size:.82rem;border:1px solid var(--line);border-radius:3px;padding:10px;background:var(--card);color:var(--ink);}
  .small{font-size:.82rem;color:var(--muted);line-height:1.5;}
  .flag{display:inline-block;width:14px;height:14px;border-radius:50%;background:conic-gradient(from 0deg,#d52b1e 0 25%,#eab308 25% 40%,#2f5d4f 40% 100%);margin-right:8px;vertical-align:-2px;}
  .radioRow{display:flex;gap:16px;font-size:.88rem;margin:6px 0;flex-wrap:wrap;}
  .radioRow label{display:flex;gap:6px;align-items:center;cursor:pointer;}
  .statBar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;flex:1;margin:0 10px;}
  .statBar > div{height:100%;background:var(--green);}
  .statRow{display:flex;align-items:center;font-size:.82rem;padding:8px 0;border-bottom:1px dashed var(--line);}
  .statRow .name{width:160px;flex-shrink:0;}
  .statRow .pct{width:44px;text-align:right;font-family:ui-monospace,Menlo,monospace;flex-shrink:0;}
  .timerBox{font-family:ui-monospace,Menlo,monospace;font-weight:700;font-size:.95rem;padding:4px 10px;border:1px solid var(--line);border-radius:3px;}
  .timerBox.low{color:var(--red);border-color:var(--red);}

  /* Splash screen */
  .splash{
    position:fixed; inset:0; z-index:50;
    display:flex; flex-direction:column; justify-content:center; align-items:center;
    background: radial-gradient(ellipse at 50% 30%, rgba(163,116,43,.10), transparent 60%), var(--paper);
    cursor:pointer; text-align:center; padding:24px;
  }
  .splash-flag{width:34px;height:34px;border-radius:50%;background:conic-gradient(from 0deg,#d52b1e 0 25%,#eab308 25% 40%,#2f5d4f 40% 100%);margin-bottom:26px;box-shadow:0 4px 18px rgba(0,0,0,.15);}
  .splash-logo{max-width:min(420px,80vw);width:100%;height:auto;margin-bottom:30px;}
  .splash-title{
    font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;
    font-weight:700; letter-spacing:.02em; color:var(--ink);
    font-size:clamp(2.4rem, 9vw, 4.2rem); line-height:1.05; margin:0;
  }
  .splash-subtitle{
    font-family: ui-monospace, Menlo, monospace;
    text-transform:uppercase; letter-spacing:.22em; color:var(--gold);
    font-size:clamp(.9rem, 3vw, 1.15rem); margin:18px 0 0;
  }
  .splash-rule{width:64px;height:2px;background:var(--ink);margin:26px 0;opacity:.5;}
  .splash-hint{font-family:ui-monospace,Menlo,monospace;font-size:.72rem;color:var(--muted);letter-spacing:.08em;margin-top:40px;animation:splashPulse 2s ease-in-out infinite;}
  @keyframes splashPulse{0%,100%{opacity:.4;}50%{opacity:1;}}
  .splash-credit{
    position:fixed; bottom:22px; right:26px; z-index:51;
    font-family:ui-monospace,Menlo,monospace; letter-spacing:.05em;
    font-size:.8rem; color:var(--ink); opacity:.75;
    padding:6px 12px; border:1px solid var(--line); border-radius:3px; background:var(--card);
  }
</style>
</head>

[12, "Los trastornos musculoesqueléticos derivados de malas posturas mantenidas afectan con mayor frecuencia a:", ["Exclusivamente al sistema respiratorio", "Exclusivamente a la vista", "La zona lumbar, cervical y las extremidades superiores", "Exclusivamente al sistema digestivo"], 2, "Son las zonas más habitualmente afectadas por sobrecargas posturales y movimientos repetitivos en el trabajo."],
[12, "Al levantar una carga situada por encima de la altura de los hombros, se recomienda:", ["Lanzar la carga hacia abajo para no sujetarla en alto", "Utilizar un elemento de apoyo (escalera o banqueta) en vez de estirar excesivamente los brazos", "Girar el tronco para alcanzarla lateralmente", "Ponerse de puntillas y estirar al máximo los brazos"], 1, "Evitar estiramientos forzados y usar elementos de apoyo reduce el riesgo de lesión en hombros y espalda."],
[12, "La rotación de tareas entre el personal es una medida preventiva recomendable, principalmente, para:", ["Aumentar la carga de trabajo individual", "Reducir la exposición prolongada a movimientos repetitivos o posturas forzadas", "Sustituir la necesidad de formación en PRL", "Eliminar la obligación de evaluar los riesgos del puesto"], 1, "Variar las tareas reduce el tiempo de exposición continuada a un mismo factor de riesgo postural o repetitivo."],
[12, "Ante una carga voluminosa que dificulta la visión durante su transporte, la actuación correcta es:", ["Comprobar previamente el itinerario y pedir ayuda si es necesario", "Transportarla siempre en solitario sin ayuda", "Correr para finalizar antes el transporte", "Transportarla igualmente confiando en la memoria del trayecto"], 0, "Verificar el itinerario y solicitar ayuda cuando la visión está comprometida evita golpes, caídas y sobreesfuerzos."],
[12, "El uso de una faja lumbar en tareas de manipulación de cargas debe considerarse:", ["La única medida preventiva necesaria", "Innecesaria si la carga pesa menos de 5 kg", "Obligatoria en cualquier puesto de trabajo", "Una ayuda complementaria, no un sustituto de una técnica de levantamiento correcta"], 3, "Las fajas lumbares pueden ayudar en tareas puntuales, pero nunca sustituyen una técnica de levantamiento adecuada ni la reducción del riesgo en origen."],
[12, "Al transportar una carga entre dos personas, es recomendable:", ["Evitar cualquier comunicación durante el transporte", "Que una de las personas cargue todo el peso mientras la otra observa", "Coordinar los movimientos y comunicarse durante todo el trayecto", "Que cada persona actúe sin coordinarse con la otra"], 2, "La coordinación y comunicación entre ambas personas evita movimientos bruscos o desincronizados que puedan causar una lesión."],
[12, "El uso de calzado adecuado en tareas que impliquen estar de pie o caminar mucho tiempo contribuye a:", ["Sustituir la necesidad de pausas periódicas", "No tiene ninguna relación con la prevención de riesgos", "Aumentar la velocidad de ejecución de las tareas", "Reducir la fatiga y prevenir problemas posturales y circulatorios"], 3, "Un calzado adecuado, con buen soporte y amortiguación, es un factor preventivo relevante frente a la fatiga postural."],
[12, "Al realizar una tarea que exige inclinarse repetidamente hacia adelante (por ejemplo, para colocar objetos en una balda baja), se recomienda:", ["Doblar siempre la espalda para ahorrar tiempo", "Evitar cualquier flexión de rodillas por resultar más lento", "Realizar el movimiento lo más rápido posible sin pausas", "Flexionar las rodillas en vez de doblar la espalda repetidamente"], 3, "Flexionar las rodillas reduce la carga acumulada sobre la columna lumbar frente a la flexión repetida de la espalda."],

[12, "Si una tarea exige mantener los brazos por encima de la altura de los hombros durante periodos prolongados, una medida preventiva adecuada es:", ["Ignorar la postura si no genera dolor inmediato", "Aumentar la duración de la tarea sin ninguna pausa", "Reorganizar la tarea o usar apoyos que reduzcan el tiempo en esa postura", "Prescindir de cualquier evaluación del puesto"], 2, "Mantener los brazos elevados de forma prolongada es un factor de riesgo relevante que debe corregirse mediante rediseño de la tarea o apoyos técnicos."],

[12, "Ante una tarea que combina bipedestación prolongada y manipulación de cargas, la organización del trabajo debería priorizar:", ["La alternancia de tareas y las pausas para reducir la exposición combinada a ambos factores de riesgo", "Ignorar la combinación de factores de riesgo si cada uno por separado es asumible", "Aumentar el peso de las cargas para acortar el tiempo total de la tarea", "Mantener la misma tarea sin pausas durante toda la jornada"], 0, "La combinación de varios factores de riesgo postural puede aumentar el riesgo global, por lo que la alternancia y las pausas son especialmente relevantes."],
[13, "Ante una persona inconsciente que respira, la posición recomendada es:", ["Boca abajo sin ninguna precaución", "Sentada con la cabeza hacia atrás", "La posición lateral de seguridad", "Boca arriba con las piernas elevadas"], 2, "La posición lateral de seguridad es la recomendada para una persona inconsciente que respira con normalidad, mientras se espera ayuda."],

[13, "En caso de hemorragia externa importante, la primera medida es:", ["Dar líquidos abundantes a la persona afectada", "Aplicar presión directa sobre la herida", "Aplicar un torniquete de inmediato en todos los casos", "Aplicar frío directamente sobre la herida sin protección"], 1, "Ante una hemorragia externa importante, la primera medida es aplicar presión directa sobre la herida."],

[13, "El número de teléfono de emergencias común en la Unión Europea es:", ["112", "061", "091", "080"], 0, "El 112 es el número de teléfono de emergencias común en toda la Unión Europea."],

[19, "La comunicación no verbal incluye, entre otros elementos, la:", ["La numeración de un expediente", "Redacción de un oficio", "Expresión facial y los gestos", "La firma electrónica"], 2, "La comunicación no verbal incluye, entre otros elementos, la expresión facial y los gestos."],
[19, "El desvío de llamadas en la atención telefónica institucional debe emplearse cuando:", ["Se quiera evitar sistemáticamente la atención al público", "Sea preciso derivar la consulta al servicio competente para resolverla", "Sea la única forma de atención disponible", "No exista ningún criterio organizativo"], 1, "El desvío de llamadas debe emplearse cuando sea preciso derivar la consulta al servicio competente para resolverla."],
[19, "La escucha activa implica, entre otros aspectos:", ["Formular juicios de valor inmediatos", "Ignorar el contenido emocional del mensaje", "Prestar atención plena a lo que expresa la persona interlocutora", "Interrumpir constantemente el discurso"], 2, "La escucha activa implica prestar atención plena a lo que expresa la persona interlocutora, verificando su comprensión."],
[19, "La comunicación no verbal en la atención presencial incluye, entre otros elementos:", ["Únicamente el contenido de los formularios entregados", "La firma electrónica del funcionario", "El sello del registro de entrada", "La expresión facial, la postura corporal y el tono de voz"], 3, "La comunicación no verbal complementa y a veces condiciona más que el propio contenido verbal la calidad percibida de la atención."],
[19, "En la atención telefónica a la ciudadanía, una buena práctica es:", ["Identificarse con el nombre del organismo y, si procede, el propio, al inicio de la llamada", "Evitar dar cualquier información por teléfono", "Interrumpir constantemente a la persona que llama", "Colgar sin explicación si la consulta es compleja"], 0, "En la atención telefónica, identificarse con el nombre del organismo y, si procede, el propio, al inicio de la llamada es una buena práctica."],
[19, "El desvío de llamadas en la atención telefónica debe realizarse:", ["Únicamente si lo autoriza un superior por escrito", "De forma indefinida sin ninguna resolución final", "Informando previamente a la persona usuaria y motivando el traslado", "Sin informar en ningún caso a la persona que llama"], 2, "El desvío de llamadas debe realizarse informando previamente a la persona usuaria y motivando el traslado de la consulta."],
[19, "La escucha activa, como técnica de comunicación en la atención a la ciudadanía, implica:", ["Prestar atención plena al interlocutor, mostrando comprensión de su mensaje", "Repetir mecánicamente las palabras del interlocutor sin comprensión real", "Evitar el contacto visual en la atención presencial", "Interrumpir constantemente para acelerar la atención"], 0, "La escucha activa implica prestar atención plena al interlocutor, mostrando comprensión de su mensaje."],
[19, "En la atención presencial a la ciudadanía, la proxémica se refiere a:", ["El horario de atención al público", "El contenido escrito de los formularios", "El volumen de la voz utilizado", "La gestión adecuada de la distancia física entre las personas durante la interacción"], 3, "La proxémica se refiere a la gestión adecuada de la distancia física entre las personas durante la interacción presencial."],
[19, "Ante una persona usuaria alterada o molesta en la atención presencial, una técnica adecuada es:", ["Responder con el mismo tono elevado", "Ignorar completamente sus quejas", "Mantener la calma, escuchar activamente y ofrecer soluciones dentro de las competencias del puesto", "Finalizar la atención de forma abrupta sin explicación"], 2, "Ante una persona alterada, mantener la calma, escuchar activamente y ofrecer soluciones dentro de las propias competencias es la técnica recomendada."],
[19, "La empatía, como habilidad de comunicación en la atención a la ciudadanía, consiste en:", ["Compartir siempre la opinión de la persona usuaria aunque sea errónea", "Comprender la situación y las emociones de la persona usuaria poniéndose en su lugar", "Anteponer los propios intereses a los del usuario", "Evitar cualquier tipo de contacto emocional en la atención"], 1, "La empatía consiste en comprender la situación y las emociones de la persona usuaria, poniéndose en su lugar."],
[19, "El feedback o retroalimentación en la comunicación con la ciudadanía permite:", ["Confirmar que el mensaje ha sido comprendido correctamente por ambas partes", "Finalizar la conversación de forma unilateral", "Evitar cualquier pregunta de aclaración", "Sustituir la necesidad de escuchar a la persona usuaria"], 0, "El feedback o retroalimentación permite confirmar que el mensaje ha sido comprendido correctamente por ambas partes de la comunicación."],
[19, "La atención telefónica de calidad exige, entre otros aspectos:", ["Un tono de voz adecuado y una escucha activa de la persona que llama", "Hablar siempre con rapidez extrema sin pausas", "Evitar dar el nombre del organismo", "Terminar la llamada antes de resolver la consulta"], 0, "La atención telefónica de calidad exige, entre otros aspectos, un tono de voz adecuado y una escucha activa de quien llama."],
[19, "El silencio en la comunicación oral con la ciudadanía puede utilizarse, entre otros fines, para:", ["Evitar la resolución de la consulta", "Dar tiempo a la persona usuaria a expresar su consulta o duda", "Generar incomodidad de forma deliberada", "Sustituir cualquier explicación necesaria"], 1, "El silencio en la comunicación oral puede utilizarse, entre otros fines, para dar tiempo a la persona usuaria a expresar su consulta."],
[19, "Ante una consulta que excede las competencias del puesto de atención, la actuación adecuada es:", ["Inventar una respuesta sin base real", "Ignorar la pregunta planteada", "Negarse a atender la consulta sin explicación", "Derivar a la persona usuaria al servicio competente, informando del motivo"], 3, "Ante una consulta que excede las propias competencias, lo adecuado es derivar a la persona al servicio competente, informando del motivo."],
[19, "En la atención telefónica, el protocolo habitual de descolgado recomienda:", ["Transferir la llamada sin informar al usuario del motivo", "Dejar sonar el teléfono el mayor tiempo posible antes de contestar", "Contestar sin identificación alguna del servicio", "Identificar el organismo, saludar y ofrecerse a ayudar en un tiempo breve"], 3, "Un protocolo de atención telefónica de calidad exige una identificación clara y una respuesta ágil."],
[20, "Ante una persona que solicita acceder a dependencias administrativas restringidas, la actuación correcta del personal de control de acceso es:", ["Denegar el acceso a cualquier persona sin excepción", "Ignorar la solicitud hasta que la persona insista", "Permitir el acceso sin ninguna comprobación", "Verificar su identidad y el motivo de la visita conforme al protocolo establecido"], 3, "El control de acceso exige verificar identidad y motivo conforme a los protocolos de seguridad del edificio."],
[20, "La acreditación o tarjeta de visitante en un edificio administrativo tiene como finalidad principal:", ["Identificar a las personas ajenas al centro que se encuentran en las instalaciones", "Autorizar el acceso a cualquier dependencia sin restricción", "Eliminar la necesidad de registrar la visita", "Sustituir el documento de identidad de la persona"], 0, "Permite identificar visualmente a quien no pertenece habitualmente al edificio, facilitando el control interno de personas."],
[20, "Ante una situación de emergencia (incendio, evacuación), el personal de control de acceso debe:", ["Ignorar la alarma si no ve fuego directamente", "Abandonar su puesto sin informar a nadie", "Seguir el protocolo de emergencia establecido, facilitando la evacuación ordenada", "Impedir la salida de las personas hasta nueva orden"], 2, "El personal de control de acceso suele tener un papel activo en la ejecución del plan de autoprotección y evacuación del edificio."],
[20, "El registro de entradas y salidas de personas visitantes permite, entre otras funciones:", ["Autorizar automáticamente cualquier acceso futuro", "Sustituir el registro administrativo de documentos", "Disponer de constancia de quién ha accedido al edificio y cuándo, por motivos de seguridad", "Eliminar la necesidad de identificación personal"], 2, "Es una medida de seguridad y trazabilidad habitual en el control de accesos a edificios públicos."],
[20, "Ante una persona con actitud agresiva que exige acceder sin autorización, la actuación recomendada del personal de recepción es:", ["Mantener la calma, informar con firmeza de la normativa y solicitar apoyo si es necesario", "Permitir el acceso para evitar el conflicto", "Discutir elevando el tono de voz", "Abandonar el puesto de control"], 0, "La calma, la firmeza informativa y la solicitud de apoyo (seguridad, superior jerárquico) son la pauta recomendada en protocolos de atención."],
[20, "La función de información y orientación en un puesto de recepción incluye, entre otras tareas:", ["Resolver por sí mismo cualquier trámite administrativo del visitante", "Redactar informes técnicos del servicio visitado", "Sustituir la atención telefónica del organismo", "Indicar a la persona visitante la ubicación del despacho o servicio que busca"], 3, "La recepción cumple una función de primera orientación, derivando a la persona al servicio o despacho correspondiente."],
[20, "Ante la pérdida o el olvido de una tarjeta de acceso por parte de una persona empleada, el protocolo habitual exige:", ["Comunicarlo de inmediato al servicio responsable para su anulación y sustitución", "Permitir el acceso libre sin ninguna acreditación mientras tanto", "Ignorar el hecho hasta que la persona la encuentre por sí misma", "Facilitar una copia sin ningún registro ni control"], 0, "Anular la tarjeta extraviada evita un uso indebido por parte de terceros, minimizando el riesgo de seguridad."],
[20, "El control de paquetería y mercancías que acceden a un edificio administrativo debe realizarse:", ["Permitiendo el acceso directo a cualquier zona del edificio sin control", "Únicamente si el paquete supera un determinado peso", "Conforme al protocolo de seguridad establecido, verificando su procedencia y destino", "Sin ningún tipo de registro ni comprobación"], 2, "Verificar procedencia y destino de la paquetería es una medida básica de seguridad frente a envíos no autorizados o sospechosos."],
[20, "Ante la presencia de un objeto abandonado y sospechoso en el vestíbulo de un edificio público, la actuación correcta del personal de control de acceso es:", ["Manipularlo para identificar su contenido", "Desecharlo directamente en un contenedor", "No manipularlo y activar el protocolo de seguridad correspondiente", "Ignorarlo si no genera molestias inmediatas"], 2, "Ante un objeto sospechoso, la pauta de seguridad es no manipularlo y dar aviso siguiendo el protocolo establecido."],
[20, "La videovigilancia en los accesos a un edificio administrativo debe cumplir, entre otros requisitos:", ["Respetar la normativa de protección de datos y contar con la señalización informativa correspondiente", "Sustituir completamente al personal de control de acceso", "Grabar sin ninguna limitación ni informar a las personas", "Almacenar las grabaciones de forma indefinida sin ningún límite"], 0, "El uso de cámaras de videovigilancia está sujeto a la normativa de protección de datos, que exige informar y limitar la conservación de las imágenes."],
[20, "Al identificar a una persona que solicita el acceso mediante documento de identidad, el personal de control debe:", ["Aceptar cualquier documento sin verificar su correspondencia con la persona", "Rechazar sistemáticamente cualquier identificación presentada", "Comprobar que los datos corresponden a la persona presente y al motivo declarado de la visita", "Anotar únicamente el nombre sin comprobar el documento"], 2, "Verificar la correspondencia entre el documento y la persona es una función básica del control de identificación en el acceso."],
[20, "El libro de incidencias o registro de novedades en un puesto de control de acceso sirve para:", ["Dejar constancia de sucesos relevantes ocurridos durante el turno de trabajo", "Anotar exclusivamente los datos personales del personal de seguridad", "Eliminar la necesidad de comunicar incidencias a un superior", "Sustituir el registro general de entrada de documentos"], 0, "Permite mantener un histórico de incidencias relevantes, útil para el seguimiento y la coordinación entre turnos."],
[20, "Ante una persona con discapacidad que solicita acceder a un edificio con barreras arquitectónicas, el personal de control de acceso debe:", ["Facilitar, en la medida de lo posible, una vía o apoyo alternativo de acceso", "Ignorar la situación por no ser de su competencia", "Denegar el acceso hasta que se elimine la barrera arquitectónica", "Exigir que la persona resuelva la situación por sí misma"], 0, "Facilitar vías o apoyos alternativos es una medida básica de atención a la accesibilidad mientras se resuelven las barreras estructurales."],
[20, "El horario de apertura y cierre de un edificio administrativo debe ser conocido y respetado por el personal de control de acceso porque:", ["Solo afecta al personal de limpieza", "Es una información irrelevante para su función", "Puede modificarse libremente por cualquier persona visitante", "Determina el marco en el que se autoriza el acceso ordinario de personas visitantes"], 3, "El horario de apertura marca el periodo en que corresponde autorizar accesos ordinarios, salvo autorizaciones especiales."],
[20, "Ante un simulacro de evacuación programado, el personal de control de acceso debe:", ["Seguir las instrucciones específicas previstas para el simulacro en el plan de autoprotección", "Impedir la salida de las personas durante el simulacro", "Abandonar su puesto sin ninguna instrucción concreta", "Ignorar el simulacro por no tratarse de una emergencia real"], 0, "Los simulacros forman parte del plan de autoprotección y el personal debe seguir el protocolo específico previsto para ellos."],
[20, "La discreción y confidencialidad respecto a las personas que acceden a determinadas dependencias (por ejemplo, despachos de dirección) es importante porque:", ["Solo afecta a las visitas de cargos políticos", "No tiene ninguna relevancia para el personal de control de acceso", "Debe comunicarse siempre públicamente", "Puede tratarse de información sensible o relativa a la privacidad de terceros"], 3, "El personal de control de acceso maneja información sobre visitas que puede ser sensible y debe tratarse con la debida discreción."],
[20, "Ante la llegada de un servicio de mensajería con un envío para una persona ausente en ese momento, el protocolo habitual es:", ["Entregar el envío a cualquier persona que lo solicite sin comprobación", "Abrir el envío para verificar su contenido antes de aceptarlo", "Registrar la recepción y gestionar su entrega o custodia conforme al procedimiento del centro", "Rechazar cualquier envío si el destinatario no está presente"], 2, "El registro de la recepción y su custodia hasta la entrega efectiva es la práctica habitual ante la ausencia del destinatario."],
[20, "En la atención a personas mayores en el control de acceso, es recomendable:", ["Acelerar el trato para agilizar el flujo de personas", "Evitar cualquier explicación adicional sobre la ubicación de servicios", "Delegar siempre la atención en otra persona sin intervenir", "Ofrecer una atención pausada y clara, facilitando la orientación dentro del edificio"], 3, "Una atención pausada y orientativa mejora la experiencia de las personas mayores, que pueden requerir más tiempo o explicaciones."],
[20, "El uso de un lector de códigos o tarjetas de proximidad en el control de acceso permite, entre otras ventajas:", ["Prescindir de cualquier registro documental", "Sustituir completamente cualquier supervisión humana", "Registrar de forma automática la entrada y salida de personas autorizadas", "Eliminar la necesidad de cualquier identificación personal"], 2, "Estos sistemas automatizan el registro de accesos, complementando pero no sustituyendo la supervisión humana cuando es necesaria."],
[20, "Al detectar que una persona intenta acceder con documentación aparentemente falsificada, la actuación correcta es:", ["Permitir el acceso para evitar un conflicto", "Ignorar la sospecha si la persona insiste con seguridad", "Confiscar el documento sin dar parte a nadie", "Denegar el acceso y comunicarlo conforme al protocolo de seguridad establecido"], 3, "Ante sospechas fundadas de falsificación, corresponde denegar el acceso y seguir el protocolo de comunicación interna establecido."],
[20, "La señalización de las zonas de acceso restringido en un edificio administrativo tiene como finalidad:", ["Confundir deliberadamente a las personas visitantes", "Informar claramente sobre las limitaciones de acceso a determinadas áreas", "Sustituir la necesidad de personal de control", "Decorar el espacio sin ninguna función informativa"], 1, "Una señalización clara ayuda a que las personas conozcan qué áreas requieren autorización especial, facilitando el control de acceso."],
[20, "Ante una avería en el sistema electrónico de control de acceso, el protocolo de contingencia habitual prevé:", ["El acceso libre sin ningún control mientras dure la avería", "Un procedimiento manual alternativo de identificación y registro", "El cierre permanente del edificio hasta la reparación", "La suspensión total de la actividad del edificio"], 1, "Los protocolos de contingencia permiten mantener un control básico manual mientras se resuelve la incidencia técnica."],
[20, "La rotación de turnos en el personal de control de acceso tiene como finalidad, entre otras:", ["Reducir la seguridad del edificio", "Eliminar la necesidad de protocolos de actuación", "Garantizar la cobertura del servicio durante todo el horario establecido", "Aumentar la carga de trabajo de una única persona"], 2, "La organización por turnos permite mantener el servicio de control de acceso activo durante todo el horario de apertura del edificio."],
[20, "Ante la salida de material o equipamiento del edificio por parte de una persona empleada, el protocolo habitual de control de acceso puede exigir:", ["Solo la comprobación si el material es muy voluminoso", "Una autorización o justificante que acredite dicha salida", "Ninguna comprobación en ningún caso", "Impedir siempre la salida de cualquier material"], 1, "Contar con una autorización o justificante para la salida de material es una medida de control habitual frente a posibles sustracciones."],
[20, "La comunicación fluida entre los distintos turnos del personal de control de acceso es importante para:", ["Eliminar la necesidad de identificación de visitantes", "Reducir la necesidad de protocolos de actuación", "Sustituir el registro de incidencias por escrito", "Garantizar la continuidad en el seguimiento de incidencias o situaciones pendientes"], 3, "Un buen traspaso de información entre turnos evita que incidencias o situaciones pendientes queden desatendidas."],
[21, "En la preparación de una sala de reuniones, una de las primeras comprobaciones a realizar es:", ["El presupuesto anual del departamento", "La antigüedad del edificio", "El color de las paredes de la sala", "El número de asistentes previsto para disponer el mobiliario adecuado"], 3, "Conocer el número de asistentes es clave para decidir la disposición de mesas y sillas más adecuada."],
[21, "La disposición de mesas en 'U' en una sala de reuniones es especialmente adecuada para:", ["Reuniones donde se favorece la visibilidad entre todos los asistentes y con la persona ponente", "Conferencias con público muy numeroso sin interacción", "Almacenaje de material de oficina", "Exámenes individuales"], 0, "La disposición en U facilita el contacto visual entre los participantes y con quien dirige la reunión."],
[21, "Antes de una reunión con proyección audiovisual, una comprobación previa recomendable es:", ["Desconectar todos los equipos disponibles en la sala", "Reducir la iluminación de la sala al mínimo posible sin comprobar nada más", "Verificar el correcto funcionamiento del proyector, el sonido y la conexión con el equipo a utilizar", "No comprobar el equipo hasta que llegue la persona ponente"], 2, "Comprobar previamente el equipo audiovisual evita incidencias técnicas durante el desarrollo de la reunión."],
[21, "El papelógrafo es un elemento de apoyo utilizado habitualmente en reuniones para:", ["Anotar ideas o esquemas de forma visible para el conjunto de asistentes", "Sustituir el acta de la reunión", "Grabar el audio de la reunión", "Proyectar contenido digital"], 0, "Es un soporte de hojas grandes sobre un caballete, utilizado para anotar ideas visibles durante una reunión o formación."],
[21, "Tras la finalización de una reunión, una tarea habitual de apoyo es:", ["Modificar el contenido de las conclusiones alcanzadas", "Eliminar el acta de la reunión", "Recoger y reordenar el mobiliario y los medios materiales utilizados", "Convocar automáticamente una nueva reunión"], 2, "El apoyo a reuniones incluye tanto la preparación previa como la recogida y reordenación posterior de la sala."],
[21, "Los sistemas de audio en una sala de reuniones (altavoces y micrófonos) deben comprobarse, como buena práctica:", ["Solo en reuniones con más de 50 personas", "Con antelación suficiente al inicio del acto, no en el mismo momento de comenzar", "Únicamente si algún asistente se queja durante la reunión", "Nunca, ya que suelen funcionar siempre correctamente"], 1, "Comprobar el sonido con antelación permite solucionar incidencias sin retrasar el inicio del acto."],
[21, "La colocación de agua y material de escritura en una sala de reuniones es una tarea habitual de:", ["Mantenimiento de instalaciones eléctricas", "Apoyo a la preparación de la sala antes del inicio del acto", "Control de acceso al edificio", "Gestión del archivo documental"], 1, "Forma parte de las tareas de preparación logística previa a una reunión o acto, facilitando la comodidad de los asistentes."],
[21, "La disposición de mesas en 'escuela' o 'aula', con filas orientadas hacia un punto central, es habitual en:", ["Actividades formativas o conferencias con un ponente principal", "Reuniones de trabajo en pequeño grupo con alta interacción", "Actividades exclusivamente al aire libre", "Almacenaje de material de oficina"], 0, "Esta disposición favorece la atención hacia quien imparte la formación o conferencia, aunque limita la interacción entre asistentes."],
[21, "Antes de un acto con un número elevado de asistentes, conviene comprobar, entre otros aspectos:", ["El aforo máximo permitido de la sala y las salidas de emergencia", "La marca del proyector, sin comprobar su funcionamiento", "Únicamente la decoración de la sala", "El color de las sillas disponibles"], 0, "El aforo y las salidas de emergencia son aspectos de seguridad esenciales que deben respetarse en cualquier acto con asistencia de público."],
[21, "El micrófono de solapa, frente al micrófono de mano, se utiliza habitualmente cuando:", ["No se dispone de sistema de megafonía", "Se requiere un mayor alcance de sonido en exteriores", "La persona ponente necesita tener las manos libres durante su intervención", "Se trata de una reunión sin ningún ponente principal"], 2, "El micrófono de solapa libera las manos de quien habla, siendo útil en presentaciones que requieren gesticulación o uso de materiales."],
[21, "Al finalizar un acto con proyección de contenido digital, una buena práctica es:", ["Eliminar automáticamente cualquier archivo del ordenador utilizado", "Comprobar que no queden documentos o presentaciones abiertos en el equipo utilizado", "Dejar el equipo encendido de forma indefinida", "Desconectar el proyector sin apagar el resto de equipos"], 1, "Verificar que no quedan documentos sensibles abiertos protege la confidencialidad de la información tras el uso compartido del equipo."],
[21, "La rotulación o cartelería identificativa en una sala de reuniones (nombre del acto, horario) tiene como finalidad:", ["Decorar el espacio sin ninguna función práctica", "Reducir el aforo permitido de la sala", "Sustituir la convocatoria oficial del acto", "Facilitar la orientación de las personas asistentes"], 3, "Ayuda a que las personas asistentes localicen fácilmente la sala y confirmen que corresponde al acto al que acuden."],
[21, "Ante un fallo técnico imprevisto durante una videoconferencia en una reunión, la actuación recomendada del personal de apoyo es:", ["Intentar solucionarlo con calma o recurrir a un plan alternativo previamente previsto", "Ignorar el fallo esperando que se resuelva solo sin intervención", "Culpar públicamente al proveedor del servicio durante el acto", "Interrumpir definitivamente la reunión sin buscar alternativas"], 0, "Contar con un plan de contingencia y actuar con calma ante incidencias técnicas minimiza el impacto en el desarrollo del acto."],
[21, "El etiquetado o numeración de los asientos en actos con protocolo institucional sirve para:", ["Sustituir la necesidad de invitaciones", "Facilitar la ubicación ordenada de las personas conforme al orden protocolario previsto", "Sustituir el control de acceso al recinto", "Reducir el número de asistentes permitidos"], 1, "En actos con protocolo, la ubicación ordenada de los asientos refleja el orden de precedencia y facilita la organización del acto."],
[21, "La climatización adecuada de una sala antes de una reunión prolongada es importante porque:", ["Sustituye la necesidad de pausas durante la reunión", "Solo es relevante en los meses de verano", "No tiene ninguna influencia en el desarrollo del acto", "Afecta directamente al confort y la concentración de las personas asistentes"], 3, "Una temperatura inadecuada puede afectar negativamente a la atención y comodidad de los asistentes durante un acto prolongado."],
[21, "Al preparar una sala para una reunión con personas con movilidad reducida, se debe tener en cuenta:", ["Ubicar exclusivamente en plantas sin acceso adaptado", "Situar el mobiliario de forma que dificulte el desplazamiento", "Dejar espacios de paso accesibles y sin obstáculos entre el mobiliario", "Ignorar cualquier necesidad específica de accesibilidad"], 2, "Prever espacios de paso accesibles es una medida básica de atención a la diversidad funcional en la organización de actos y reuniones."],
[21, "El material de apoyo como carpetas, bolígrafos o folletos que se distribuyen en una reunión debe:", ["Sustituir la convocatoria oficial del acto", "Repartirse durante el desarrollo de la reunión sin ninguna previsión", "Prepararse y colocarse con antelación suficiente al inicio del acto", "Eliminarse de cualquier acto institucional"], 2, "Preparar el material con antelación evita retrasos e improvisaciones justo antes o durante el desarrollo del acto."],
[21, "El uso de alargadores eléctricos para conectar equipos audiovisuales en una sala de reuniones debe hacerse:", ["Sobrecargando el mismo alargador con múltiples equipos sin comprobar su capacidad", "Ocultándolos bajo alfombras sin ninguna protección", "Dejándolos siempre sueltos por el suelo sin ninguna fijación", "Evitando que crucen zonas de paso sin la debida protección o señalización"], 3, "Los cables sueltos en zonas de paso son un riesgo de tropiezo; deben protegerse o señalizarse adecuadamente."],
[21, "La previsión de un intérprete de lengua de signos en un acto público debe solicitarse, como buena práctica:", ["Nunca, al considerarse un servicio prescindible", "Con antelación suficiente para poder organizarlo adecuadamente", "Solo si asiste una única persona sorda", "El mismo día del acto sin ninguna planificación previa"], 1, "Solicitarlo con antelación permite garantizar la disponibilidad del profesional y una correcta organización del acto."],
[21, "El etiquetado de los cables y conexiones en una sala con equipamiento audiovisual complejo facilita:", ["Aumentar automáticamente la calidad de imagen", "Reducir el consumo eléctrico de los equipos", "Sustituir el manual técnico del equipo", "Su identificación rápida ante una incidencia o desconexión"], 3, "Un cableado bien identificado agiliza la resolución de incidencias técnicas durante el uso de equipos audiovisuales."],
[21, "La previsión de sistemas de traducción simultánea en un acto con asistentes de distintos idiomas requiere:", ["Limitar el acto a un único idioma en todo caso", "Ninguna previsión especial, al resolverse sobre la marcha", "Prescindir de cualquier equipo técnico adicional", "Una planificación técnica previa (cabinas, receptores) según el formato del acto"], 3, "La traducción simultánea exige una planificación técnica específica (cabinas, receptores, técnicos) que debe preverse con antelación."],
[21, "El uso de mamparas o separadores móviles en la organización de un espacio para una reunión permite:", ["Adaptar la configuración del espacio según las necesidades de cada acto", "Eliminar la necesidad de comprobar la accesibilidad de la sala", "Reducir el aforo máximo permitido de forma permanente", "Sustituir la necesidad de mobiliario en la sala"], 0, "Los elementos móviles de separación aportan flexibilidad para adaptar un mismo espacio a distintos tipos de actos o reuniones."],
[22, "Ante un atasco de papel en una fotocopiadora, la actuación correcta es:", ["Verter líquidos limpiadores directamente sobre el mecanismo", "Desconectar la máquina de la corriente sin retirar antes el papel atascado si el fabricante lo desaconseja", "Forzar la apertura de cualquier parte de la máquina sin consultar indicaciones", "Seguir las indicaciones del propio equipo o manual para retirar el papel sin forzar los mecanismos"], 3, "Seguir las indicaciones del equipo evita dañar los mecanismos internos al retirar el papel atascado."],
[22, "Las máquinas destructoras de documentos se utilizan principalmente para:", ["Plastificar tarjetas y documentos", "Eliminar de forma segura documentación con información sensible o confidencial", "Fotocopiar documentos a doble cara", "Encuadernar documentos"], 1, "Garantizan la destrucción segura de documentos, evitando que la información pueda ser reconstruida o leída."],
[22, "Al utilizar una guillotina de oficina para cortar papel, una norma de seguridad básica es:", ["Cortar el papel sujetándolo con los dedos cerca de la cuchilla para mayor precisión", "Retirar la protección de seguridad si dificulta la tarea", "Mantener las manos alejadas de la cuchilla y usar la protección o pisador previsto", "Usarla sin comprobar que la cuchilla esté bien fijada"], 2, "Mantener las manos alejadas de la zona de corte y usar los elementos de protección previstos evita cortes y accidentes."],
[22, "El plastificado de documentos tiene como finalidad principal:", ["Reducir el tamaño del documento", "Proteger el documento frente al desgaste, la humedad y la suciedad", "Sustituir la fotocopia del documento", "Eliminar la necesidad de archivarlo"], 1, "El plastificado añade una capa protectora que alarga la vida útil de documentos de uso frecuente o expuestos a deterioro."],
[22, "Al utilizar una taladradora de oficina para perforar documentos que se archivarán en carpetas de anillas, es importante:", ["Alinear correctamente el papel para que las perforaciones coincidan con el sistema de anillas", "Perforar el papel en cualquier posición sin comprobar la alineación", "Perforar siempre el centro exacto del documento independientemente del formato", "Evitar el uso de la guía de alineación si el equipo la incorpora"], 0, "Una correcta alineación evita que el documento quede mal encajado o dañado al archivarlo en la carpeta."],
[22, "El escaneado de documentos en la oficina permite, entre otros usos:", ["Eliminar automáticamente el documento físico escaneado", "Sustituir siempre la validez legal del documento original en papel", "Obtener una versión digital del documento para su archivo o envío electrónico", "Evitar cualquier necesidad de organización de archivos digitales"], 2, "El escaneo digitaliza el documento para facilitar su gestión, archivo o envío, sin que ello implique necesariamente la eliminación del original."],
[22, "La encuadernación de documentos mediante canutillo o espiral es habitual para:", ["Sustituir el archivo electrónico de un expediente", "Documentos que se van a destruir inmediatamente", "Documentos de varias páginas que se consultan con frecuencia y requieren apertura completa", "Documentos de una sola página"], 2, "Este tipo de encuadernación facilita la consulta cómoda de documentos extensos, permitiendo que el documento se abra completamente plano."],
[22, "El mantenimiento básico de una fotocopiadora, como la limpieza periódica de los cristales de escaneado, tiene como finalidad:", ["Aumentar la velocidad máxima de impresión del equipo", "Sustituir la necesidad de revisión técnica especializada", "Evitar manchas o líneas defectuosas en las copias realizadas", "Reducir el consumo eléctrico del equipo"], 2, "Los cristales de escaneado sucios son una causa habitual de manchas o líneas en las copias, por lo que su limpieza periódica es una tarea básica de mantenimiento."],
[22, "Al elegir el gramaje del papel para una encuadernación con canutillo, conviene tener en cuenta:", ["La marca de la fotocopiadora utilizada", "El idioma del documento", "El número de páginas y el uso previsto del documento", "Únicamente el color del papel"], 2, "El gramaje adecuado facilita una encuadernación resistente y proporcional al volumen de páginas del documento."],
[22, "Ante un documento confidencial que ya no es necesario conservar, la actuación adecuada es:", ["Dejarlo en la papelera común sin ninguna precaución", "Regalarlo como papel de borrador a cualquier persona", "Destruirlo mediante la máquina destructora de documentos", "Depositarlo en el contenedor de papel ordinario"], 2, "La destrucción mediante máquina destructora garantiza que la información confidencial no pueda ser reconstruida ni leída por terceros."],
[22, "El uso de una plastificadora requiere, entre otras precauciones:", ["Prescindir de cualquier tiempo de calentamiento del equipo", "Introducir cualquier material sin ninguna comprobación previa", "Utilizar siempre la temperatura máxima disponible", "Comprobar la temperatura adecuada según el grosor del material a plastificar"], 3, "Una temperatura inadecuada puede dañar el documento o no sellar correctamente la funda plastificadora."],
[22, "Al preparar un envío masivo de correspondencia con múltiples copias idénticas, una tarea auxiliar habitual es:", ["El fotocopiado o impresión en serie del documento base", "La destrucción del documento original tras la primera copia", "La eliminación de cualquier control de calidad de las copias", "El escaneado individual de cada copia enviada"], 0, "La reproducción en serie es la forma habitual de preparar múltiples copias idénticas para un envío masivo de correspondencia."],
[22, "El correcto etiquetado de carpetas y archivadores en una oficina facilita:", ["Sustituir la necesidad de un sistema de archivo", "Reducir el espacio de almacenamiento necesario", "La localización rápida de la documentación archivada", "Eliminar la necesidad de índices o inventarios"], 2, "Un etiquetado claro y sistemático es clave para la localización eficiente de documentos en el archivo de oficina."],
[22, "Al recibir un atasco de grapas en una grapadora eléctrica, la actuación recomendada es:", ["Desconectar el equipo antes de intentar retirar el atasco", "Intentar resolver el atasco con el equipo aún conectado a la corriente", "Ignorar el atasco y continuar usando la máquina igualmente", "Forzar el mecanismo sin desconectar la máquina"], 0, "Desconectar el equipo antes de manipular un atasco es una medida básica de seguridad frente a movimientos accidentales del mecanismo."],
[22, "El escaneado de documentos con reconocimiento óptico de caracteres (OCR) permite:", ["Imprimir automáticamente el documento escaneado", "Eliminar la necesidad de archivo del documento original", "Convertir el texto de una imagen escaneada en texto editable y buscable", "Sustituir completamente la firma electrónica"], 2, "El OCR reconoce los caracteres de una imagen escaneada, permitiendo convertirlos en texto digital editable y buscable."],
[22, "Ante un volumen elevado de fotocopiado con múltiples departamentos solicitantes, es recomendable:", ["Atender las solicitudes de forma desordenada sin ningún criterio", "Duplicar cada solicitud sin verificar la necesidad real", "Rechazar sistemáticamente las solicitudes urgentes", "Establecer un orden de prioridad o turno claro para gestionar las solicitudes"], 3, "Organizar las solicitudes con un criterio claro de prioridad mejora la eficiencia y evita conflictos entre departamentos."],
[22, "El consumo de tóner o tinta de una impresora debe revisarse periódicamente para:", ["Aumentar automáticamente la velocidad de impresión", "Reducir la calidad de impresión de forma intencionada", "Sustituir la necesidad de mantenimiento del equipo", "Evitar interrupciones en la impresión de documentos urgentes"], 3, "Anticipar el agotamiento del consumible evita retrasos e interrupciones en tareas de impresión urgentes."],
[22, "Al organizar el archivo de documentos administrativos por orden cronológico, el criterio habitual es:", ["Ordenar por el color del documento", "Ordenar los documentos según su fecha de creación o recepción", "Ordenar de forma aleatoria sin ningún criterio", "Ordenar únicamente por el nombre del remitente"], 1, "El orden cronológico, basado en la fecha, es uno de los criterios de clasificación documental más habituales en archivos de oficina."],
[22, "Ante un mal funcionamiento recurrente de un equipo de oficina (fotocopiadora, destructora, etc.), la actuación adecuada es:", ["Ignorar el problema mientras el equipo siga funcionando parcialmente", "Intentar repararlo sin la formación técnica adecuada", "Sustituir el equipo sin dar parte de la incidencia", "Comunicarlo al servicio de mantenimiento o proveedor correspondiente"], 3, "Comunicar la incidencia al servicio técnico adecuado evita agravar el problema y garantiza una reparación correcta."],
[22, "El papel reciclado, frente al papel estándar, se caracteriza por:", ["Tener siempre mayor gramaje", "Estar fabricado a partir de fibras de papel recuperado", "Ser exclusivo para impresión a color", "No poder utilizarse en fotocopiadoras convencionales"], 1, "El papel reciclado se elabora reutilizando fibras de papel ya utilizado, siendo compatible con la mayoría de equipos de oficina."],
[22, "Al archivar documentos duplicados innecesarios, una buena práctica de gestión documental es:", ["Conservar todas las copias indefinidamente sin ningún criterio", "Eliminar las copias no necesarias conforme al procedimiento de gestión documental", "Destruir también el documento original sin necesidad", "Archivar cada copia en una ubicación distinta sin relación entre ellas"], 1, "Evitar la acumulación de duplicados innecesarios facilita la organización y el uso eficiente del espacio de archivo."],
[22, "La numeración de páginas al encuadernar un documento extenso ayuda a:", ["Eliminar la necesidad de un índice", "Reducir el número total de páginas", "Detectar posibles errores de orden o páginas faltantes antes de finalizar la encuadernación", "Sustituir la portada del documento"], 2, "Revisar la numeración antes de encuadernar permite detectar a tiempo errores de orden o ausencias de páginas."],
[22, "La conservación de copias de seguridad de documentos digitalizados es importante para:", ["Eliminar la necesidad de organizar carpetas digitales", "Aumentar el tamaño de los archivos digitales", "Sustituir la necesidad de un sistema de archivo físico en todos los casos", "Prevenir la pérdida de información ante fallos técnicos o errores humanos"], 3, "Las copias de seguridad son una medida básica de prevención frente a la pérdida de información digital por fallos técnicos o errores."],
[23, "El acuse de recibo en un envío postal certificado tiene como finalidad:", ["Acelerar el reparto sin garantía de entrega", "Dejar constancia documental de que el destinatario ha recibido el envío", "Sustituir el franqueo del envío", "Reducir el coste del envío"], 1, "El acuse de recibo es el documento que certifica que el destinatario (o persona autorizada) ha recibido efectivamente el envío."],
[23, "Un envío certificado, frente a un envío ordinario, se caracteriza por:", ["No poder utilizarse nunca para documentos oficiales", "Quedar registrado, con constancia de su curso y entrega", "Ser siempre más lento y sin ningún control adicional", "Ser gratuito en todos los casos"], 1, "El envío certificado se registra y controla en cada fase de su curso, a diferencia del envío ordinario, que no deja este rastro documental."],
[23, "El reembolso en un envío postal es un servicio que permite:", ["Anular el envío antes de su curso", "Devolver automáticamente el envío al remitente sin entrega", "Enviar el paquete sin ningún coste asociado", "Cobrar al destinatario un importe en el momento de la entrega, que se remite después al remitente"], 3, "Es un servicio en el que el destinatario paga una cantidad al recibir el envío, cantidad que posteriormente se transfiere al remitente."],
[23, "Los telegramas, como servicio de correspondencia, se caracterizan por:", ["Ser exclusivamente de uso privado, nunca oficial", "No dejar ningún registro de su envío", "Ser un medio de comunicación escrita de carácter urgente y con acuse de recibo posible", "Sustituir completamente al correo electrónico en la Administración"], 2, "Aunque en desuso frente a medios electrónicos, el telegrama sigue siendo un medio formal de comunicación urgente con valor probatorio."],
[23, "El giro telegráfico o postal es un servicio que permite:", ["Sustituir el correo certificado", "Enviar dinero de una persona a otra a través del servicio postal", "Realizar transferencias bancarias internacionales", "Enviar exclusivamente documentos sin ningún valor económico"], 1, "Es un servicio postal que permite el envío de dinero, con distintas modalidades según la rapidez y el medio utilizado."],
[23, "La correcta cumplimentación de un envío de correspondencia oficial exige, entre otros datos:", ["Solo el nombre del destinatario, sin dirección", "Identificación clara del remitente y destinatario y la dirección completa y correcta", "El número de teléfono del remitente como dato obligatorio único", "Exclusivamente el código postal, sin más datos"], 1, "Una dirección incompleta o incorrecta es la causa más habitual de incidencias en la entrega de correspondencia."],
[23, "Un envío urgente, frente a uno ordinario, se caracteriza por:", ["Ser siempre gratuito", "Eliminar la necesidad de dirección del destinatario", "Ofrecer un plazo de entrega más rápido, con un coste generalmente mayor", "No tener ninguna diferencia de plazo"], 2, "El servicio urgente prioriza la rapidez de entrega frente al servicio ordinario, con un coste asociado mayor."],
[23, "Al recibir un paquete en las dependencias administrativas, una buena práctica antes de firmar la recepción es:", ["Firmar sin comprobar nada, en cualquier caso", "Abrir el paquete delante del transportista siempre, sin excepción", "Comprobar que el paquete no presenta daños visibles evidentes", "Rechazar todos los paquetes de forma sistemática"], 2, "Verificar el estado externo antes de firmar la recepción facilita, en su caso, dejar constancia de una incidencia visible."],
[23, "Al recibir un envío con reembolso a nombre de un organismo público, el importe a cobrar debe:", ["Poder modificarse a criterio del receptor", "No requerir ninguna comprobación previa", "Coincidir exactamente con el indicado en la documentación del envío", "Cobrarse siempre en una cantidad superior por precaución"], 2, "El importe del reembolso viene fijado por el remitente y debe respetarse tal como consta en la documentación del envío."],
[23, "La correspondencia dirigida a un departamento concreto de un organismo, al recibirse en la unidad de registro o conserjería, debe:", ["Destruirse si no se conoce el destinatario exacto", "Distribuirse internamente conforme al procedimiento establecido de reparto", "Devolverse automáticamente al remitente", "Abrirse siempre antes de su distribución interna"], 1, "El reparto interno conforme al procedimiento asegura que la correspondencia llegue al departamento o persona correcta."],
[23, "Un envío con acuse de recibo, a diferencia de uno sin él, permite al remitente:", ["Reducir el coste del envío", "Enviar el paquete de forma anónima", "Obtener constancia documental de que el destinatario lo ha recibido", "Evitar cualquier registro del envío"], 2, "El acuse de recibo aporta al remitente una prueba formal de que la entrega se ha producido efectivamente."],
[23, "Ante un envío postal dirigido erróneamente a una persona o departamento que ya no se encuentra en el organismo, la actuación adecuada es:", ["Abrirlo para conocer su contenido antes de decidir qué hacer", "Destruir el envío directamente", "Dejarlo indefinidamente sin resolver su destino", "Gestionar su devolución o reenvío conforme al procedimiento interno establecido"], 3, "Gestionar la devolución o el reenvío conforme al procedimiento evita la pérdida o el extravío de correspondencia mal dirigida."],
[23, "El franqueo de un envío postal se refiere a:", ["La firma del destinatario al recibir el envío", "El registro interno de entrada del organismo", "La clasificación del envío por su contenido", "El pago del servicio postal correspondiente al tipo y peso del envío"], 3, "El franqueo es el importe abonado por el servicio postal, calculado según el tipo de envío, su peso y destino."],
[23, "Un paquete que llega con el embalaje visiblemente dañado debe, como buena práctica:", ["Rechazarse siempre de forma automática", "Reflejarse esa incidencia antes de firmar su recepción", "Abrirse en presencia de terceros ajenos al organismo", "Aceptarse sin ninguna anotación ni comprobación"], 1, "Dejar constancia de la incidencia visible en el momento de la recepción facilita, en su caso, una reclamación posterior."],
[23, "El servicio de correspondencia interna dentro de un organismo con varios edificios o sedes tiene como finalidad:", ["Facilitar el traslado ordenado de documentación entre las distintas dependencias", "Sustituir el servicio postal externo en todos los casos", "Aplicarse únicamente a la correspondencia electrónica", "Eliminar la necesidad de registro de salida"], 0, "Permite gestionar de forma organizada el flujo de documentación entre las distintas sedes o dependencias de un mismo organismo."],
[23, "La clasificación de la correspondencia recibida según su urgencia o prioridad ayuda a:", ["Aumentar el volumen total de correspondencia recibida", "Sustituir la necesidad de un registro de entrada", "Gestionar de forma más eficiente su reparto y tramitación", "Reducir la necesidad de identificar al destinatario"], 2, "Clasificar por urgencia permite priorizar la distribución de aquella correspondencia que requiere una atención más inmediata."],
[23, "Un burofax, como servicio de envío urgente con acreditación de contenido, se utiliza habitualmente para:", ["Correspondencia interna dentro del mismo edificio", "Comunicaciones que requieren dejar constancia fehaciente de su contenido y envío", "Envíos sin ninguna relevancia jurídica", "Envíos de paquetería voluminosa"], 1, "El burofax certifica tanto el envío como el contenido del documento, siendo útil en comunicaciones con relevancia jurídica o administrativa."],
[23, "La correcta cumplimentación de la etiqueta de un envío urgente exige, entre otros datos:", ["El color del paquete", "La fecha de caducidad del contenido en todos los casos", "El peso y las señas completas del destinatario", "Únicamente el nombre del remitente"], 2, "Unas señas completas y el peso correcto son datos esenciales para evitar incidencias en el curso del envío."],
[23, "El servicio de correos con valor declarado se utiliza cuando:", ["El envío no tiene ningún valor especial", "Se quiere reducir el coste del envío al máximo", "El contenido del envío tiene un valor económico que se desea proteger ante pérdida o daño", "El destinatario reside en el extranjero exclusivamente"], 2, "El valor declarado permite una indemnización acorde al valor real del contenido en caso de pérdida, robo o daño durante el envío."],
[23, "La notificación administrativa por correo postal certificado con acuse de recibo tiene especial relevancia porque:", ["No tiene ninguna relevancia jurídica especial", "Elimina cualquier necesidad de conservar el justificante", "Sustituye siempre a la notificación electrónica obligatoria", "Permite acreditar la fecha en que el interesado recibió la notificación, relevante para el cómputo de plazos"], 3, "La fecha de recepción certificada es clave para determinar el inicio del cómputo de plazos administrativos, como el de un posible recurso."],
[23, "La correcta gestión de la paquetería recibida a título personal en el centro de trabajo, sin relación con la actividad administrativa, debe:", ["Tratarse siempre con la misma prioridad que la correspondencia oficial", "Abrirse por el personal de recepción sin autorización del destinatario", "Regirse por el criterio o protocolo interno establecido al respecto", "Rechazarse sistemáticamente sin ningún criterio"], 2, "Muchas organizaciones cuentan con criterios internos específicos para diferenciar la gestión de paquetería personal frente a la oficial."],
[24, "El almacenamiento de materiales pesados en estanterías debe realizarse, como norma general de seguridad:", ["En las baldas superiores, sin ninguna limitación de peso", "En las baldas inferiores, para mantener el centro de gravedad bajo", "Indistintamente en cualquier altura", "Solo en el suelo, sin usar estanterías"], 1, "Colocar los materiales más pesados en las baldas bajas reduce el riesgo de vuelco y facilita una manipulación más segura."],
[24, "El almacenamiento de materiales peligrosos (inflamables, corrosivos, etc.) exige, entre otras medidas:", ["Prescindir de cualquier ventilación en el espacio de almacenamiento", "Eliminar el etiquetado de los envases para ahorrar espacio", "Almacenar todos los productos juntos sin distinción", "Separar los productos incompatibles entre sí y señalizar adecuadamente la zona"], 3, "La separación de productos incompatibles y la señalización adecuada son medidas básicas de seguridad en el almacenamiento de sustancias peligrosas."],
[24, "Los colgadores y perchas en un almacén se utilizan principalmente para:", ["Almacenar líquidos a granel", "Materiales que requieren mantenerse suspendidos o extendidos, evitando pliegues o daños", "Almacenar materiales peligrosos exclusivamente", "Sustituir las estanterías en cualquier caso"], 1, "Permiten conservar en buen estado materiales que se dañarían si se apilaran o doblaran (por ejemplo, ciertos tejidos o prendas)."],
[24, "La correcta organización del espacio de almacenamiento debe tener en cuenta, entre otros factores:", ["Únicamente el orden alfabético del nombre del producto", "El color del embalaje exclusivamente", "La fecha de fabricación del estante", "La frecuencia de uso de cada material, situando lo más utilizado en zonas de fácil acceso"], 3, "Situar los materiales de uso frecuente en zonas accesibles optimiza el tiempo y el esfuerzo en las tareas de almacén."],
[24, "Las fichas de seguridad de un producto químico almacenado deben estar:", ["Guardadas bajo llave sin acceso del personal", "Disponibles y accesibles para el personal que manipula dicho producto", "Eliminadas una vez almacenado el producto", "Sustituidas por el etiquetado exclusivamente"], 1, "Las fichas de datos de seguridad informan sobre riesgos, manipulación y primeros auxilios ante un producto químico, y deben ser accesibles."],
[24, "El principio de rotación de materiales almacenados ('primero en entrar, primero en salir') tiene como finalidad:", ["Eliminar la necesidad de control de existencias", "Evitar el deterioro o caducidad de materiales que llevan más tiempo almacenados", "Reducir el número de estanterías necesarias", "Aumentar el volumen total del almacén"], 1, "Esta práctica (conocida como FIFO) evita que materiales con fecha de caducidad o deterioro queden olvidados en el fondo del almacén."],
[24, "El etiquetado de las estanterías de un almacén, indicando el tipo de material almacenado en cada ubicación, tiene como finalidad:", ["Reducir la necesidad de ventilación del almacén", "Aumentar el peso máximo permitido en cada balda", "Sustituir el control de existencias", "Facilitar la localización rápida y ordenada de los materiales"], 3, "Un etiquetado claro de las ubicaciones agiliza tanto la búsqueda como la reposición de materiales en el almacén."],
[24, "Los pasillos de circulación dentro de un almacén deben mantenerse:", ["Cerrados salvo autorización expresa", "Libres de obstáculos para permitir un tránsito seguro", "Reducidos al mínimo posible independientemente del uso", "Ocupados con material de uso poco frecuente"], 1, "Mantener los pasillos despejados es esencial para la seguridad y eficiencia en el tránsito de personas y materiales dentro del almacén."],
[24, "La capacidad máxima de carga de una estantería debe:", ["Respetarse conforme a las especificaciones técnicas del fabricante", "Reducirse siempre a la mitad de la indicada", "Ignorarse si los materiales parecen ligeros", "Ampliarse a criterio del propio personal si el material lo permite"], 0, "Superar la capacidad de carga indicada por el fabricante puede provocar el colapso de la estructura, con el consiguiente riesgo para las personas y materiales."],
[24, "El almacenamiento conjunto de productos oxidantes y combustibles debe evitarse porque:", ["Puede aumentar significativamente el riesgo de incendio o explosión", "No existe ningún riesgo asociado a esa combinación", "Es una práctica recomendada por la normativa de seguridad", "Mejora la organización del espacio de almacenamiento"], 0, "Los productos oxidantes favorecen la combustión, por lo que su cercanía con materiales combustibles incrementa notablemente el riesgo de incendio."],
[24, "La ventilación adecuada de una zona de almacenamiento de productos químicos es importante para:", ["Aumentar la temperatura ambiente de la zona", "Sustituir el uso de equipos de protección individual", "Reducir la necesidad de etiquetado de los productos", "Evitar la acumulación de vapores potencialmente peligrosos"], 3, "Una ventilación adecuada reduce la concentración de vapores que puedan resultar tóxicos, inflamables o irritantes."],
[24, "El uso de pictogramas normalizados en el etiquetado de sustancias peligrosas tiene como finalidad:", ["Indicar exclusivamente el precio del producto", "Sustituir la ficha de datos de seguridad en todos los casos", "Identificar de forma rápida y universal el tipo de peligro que presenta el producto", "Decorar el envase del producto"], 2, "Los pictogramas normalizados permiten una identificación visual rápida del riesgo, independientemente del idioma del envase."],
[24, "Al recibir un nuevo lote de material en el almacén, antes de ubicarlo es recomendable:", ["Destruir el embalaje antes de cualquier verificación", "Ubicarlo inmediatamente sin ninguna comprobación", "Mezclarlo con material de lotes anteriores sin distinción", "Comprobar que corresponde al pedido y que no presenta daños visibles"], 3, "Verificar la correspondencia con el pedido y el estado del material evita errores de almacenamiento y facilita detectar incidencias del transporte."],
[24, "El uso de estanterías compactas o móviles en un almacén tiene como principal ventaja:", ["Aumentar el riesgo de accidentes de forma significativa", "Reducir la capacidad de almacenamiento respecto a estanterías fijas", "Optimizar el espacio disponible al reducir el número de pasillos fijos", "Eliminar la necesidad de etiquetado"], 2, "Las estanterías móviles permiten aprovechar mejor el espacio, ya que solo se abre un pasillo cuando se necesita acceder a una fila concreta."],
[24, "El uso de bandejas apilables en un almacén de oficina facilita:", ["Eliminar la necesidad de etiquetado", "Aumentar el peso máximo permitido por unidad de superficie", "Optimizar el espacio vertical disponible de forma ordenada", "Sustituir la necesidad de estanterías"], 2, "Las bandejas apilables permiten aprovechar el espacio en altura manteniendo el material organizado y accesible."],
[24, "Antes de almacenar un producto químico nuevo, es recomendable consultar:", ["La marca del fabricante exclusivamente", "El color de su envase", "Su ficha de datos de seguridad para conocer sus condiciones de almacenamiento", "Únicamente su precio de adquisición"], 2, "La ficha de datos de seguridad indica las condiciones adecuadas de almacenamiento y las incompatibilidades a evitar."],
[24, "El almacenamiento de líquidos en garrafas o bidones debe realizarse, como norma general:", ["Directamente sobre el suelo sin ninguna base ni sujeción", "Apilados sin límite de altura", "Sobre superficies estables y con sistemas de contención ante posibles derrames", "Junto a fuentes de calor sin ninguna distancia de seguridad"], 2, "Una base estable y sistemas de contención (cubetos) reducen el riesgo de vertidos y sus consecuencias si se produce un derrame."],
[24, "La rotulación de 'prohibido fumar' en una zona de almacenamiento de materiales inflamables tiene como finalidad:", ["Sustituir la ficha de seguridad del producto", "Prevenir un foco de ignición evidente en una zona de riesgo", "Indicar el horario de trabajo del personal", "Decorar la zona de almacenamiento"], 1, "Es una señalización de seguridad que informa de una prohibición directamente relacionada con la prevención de incendios en zonas de riesgo."],
[24, "El uso de contenedores homologados para residuos peligrosos almacenados temporalmente es obligatorio porque:", ["Solo aplica a residuos de gran volumen", "Sustituye la necesidad de etiquetado", "Es una recomendación sin ningún carácter obligatorio", "Garantiza una contención adecuada y facilita su gestión posterior por un gestor autorizado"], 3, "Los contenedores homologados garantizan la contención y trazabilidad adecuadas de los residuos peligrosos hasta su retirada por un gestor autorizado."],
[25, "Una ficha de control de existencias recoge habitualmente, entre otros datos:", ["Únicamente el nombre del proveedor", "La ubicación geográfica del edificio", "Las entradas, salidas y el saldo o stock disponible de un material", "El horario laboral del almacén"], 2, "Permite llevar un seguimiento actualizado de las cantidades disponibles de cada material a lo largo del tiempo."],
[25, "El albarán de entrega, en el control de existencias, es el documento que:", ["Se utiliza exclusivamente para material peligroso", "Es opcional y no aporta ningún control documental", "Acompaña a la mercancía y detalla los artículos entregados, sin efectos fiscales de factura", "Sustituye siempre a la factura para efectos fiscales"], 2, "El albarán certifica la entrega física de la mercancía; la factura, si procede, es un documento distinto de efectos fiscales."],
[25, "El inventario periódico de existencias tiene como finalidad principal:", ["Comprobar que el stock físico coincide con los registros documentales", "Sustituir el registro de entrada y salida diario", "Reducir automáticamente el precio de los materiales", "Eliminar la necesidad de fichas de control"], 0, "El inventario permite detectar diferencias entre lo registrado y lo realmente disponible, corrigiendo posibles errores o pérdidas."],
[25, "El stock de seguridad de un material es:", ["El material que se considera obsoleto", "La cantidad máxima permitida legalmente", "El material pendiente de devolución al proveedor", "La cantidad mínima que se mantiene en almacén para evitar rupturas de suministro"], 3, "Es un colchón de existencias mínimo que evita quedarse sin material ante retrasos de suministro o picos de demanda."],
[25, "El registro de salidas de material debe reflejar, entre otros datos:", ["Únicamente la firma del almacenista", "La cantidad, fecha y destino o solicitante del material entregado", "El precio de compra original del material", "La marca del vehículo de transporte utilizado"], 1, "Estos datos permiten trazar el uso del material y mantener actualizado el control de existencias."],
[25, "El control de existencias mediante código de barras o etiquetas identificativas facilita:", ["Sustituir completamente el inventario físico periódico", "Un seguimiento más ágil y preciso de las entradas y salidas de material", "Eliminar la necesidad de cualquier registro documental", "Aumentar el precio de los materiales almacenados"], 1, "El uso de códigos identificativos agiliza el registro de movimientos y reduce errores respecto al control manual."],
[25, "La diferencia entre el stock teórico (registrado) y el stock físico (real) de un almacén se denomina habitualmente:", ["Rotura de stock", "Descuadre o desviación de inventario", "Punto de pedido", "Stock de seguridad"], 1, "Cuando lo registrado documentalmente no coincide con lo que físicamente hay en el almacén, se produce un descuadre que conviene investigar y corregir."],
[25, "El punto de pedido de un material es:", ["El nivel de existencias a partir del cual conviene realizar un nuevo pedido", "La fecha de caducidad del producto", "La cantidad máxima que puede almacenarse", "El precio mínimo de venta del material"], 0, "Marca el nivel de stock que activa la necesidad de reponer el material antes de que se agote."],
[25, "Una ficha de material bien cumplimentada debe permitir conocer, en cualquier momento:", ["La cantidad disponible y el histórico de movimientos de ese material", "Únicamente el nombre del proveedor habitual", "La ubicación exacta de la sede central del organismo", "El precio de venta al público"], 0, "Una ficha de material actualizada es una herramienta de control que refleja la situación y el histórico de un material concreto."],
[25, "Ante una rotura de stock (falta de existencias) de un material esencial, la actuación recomendada es:", ["Ignorar la situación hasta la siguiente revisión periódica", "Informar a quien corresponda para gestionar una reposición urgente", "Reducir el registro de salidas para disimular la falta de stock", "Sustituir el material sin ninguna comunicación"], 1, "Comunicar la rotura de stock permite activar cuanto antes el proceso de reposición y minimizar el impacto en el servicio."],
[25, "La revisión periódica de las fechas de caducidad de los materiales almacenados es especialmente relevante en:", ["Mobiliario de oficina de uso duradero", "Productos químicos, sanitarios o de consumo con vida útil limitada", "Materiales metálicos sin ninguna caducidad", "Documentación archivada permanentemente"], 1, "Los productos con vida útil limitada requieren un seguimiento específico de caducidad para evitar su uso indebido una vez vencidos."],
[25, "El sistema de gestión de almacén conocido como ABC clasifica los materiales según:", ["Su importancia o valor relativo dentro del conjunto de existencias", "Su color de embalaje", "El idioma de su etiquetado", "Su fecha de fabricación exclusivamente"], 0, "El análisis ABC prioriza el control según el valor o relevancia de cada material, dedicando más atención a los de mayor impacto."],
[25, "Una salida de material sin la documentación correspondiente puede provocar:", ["Descuadres en el control de existencias difíciles de justificar posteriormente", "Ningún efecto relevante en la gestión del almacén", "La reducción automática del stock de seguridad", "Una mejora automática del control de inventario"], 0, "Toda salida debe quedar documentada para mantener la trazabilidad y evitar descuadres entre el registro y las existencias reales."],
[25, "El código de referencia interno de un material en el control de existencias sirve para:", ["Determinar su ubicación exacta sin necesidad de etiquetado físico", "Sustituir su denominación comercial en cualquier documento externo", "Fijar su precio de venta", "Identificarlo de forma unívoca dentro del sistema de gestión del almacén"], 3, "Un código de referencia único facilita la identificación y gestión del material dentro del sistema interno, evitando confusiones con productos similares."],
[25, "Ante una discrepancia detectada entre el inventario físico y el registrado, la actuación adecuada es:", ["Eliminar el material del registro sin más trámite", "Modificar el inventario físico para que coincida con el registro sin comprobar nada", "Investigar la causa y regularizar el registro conforme al procedimiento establecido", "Ignorar la diferencia si es de poca cuantía"], 2, "Investigar la causa antes de regularizar evita que errores o pérdidas se repitan sin ser detectados."],
