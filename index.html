<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Agrupación Profesional Personal de Apoyo - IVAP</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1b2430">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --ink:#1b2430; --paper:#f7f5f0; --card:#ffffff; --line:#dcd6c8;
    --green:#2f5d4f; --green-dark:#1f3f36; --red:#8a2b2b; --gold:#a3742b; --muted:#6b6459;
    --shadow: 0 1px 2px rgba(27,36,48,.06), 0 6px 20px rgba(27,36,48,.06);
  }
  body.dark{
    --ink:#eae5da; --paper:#171b1f; --card:#20262c; --line:#3d464c;
    --green:#5fae95; --green-dark:#8fd3bd; --red:#e08787; --gold:#d9ac5f; --muted:#a9ada6;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
  }
  html.fs-sm{font-size:15px;}
  html.fs-md{font-size:16px;}
  html.fs-lg{font-size:18.5px;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;-webkit-font-smoothing:antialiased;transition:background .2s,color .2s;}
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 60px;}
  header.app{display:flex;align-items:baseline;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:22px;gap:10px;}
  header.app h1{font-size:1.3rem;letter-spacing:.02em;margin:0;font-weight:700;}
  header.app .tag{font-family:ui-monospace,Menlo,monospace;font-size:.72rem;color:var(--muted);letter-spacing:.06em;white-space:nowrap;}
  .headerRight{display:flex;align-items:center;gap:10px;}
  .iconBtn{border:1px solid var(--line);background:var(--card);border-radius:50%;width:32px;height:32px;cursor:pointer;font-size:.95rem;line-height:1;color:var(--ink);}
  .card{background:var(--card);border:1px solid var(--line);border-radius:4px;box-shadow:var(--shadow);padding:22px;margin-bottom:18px;}
  h2.section{font-size:.78rem;text-transform:uppercase;letter-spacing:.12em;color:var(--gold);margin:0 0 14px;font-family:ui-monospace,Menlo,monospace;border-bottom:1px solid var(--line);padding-bottom:8px;}
  .btn{font-family:ui-monospace,Menlo,monospace;font-size:.85rem;letter-spacing:.03em;border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:11px 18px;border-radius:2px;cursor:pointer;}
  .btn.secondary{background:transparent;color:var(--ink);}
  .btn.wide{width:100%;}
  .btn:disabled{opacity:.4;cursor:default;}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .num-input,select.field{width:100px;padding:9px;font-family:ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:2px;font-size:.9rem;background:var(--card);color:var(--ink);}
  input[type="text"].field{width:100%;padding:12px;border:1px solid var(--line);border-radius:2px;font-size:1rem;background:var(--card);color:var(--ink);box-sizing:border-box;}
  select.field{width:auto;}
  .tema-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:.86rem;max-height:300px;overflow-y:auto;padding-right:4px;}
  @media (max-width:560px){.tema-grid{grid-template-columns:1fr;}}
  .tema-item{display:flex;align-items:flex-start;gap:8px;line-height:1.3;padding:4px 0;border-bottom:1px dashed var(--line);}
  .tema-item input{margin-top:4px;flex-shrink:0;}
  .tema-actions{display:flex;gap:14px;margin:10px 0 14px;font-size:.8rem;}
  .tema-actions a,.link-btn{color:var(--green);cursor:pointer;text-decoration:underline;background:none;border:none;font-size:.85rem;padding:0;font-family:inherit;}
  .progress-bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:16px;}
  .progress-fill{height:100%;background:var(--green);transition:width .25s ease;}
  .qmeta{font-family:ui-monospace,Menlo,monospace;font-size:.72rem;color:var(--muted);letter-spacing:.05em;margin-bottom:10px;text-transform:uppercase;display:flex;justify-content:space-between;}
  .qtext{font-size:1.12rem;line-height:1.5;margin:0 0 20px;}
  .option{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:3px;padding:13px 14px;margin-bottom:10px;cursor:pointer;font-size:.98rem;line-height:1.4;background:var(--card);transition:border-color .15s,background .15s;}
  .option:hover{border-color:var(--green);}
  .option .letter{font-family:ui-monospace,Menlo,monospace;font-weight:700;color:var(--gold);flex-shrink:0;}
  .option.correct{border-color:var(--green);background:rgba(47,93,79,.12);}
  .option.correct .letter{color:var(--green);}
  .option.wrong{border-color:var(--red);background:rgba(138,43,43,.12);}
  .option.wrong .letter{color:var(--red);}
  .option.disabled{cursor:default;}
  .option.selected{border-color:var(--gold);background:rgba(163,116,43,.12);}
  .flagBtn{border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:.72rem;padding:3px 8px;border-radius:10px;cursor:pointer;font-family:ui-monospace,Menlo,monospace;white-space:nowrap;}
  .flagBtn.active{border-color:var(--gold);color:var(--gold);background:rgba(163,116,43,.12);}
  .feedback{margin-top:6px;padding:12px 14px;border-radius:3px;font-size:.88rem;line-height:1.5;}
  .feedback.ok{background:rgba(47,93,79,.12);border:1px solid var(--green);color:var(--green-dark);}
  .feedback.no{background:rgba(138,43,43,.12);border:1px solid var(--red);color:var(--red);}
  .footer-nav{display:flex;justify-content:space-between;align-items:center;margin-top:18px;}
  .score-big{font-size:2.6rem;font-weight:700;font-family:ui-monospace,Menlo,monospace;}
  .tema-result{display:flex;justify-content:space-between;font-size:.85rem;padding:7px 0;border-bottom:1px dashed var(--line);}
  .badge{font-family:ui-monospace,Menlo,monospace;font-size:.72rem;padding:2px 7px;border-radius:10px;background:var(--line);color:var(--ink);}
  textarea{width:100%;min-height:140px;font-family:ui-monospace,Menlo,monospace;font-size:.82rem;border:1px solid var(--line);border-radius:3px;padding:10px;background:var(--card);color:var(--ink);}
  .small{font-size:.82rem;color:var(--muted);line-height:1.5;}
  .flag{display:inline-block;width:14px;height:14px;border-radius:50%;background:conic-gradient(from 0deg,#d52b1e 0 25%,#eab308 25% 40%,#2f5d4f 40% 100%);margin-right:8px;vertical-align:-2px;}
  .radioRow{display:flex;gap:16px;font-size:.88rem;margin:6px 0;flex-wrap:wrap;}
  .radioRow label{display:flex;gap:6px;align-items:center;cursor:pointer;}
  .statBar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;flex:1;margin:0 10px;}
  .statBar > div{height:100%;background:var(--green);}
  .statRow{display:flex;align-items:center;font-size:.82rem;padding:8px 0;border-bottom:1px dashed var(--line);}
  .statRow .name{width:160px;flex-shrink:0;}
  .statRow .pct{width:44px;text-align:right;font-family:ui-monospace,Menlo,monospace;flex-shrink:0;}
  .timerBox{font-family:ui-monospace,Menlo,monospace;font-weight:700;font-size:.95rem;padding:4px 10px;border:1px solid var(--line);border-radius:3px;}
  .timerBox.low{color:var(--red);border-color:var(--red);}

  /* Splash screen */
  .splash{
    position:fixed; inset:0; z-index:50;
    display:flex; flex-direction:column; justify-content:center; align-items:center;
    background: radial-gradient(ellipse at 50% 30%, rgba(163,116,43,.10), transparent 60%), var(--paper);
    cursor:pointer; text-align:center; padding:24px;
  }
  .splash-flag{width:34px;height:34px;border-radius:50%;background:conic-gradient(from 0deg,#d52b1e 0 25%,#eab308 25% 40%,#2f5d4f 40% 100%);margin-bottom:26px;box-shadow:0 4px 18px rgba(0,0,0,.15);}
  .splash-logo{max-width:min(420px,80vw);width:100%;height:auto;margin-bottom:30px;}
  .splash-title{
    font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;
    font-weight:700; letter-spacing:.02em; color:var(--ink);
    font-size:clamp(2.4rem, 9vw, 4.2rem); line-height:1.05; margin:0;
  }
  .splash-subtitle{
    font-family: ui-monospace, Menlo, monospace;
    text-transform:uppercase; letter-spacing:.22em; color:var(--gold);
    font-size:clamp(.9rem, 3vw, 1.15rem); margin:18px 0 0;
  }
  .splash-rule{width:64px;height:2px;background:var(--ink);margin:26px 0;opacity:.5;}
  .splash-hint{font-family:ui-monospace,Menlo,monospace;font-size:.72rem;color:var(--muted);letter-spacing:.08em;margin-top:40px;animation:splashPulse 2s ease-in-out infinite;}
  @keyframes splashPulse{0%,100%{opacity:.4;}50%{opacity:1;}}
  .splash-credit{
    position:fixed; bottom:22px; right:26px; z-index:51;
    font-family:ui-monospace,Menlo,monospace; letter-spacing:.05em;
    font-size:.8rem; color:var(--ink); opacity:.75;
    padding:6px 12px; border:1px solid var(--line); border-radius:3px; background:var(--card);
  }
  .splash-version{
    position:fixed; bottom:60px; right:26px; z-index:51;
    font-family:ui-monospace,Menlo,monospace; letter-spacing:.05em;
    font-size:.72rem; color:var(--gold); opacity:.9;
    padding:4px 12px; border:1px solid var(--line); border-radius:3px; background:var(--card);
  }
</style>
</head>

<div class="wrap" id="app"></div>

[11, "La evaluación de riesgos laborales debe:", ["Actualizarse cuando cambien las condiciones de trabajo", "Excluir los riesgos psicosociales", "Realizarse una única vez al inicio de la actividad sin revisión", "Ser opcional para el empresario"], 0, "La evaluación de riesgos debe actualizarse siempre que cambien las condiciones de trabajo que puedan afectar a la salud de los trabajadores."],
[11, "La formación en materia preventiva del personal trabajador debe ser:", ["Opcional y sin coste para el trabajador", "Impartida al ingreso, sin actualización posterior", "Centrada en el aspecto teórico, sin componente práctico", "Teórica y práctica, suficiente y adecuada, centrada en el puesto de trabajo"], 3, "La formación preventiva debe ser teórica y práctica, suficiente y adecuada, centrada específicamente en el puesto de trabajo."],
[11, "La vigilancia de la salud de los trabajadores debe ser:", ["Obligatoria en todos los casos, sin posibilidad de rechazo por parte del trabajador", "Realizada a petición del sindicato, con carácter previo a su ejecución", "Específica en función de los riesgos del puesto y, con carácter general, voluntaria para el trabajador salvo excepciones legales", "Inexistente en el ámbito de la función pública y sus organismos"], 2, "La vigilancia de la salud debe adaptarse a los riesgos del puesto y, con carácter general, es voluntaria para el trabajador salvo excepciones legales."],
[11, "La coordinación de actividades empresariales en materia preventiva es exigible, entre otros supuestos, cuando:", ["Se trata de obras de construcción, sin extenderse a otros sectores", "Concurren trabajadores de varias empresas en un mismo centro de trabajo", "Existe una única empresa en el centro de trabajo", "Se trata de una Administración Pública, al no resultarle exigible"], 1, "La coordinación de actividades empresariales es exigible cuando concurren trabajadores de varias empresas en un mismo centro de trabajo."],
[11, "El derecho de los trabajadores a la protección frente a los riesgos laborales implica un correlativo:", ["Un deber que recae en el propio trabajador, sin intervención empresarial", "Un deber que corresponde de forma principal a la Inspección de Trabajo", "Deber del empresario de protección eficaz", "Deber compartido con terceros ajenos a la relación laboral"], 2, "El derecho de los trabajadores a la protección frente a riesgos laborales implica el correlativo deber empresarial de una protección eficaz."],
[11, "El Plan de Prevención de Riesgos Laborales es el instrumento a través del cual se:", ["Debe aprobarse antes que la evaluación de riesgos", "Integra la actividad preventiva en el sistema general de gestión de la empresa", "Fija el calendario laboral de la plantilla", "Regula el régimen retributivo del personal"], 1, "El Plan de Prevención es el instrumento que integra la actividad preventiva en el sistema general de gestión de la empresa."],
[11, "La evaluación de riesgos laborales debe realizarse:", ["Si lo solicita expresamente el trabajador", "Cada diez años, con independencia de los cambios en el puesto", "Una única vez, sin necesidad de revisión posterior", "Con carácter inicial y actualizarse cuando cambien las condiciones de trabajo"], 3, "La evaluación de riesgos debe realizarse inicialmente y actualizarse cuando cambien las condiciones de trabajo."],
[11, "La formación en materia preventiva debe ser, entre otras características:", ["Impartida al personal directivo", "Adecuada al puesto de trabajo y adaptada a la evolución de los riesgos", "Idéntica para todos los puestos, sin diferenciación alguna", "Opcional para el trabajador, sin obligación empresarial"], 1, "La formación preventiva debe ser adecuada al puesto de trabajo y adaptarse a la evolución de los riesgos existentes."],
[11, "Los Servicios de Prevención pueden ser, entre otras modalidades:", ["Propios, mancomunados o ajenos", "Inexistentes en el ámbito de la Administración Pública", "Ajenos en todo caso, sin otra modalidad posible", "Propios en todo caso, sin otra modalidad posible"], 0, "Los servicios de prevención pueden organizarse, entre otras modalidades, como propios, mancomunados o ajenos."],
[11, "Los Delegados de Prevención son representantes de los trabajadores con funciones específicas en materia de:", ["Prevención de riesgos laborales", "Selección de personal", "Régimen disciplinario", "Negociación salarial exclusiva"], 0, "Los Delegados de Prevención son representantes de los trabajadores con funciones específicas en materia de prevención de riesgos laborales."],
[11, "El Comité de Seguridad y Salud es un órgano de participación:", ["De carácter judicial, con funciones sancionadoras", "Paritario entre la Administración y los trabajadores", "Formado por representantes de los trabajadores", "Formado por representantes de la Administración"], 1, "El Comité de Seguridad y Salud es un órgano paritario de participación entre la empresa u organismo y los trabajadores."],
[11, "La Ley 31/1995, de 8 de noviembre, de Prevención de Riesgos Laborales, tiene como principio básico:", ["Fijar el salario mínimo interprofesional", "Regular las relaciones laborales colectivas", "Garantizar la seguridad y la salud de los trabajadores en el desempeño de su trabajo", "Regular el régimen de la Seguridad Social"], 2, "Es la norma marco estatal en materia de prevención de riesgos laborales, aplicable tanto al sector privado como a las Administraciones Públicas."],
[11, "Conforme a la Ley 31/1995, la evaluación de riesgos laborales debe realizarse:", ["Una única vez, al iniciar la actividad, sin necesidad de actualización", "Si la empresa tiene 10 o más empleados, con carácter general", "Si lo solicita expresamente el trabajador", "Inicialmente y actualizarse cuando cambien las condiciones de trabajo"], 3, "La evaluación inicial de riesgos debe revisarse cuando cambien las condiciones de trabajo o se detecten daños a la salud."],
[11, "Los delegados de prevención, conforme a la Ley 31/1995, son:", ["Miembros del comité de empresa sin funciones específicas", "Inspectores de trabajo destinados en la empresa", "Cargos de libre designación de la empresa", "Los representantes de los trabajadores con funciones específicas en materia de prevención de riesgos laborales"], 3, "Son elegidos entre los representantes del personal para ejercer funciones específicas de representación en materia preventiva."],
[11, "El Plan de Prevención de Riesgos Laborales de una empresa u organismo debe incluir, entre otros elementos:", ["La estructura organizativa, funciones y procedimientos para la integración de la prevención", "El convenio colectivo aplicable, sin más contenido", "El presupuesto anual de la entidad, sin más elementos", "El calendario laboral, sin otros contenidos"], 0, "El Plan de Prevención debe incluir la estructura organizativa, funciones, responsabilidades y procedimientos para integrar la prevención."],
[11, "Los equipos de protección individual (EPI) deben utilizarse:", ["Si el trabajador lo solicita expresamente", "En el sector industrial, sin extenderse a la Administración", "Cuando los riesgos no puedan evitarse o limitarse suficientemente por medios de protección colectiva", "Como sustituto de las medidas de protección colectiva"], 2, "Los EPI deben utilizarse cuando los riesgos no puedan evitarse o limitarse suficientemente mediante medios de protección colectiva."],
[11, "El Comité de Seguridad y Salud es un órgano:", ["Formado por técnicos externos contratados específicamente para este fin", "Paritario, formado por representantes de la empresa y de los trabajadores, con funciones consultivas en PRL", "Encargado de la negociación salarial y las condiciones económicas", "De carácter jurisdiccional, con capacidad para imponer sanciones"], 1, "El Comité de Seguridad y Salud es un órgano paritario, con representantes de la empresa y de los trabajadores, de funciones consultivas en PRL."],
[11, "La formación en materia preventiva que debe recibir el trabajador ha de ser, conforme a la Ley 31/1995:", ["Teórica y práctica, suficiente y adecuada, en el momento de la contratación y cuando cambien los riesgos", "Opcional para el trabajador", "Teórica, sin necesidad de práctica", "Impartida una única vez, sin actualización posterior"], 0, "La formación preventiva debe impartirse en el momento de la contratación y siempre que cambien los riesgos, siendo teórica y práctica."],
[11, "La coordinación de actividades empresariales en materia de prevención de riesgos laborales es exigible cuando:", ["Trabajadores de varias empresas coinciden en un mismo centro de trabajo", "El centro de trabajo tiene menos de 5 empleados", "Existe una única empresa en el centro de trabajo", "Se trata de trabajo a distancia"], 0, "La coordinación de actividades empresariales es exigible cuando trabajadores de varias empresas coinciden en un mismo centro de trabajo."],
[11, "El Servicio de Prevención de una Administración Pública puede organizarse, entre otras modalidades, como:", ["Sin estructura organizativa formal alguna", "Como servicio de prevención ajeno, sin otra modalidad posible", "De forma individual por cada empleado, sin organización conjunta", "Servicio de prevención propio, mancomunado o ajeno"], 3, "El servicio de prevención de una Administración Pública puede organizarse como propio, mancomunado o ajeno."],
[11, "El deber de protección del empresario en materia de PRL implica garantizar la seguridad y salud del trabajador en:", ["Todos los aspectos relacionados con el trabajo", "El lugar físico de trabajo, sin más obligaciones adicionales", "El primer año de contrato, sin extenderse más allá", "Las actividades de riesgo elevado, sin alcanzar al resto"], 0, "El deber de protección del empresario exige garantizar la seguridad y salud del trabajador en todos los aspectos relacionados con el trabajo."],
[12, "En la manipulación manual de cargas, la técnica correcta para levantar peso del suelo consiste en:", ["Flexionar la espalda manteniendo las piernas rectas", "Girar el tronco mientras se levanta la carga", "Flexionar las rodillas manteniendo la espalda recta y acercar la carga al cuerpo", "Levantar la carga con los brazos extendidos lejos del cuerpo"], 2, "Flexionar rodillas y mantener la espalda recta reparte el esfuerzo en las piernas, evitando lesiones lumbares."],
[12, "El peso máximo recomendado con carácter general para la manipulación manual de una carga por una sola persona, en condiciones ideales, es de:", ["10 kg", "50 kg", "75 kg", "25 kg"], 3, "La guía técnica de manipulación manual de cargas fija esta referencia general, reducible según condiciones individuales o de la tarea."],
[12, "Ante una tarea que exige permanecer de pie durante periodos prolongados, una medida preventiva recomendable es:", ["Mantener siempre las piernas completamente rígidas", "Evitar cualquier tipo de calzado con amortiguación", "Alternar el apoyo entre ambos pies y realizar pausas o cambios de postura", "Permanecer inmóvil con escaso cambio postural"], 2, "Alternar apoyos y hacer pausas reduce la fatiga muscular y la sobrecarga circulatoria en las piernas."],
[12, "El trabajo sentado prolongado en tareas de oficina requiere, entre otras medidas preventivas:", ["Colocar la pantalla muy por debajo de la altura de los ojos", "Mantener las piernas cruzadas de forma continuada", "Mantener la espalda apoyada en el respaldo y los pies apoyados en el suelo o reposapiés", "Sentarse en el borde de la silla sin apoyar la espalda"], 2, "Una postura sentada correcta exige apoyo lumbar y pies bien apoyados, evitando sobrecargas en columna y circulación."],
[12, "Al empujar o arrastrar una carga (por ejemplo, un carro), la técnica más segura es:", ["Empujar con los brazos flexionados y el peso del cuerpo, evitando torsiones bruscas", "Realizar giros bruscos del tronco durante el desplazamiento", "Tirar siempre de espaldas a la carga", "Utilizar la fuerza de las muñecas"], 0, "Empujar (mejor que tirar cuando es posible) y usar el peso corporal, sin torsiones bruscas, reduce el riesgo de lesión."],
[12, "Los trastornos musculoesqueléticos derivados de malas posturas mantenidas afectan con mayor frecuencia a:", ["Al sistema respiratorio, sin relación con el aparato locomotor", "A la vista, sin relación con posturas o movimientos", "La zona lumbar, cervical y las extremidades superiores", "Al sistema digestivo, sin relación con la postura"], 2, "Son las zonas más habitualmente afectadas por sobrecargas posturales y movimientos repetitivos en el trabajo."],
[12, "Al levantar una carga situada por encima de la altura de los hombros, se recomienda:", ["Lanzar la carga hacia abajo para no sujetarla en alto", "Utilizar un elemento de apoyo (escalera o banqueta) en vez de estirar excesivamente los brazos", "Girar el tronco para alcanzarla lateralmente", "Ponerse de puntillas y estirar al máximo los brazos"], 1, "Evitar estiramientos forzados y usar elementos de apoyo reduce el riesgo de lesión en hombros y espalda."],
[12, "La rotación de tareas entre el personal es una medida preventiva recomendable, principalmente, para:", ["Aumentar la carga de trabajo individual", "Reducir la exposición prolongada a movimientos repetitivos o posturas forzadas", "Aumentar la carga física durante la jornada", "Eliminar la obligación de evaluar los riesgos del puesto"], 1, "Variar las tareas reduce el tiempo de exposición continuada a un mismo factor de riesgo postural o repetitivo."],
[12, "Ante una carga voluminosa que dificulta la visión durante su transporte, la actuación correcta es:", ["Comprobar previamente el itinerario y pedir ayuda si es necesario", "Transportarla siempre en solitario sin ayuda", "Correr para finalizar antes el transporte", "Transportarla igualmente confiando en la memoria del trayecto"], 0, "Verificar el itinerario y solicitar ayuda cuando la visión está comprometida evita golpes, caídas y sobreesfuerzos."],
[12, "El uso de una faja lumbar en tareas de manipulación de cargas debe considerarse:", ["La medida preventiva principal a adoptar", "Innecesaria si la carga pesa menos de 5 kg", "Recomendable en la mayoría de puestos de trabajo", "Una ayuda complementaria, no un sustituto de una técnica de levantamiento correcta"], 3, "Las fajas lumbares pueden ayudar en tareas puntuales, pero nunca sustituyen una técnica de levantamiento adecuada ni la reducción del riesgo en origen."],
[12, "Al transportar una carga entre dos personas, es recomendable:", ["Evitar cualquier comunicación durante el transporte", "Que una de las personas cargue todo el peso mientras la otra observa", "Coordinar los movimientos y comunicarse durante todo el trayecto", "Que cada persona actúe sin coordinarse con la otra"], 2, "La coordinación y comunicación entre ambas personas evita movimientos bruscos o desincronizados que puedan causar una lesión."],
[12, "El uso de calzado adecuado en tareas que impliquen estar de pie o caminar mucho tiempo contribuye a:", ["Aumentar el riesgo de deslizamiento en suelos mojados", "Tiene escasa relación con la prevención de riesgos", "Aumentar la velocidad de ejecución de las tareas", "Reducir la fatiga y prevenir problemas posturales y circulatorios"], 3, "Un calzado adecuado, con buen soporte y amortiguación, es un factor preventivo relevante frente a la fatiga postural."],
[12, "Al realizar una tarea que exige inclinarse repetidamente hacia adelante (por ejemplo, para colocar objetos en una balda baja), se recomienda:", ["Doblar siempre la espalda para ahorrar tiempo", "Evitar cualquier flexión de rodillas por resultar más lento", "Realizar el movimiento lo más rápido posible sin pausas", "Flexionar las rodillas en vez de doblar la espalda repetidamente"], 3, "Flexionar las rodillas reduce la carga acumulada sobre la columna lumbar frente a la flexión repetida de la espalda."],
[12, "Los estiramientos y pausas activas durante la jornada laboral tienen como objetivo principal:", ["Aumentar la rigidez muscular tras su realización", "Aliviar la tensión muscular acumulada y prevenir lesiones por posturas mantenidas", "Reducir la productividad de forma intencionada", "Aumentar la duración total de la jornada laboral"], 1, "Las pausas activas son una medida preventiva sencilla frente a la fatiga muscular derivada de posturas estáticas prolongadas."],
[12, "Al cargar un objeto asimétrico (con el peso repartido de forma desigual), se recomienda:", ["Sujetarlo lo más cerca posible del cuerpo y evitar giros bruscos del tronco", "Realizar giros rápidos para compensar el desequilibrio", "Ignorar la asimetría del objeto durante el transporte", "Sujetarlo con un solo brazo extendido para mayor comodidad"], 0, "Acercar la carga al cuerpo y evitar giros reduce el momento de fuerza sobre la columna, minimizando el riesgo de lesión."],
[12, "La altura de la superficie de trabajo en tareas manuales (como el uso de una mesa o banco) debe adaptarse, siempre que sea posible, para:", ["Evitar posturas forzadas de espalda y hombros durante la tarea", "Aumentar la dificultad de la tarea de forma deliberada", "Reducir la visibilidad del área de trabajo", "No afecta en algún caso a la postura del trabajador"], 0, "Adaptar la altura de la superficie de trabajo a la persona y a la tarea reduce las posturas forzadas de espalda y hombros."],
[12, "El movimiento repetitivo de muñeca en tareas como el manejo de determinadas herramientas puede derivar en:", ["Una reducción del riesgo de fatiga muscular", "Mejoras automáticas en la circulación sanguínea", "Escasa consecuencia relevante para la salud", "Trastornos como la tendinitis o el síndrome del túnel carpiano"], 3, "Los movimientos repetitivos y forzados de muñeca son un factor de riesgo reconocido para trastornos musculoesqueléticos como el síndrome del túnel carpiano."],
[12, "Al recoger un objeto ligero del suelo de forma ocasional, aunque el peso sea bajo, es recomendable:", ["Mantener una técnica postural correcta igualmente, evitando flexionar solo la espalda", "Realizar el movimiento con la máxima rapidez posible", "Ignorar la técnica postural por tratarse de un peso reducido", "Girar el tronco mientras se recoge el objeto"], 0, "Mantener una buena técnica postural de forma habitual, incluso con cargas ligeras, ayuda a prevenir lesiones acumulativas."],
[12, "La evaluación de riesgos ergonómicos de un puesto de trabajo debe tener en cuenta, entre otros factores:", ["La frecuencia, duración e intensidad de las posturas y movimientos exigidos por la tarea", "El color del uniforme de trabajo", "La antigüedad del edificio donde se ubica el puesto", "El número de personas que ocupan el puesto"], 0, "Frecuencia, duración e intensidad son variables clave para valorar el riesgo ergonómico asociado a una tarea."],
[12, "Si una tarea exige mantener los brazos por encima de la altura de los hombros durante periodos prolongados, una medida preventiva adecuada es:", ["Ignorar la postura si no genera dolor inmediato", "Aumentar la duración de la tarea con escasa pausa", "Reorganizar la tarea o usar apoyos que reduzcan el tiempo en esa postura", "Prescindir de cualquier evaluación del puesto"], 2, "Mantener los brazos elevados de forma prolongada es un factor de riesgo relevante que debe corregirse mediante rediseño de la tarea o apoyos técnicos."],
[12, "Las camillas, carros o plataformas con ruedas se recomiendan para el transporte de cargas pesadas principalmente porque:", ["Reducen el esfuerzo físico y el riesgo de lesión respecto al transporte manual directo", "Aumentan el tiempo necesario para el traslado de materiales", "Aumentan el tiempo necesario para completar la tarea", "Están reservados a cargas ligeras"], 0, "El uso de medios auxiliares de transporte reduce significativamente el esfuerzo físico y el riesgo asociado a la manipulación manual directa."],
[12, "Ante molestias musculares persistentes relacionadas con la actividad laboral, la actuación recomendada es:", ["Cambiar de puesto de trabajo sin informar a nadie", "Automedicarse sin consultar a escaso profesional", "Ignorar la molestia mientras se pueda seguir trabajando", "Comunicarlo al servicio de prevención o mutua correspondiente para su valoración"], 3, "Comunicar las molestias permite una valoración temprana y la adopción de medidas preventivas o correctoras adecuadas."],
[12, "El mobiliario regulable en altura en un puesto de trabajo (silla o mesa) tiene como principal ventaja:", ["Reducir el precio del mobiliario", "Eliminar cualquier riesgo ergonómico de forma automática", "Permitir adaptar el puesto a las características de cada persona usuaria", "Aumentar el coste de adquisición del mobiliario de oficina"], 2, "Adaptar el mobiliario a cada persona es una medida ergonómica básica para reducir posturas forzadas, aunque no elimina por sí sola todos los riesgos."],
[12, "Ante una tarea que combina bipedestación prolongada y manipulación de cargas, la organización del trabajo debería priorizar:", ["La alternancia de tareas y las pausas para reducir la exposición combinada a ambos factores de riesgo", "Ignorar la combinación de factores de riesgo si cada uno por separado es asumible", "Aumentar el peso de las cargas para acortar el tiempo total de la tarea", "Mantener la misma tarea sin pausas durante toda la jornada"], 0, "La combinación de varios factores de riesgo postural puede aumentar el riesgo global, por lo que la alternancia y las pausas son especialmente relevantes."],
[13, "Ante una persona inconsciente que respira, la posición recomendada es:", ["Boca abajo con escasa precaución", "Sentada con la cabeza hacia atrás", "La posición lateral de seguridad", "Boca arriba con las piernas elevadas"], 2, "La posición lateral de seguridad es la recomendada para una persona inconsciente que respira con normalidad, mientras se espera ayuda."],
[13, "La secuencia básica de actuación ante una emergencia (PAS) responde a:", ["Proteger, Actuar, Suspender", "Parar, Analizar, Salir", "Proteger, Avisar, Socorrer", "Prevenir, Actuar, Salvar"], 2, "La secuencia PAS (Proteger, Avisar, Socorrer) es la pauta básica de actuación ante cualquier emergencia."],
[13, "En caso de hemorragia externa importante, la primera medida es:", ["Dar líquidos abundantes a la persona afectada", "Aplicar presión directa sobre la herida", "Aplicar un torniquete de inmediato en todos los casos", "Aplicar frío directamente sobre la herida sin protección"], 1, "Ante una hemorragia externa importante, la primera medida es aplicar presión directa sobre la herida."],
[13, "Ante una persona que no respira y no tiene pulso, se debe:", ["Iniciar la reanimación cardiopulmonar (RCP) y avisar a los servicios de emergencia", "Darle agua para reanimarla", "Colocarla en posición lateral de seguridad", "Esperar a que respire de forma espontánea"], 0, "Ante ausencia de respiración y pulso, debe iniciarse la RCP y avisar de inmediato a los servicios de emergencia."],
[13, "El número de teléfono de emergencias común en la Unión Europea es:", ["112", "061", "091", "080"], 0, "El 112 es el número de teléfono de emergencias común en toda la Unión Europea."],
[13, "Ante una quemadura leve, la actuación inicial recomendada es:", ["Reventar cualquier ampolla que se forme", "Enfriar la zona con agua a temperatura ambiente durante varios minutos", "Aplicar pomadas grasas de inmediato", "Aplicar hielo directamente sobre la piel"], 1, "Ante una quemadura leve, se recomienda enfriar la zona con agua a temperatura ambiente durante varios minutos."],
[13, "Ante una convulsión, la actuación de primeros auxilios recomendada incluye:", ["Sujetarla con fuerza para evitar el movimiento", "Darle agua inmediatamente durante la crisis", "Proteger a la persona de golpes y no sujetarla con fuerza", "Introducir un objeto en la boca para evitar que se muerda la lengua"], 2, "Ante una convulsión, se debe proteger a la persona de golpes con objetos cercanos, sin sujetarla con fuerza."],
[13, "Ante una persona inconsciente que respira, la posición recomendada mientras se espera ayuda es:", ["Boca arriba con las piernas elevadas", "Sentada con la cabeza hacia atrás", "Boca abajo con los brazos extendidos", "La posición lateral de seguridad"], 3, "La posición lateral de seguridad se recomienda para una persona inconsciente que respira, mientras se espera la asistencia sanitaria."],
[13, "En caso de hemorragia externa, la primera medida recomendada es:", ["Aplicar un torniquete inmediatamente en cualquier caso", "Aplicar hielo directamente sobre la herida", "Aplicar presión directa sobre la herida", "Ignorarla si es leve"], 2, "Ante una hemorragia externa, la primera medida recomendada es aplicar presión directa sobre la herida."],
[13, "Ante una parada cardiorrespiratoria, la secuencia de actuación básica prioriza:", ["Trasladar a la persona inmediatamente sin valorar la situación", "Comprobar la seguridad, la consciencia y avisar a emergencias antes de iniciar la RCP", "Iniciar la RCP sin comprobar la seguridad del entorno", "Esperar sin actuar hasta la llegada de sanitarios"], 1, "Ante una parada cardiorrespiratoria, primero se comprueba la seguridad del entorno y la consciencia, y se avisa a emergencias antes de iniciar la RCP."],
[13, "En una quemadura leve, se recomienda:", ["Aplicar pasta de dientes o remedios caseros", "Enfriar la zona con agua a temperatura ambiente", "Aplicar hielo directamente sobre la piel", "Reventar las ampollas que se formen"], 1, "Ante una quemadura leve, se recomienda enfriar la zona con agua a temperatura ambiente, nunca helada."],
[13, "Ante un atragantamiento en una persona consciente, una maniobra recomendada es:", ["Provocar el vómito con los dedos", "Tumbar a la persona boca arriba sin más", "Dar agua abundante inmediatamente", "La maniobra de Heimlich"], 3, "La maniobra de Heimlich (compresiones abdominales) es la técnica recomendada ante un atragantamiento en persona consciente."],

[20, "Ante una persona con discapacidad que solicita acceder a un edificio con barreras arquitectónicas, el personal de control de acceso debe:", ["Facilitar, en la medida de lo posible, una vía o apoyo alternativo de acceso", "Ignorar la situación por no ser de su competencia", "Denegar el acceso hasta que se elimine la barrera arquitectónica", "Exigir que la persona resuelva la situación por sí misma"], 0, "Facilitar vías o apoyos alternativos es una medida básica de atención a la accesibilidad mientras se resuelven las barreras estructurales."],
[20, "El horario de apertura y cierre de un edificio administrativo debe ser conocido y respetado por el personal de control de acceso porque:", ["Afecta de forma preferente al personal de limpieza", "Es una información irrelevante para su función", "Puede modificarse libremente por cualquier persona visitante", "Determina el marco en el que se autoriza el acceso ordinario de personas visitantes"], 3, "El horario de apertura marca el periodo en que corresponde autorizar accesos ordinarios, salvo autorizaciones especiales."],
[20, "Ante un simulacro de evacuación programado, el personal de control de acceso debe:", ["Seguir las instrucciones específicas previstas para el simulacro en el plan de autoprotección", "Impedir la salida de las personas durante el simulacro", "Abandonar su puesto con escasa instrucción concreta", "Ignorar el simulacro por no tratarse de una emergencia real"], 0, "Los simulacros forman parte del plan de autoprotección y el personal debe seguir el protocolo específico previsto para ellos."],
[20, "La discreción y confidencialidad respecto a las personas que acceden a determinadas dependencias (por ejemplo, despachos de dirección) es importante porque:", ["Afecta de forma preferente a las visitas de cargos políticos", "Tiene escasa relevancia para el personal de control de acceso", "Debe comunicarse siempre públicamente", "Puede tratarse de información sensible o relativa a la privacidad de terceros"], 3, "El personal de control de acceso maneja información sobre visitas que puede ser sensible y debe tratarse con la debida discreción."],
[20, "Ante la llegada de un servicio de mensajería con un envío para una persona ausente en ese momento, el protocolo habitual es:", ["Entregar el envío a cualquier persona que lo solicite sin comprobación", "Abrir el envío para verificar su contenido antes de aceptarlo", "Registrar la recepción y gestionar su entrega o custodia conforme al procedimiento del centro", "Rechazar cualquier envío si el destinatario no está presente"], 2, "El registro de la recepción y su custodia hasta la entrega efectiva es la práctica habitual ante la ausencia del destinatario."],
[20, "En la atención a personas mayores en el control de acceso, es recomendable:", ["Acelerar el trato para agilizar el flujo de personas", "Evitar cualquier explicación adicional sobre la ubicación de servicios", "Delegar siempre la atención en otra persona sin intervenir", "Ofrecer una atención pausada y clara, facilitando la orientación dentro del edificio"], 3, "Una atención pausada y orientativa mejora la experiencia de las personas mayores, que pueden requerir más tiempo o explicaciones."],
[20, "El uso de un lector de códigos o tarjetas de proximidad en el control de acceso permite, entre otras ventajas:", ["Prescindir de cualquier registro documental", "Almacenar de forma permanente los datos biométricos de la persona", "Registrar de forma automática la entrada y salida de personas autorizadas", "Eliminar la necesidad de cualquier identificación personal"], 2, "Estos sistemas automatizan el registro de accesos, complementando pero no sustituyendo la supervisión humana cuando es necesaria."],
[20, "Al detectar que una persona intenta acceder con documentación aparentemente falsificada, la actuación correcta es:", ["Permitir el acceso para evitar un conflicto", "Ignorar la sospecha si la persona insiste con seguridad", "Confiscar el documento sin dar parte a nadie", "Denegar el acceso y comunicarlo conforme al protocolo de seguridad establecido"], 3, "Ante sospechas fundadas de falsificación, corresponde denegar el acceso y seguir el protocolo de comunicación interna establecido."],
[20, "La señalización de las zonas de acceso restringido en un edificio administrativo tiene como finalidad:", ["Confundir deliberadamente a las personas visitantes", "Informar claramente sobre las limitaciones de acceso a determinadas áreas", "Reducir el horario de apertura del edificio", "Decorar el espacio con escasa función informativa"], 1, "Una señalización clara ayuda a que las personas conozcan qué áreas requieren autorización especial, facilitando el control de acceso."],
[20, "Ante una avería en el sistema electrónico de control de acceso, el protocolo de contingencia habitual prevé:", ["El acceso libre con escaso control mientras dure la avería", "Un procedimiento manual alternativo de identificación y registro", "El cierre permanente del edificio hasta la reparación", "La suspensión total de la actividad del edificio"], 1, "Los protocolos de contingencia permiten mantener un control básico manual mientras se resuelve la incidencia técnica."],
[20, "La rotación de turnos en el personal de control de acceso tiene como finalidad, entre otras:", ["Reducir la seguridad del edificio", "Eliminar la necesidad de protocolos de actuación", "Garantizar la cobertura del servicio durante todo el horario establecido", "Aumentar la carga de trabajo de una única persona"], 2, "La organización por turnos permite mantener el servicio de control de acceso activo durante todo el horario de apertura del edificio."],
[20, "Ante la salida de material o equipamiento del edificio por parte de una persona empleada, el protocolo habitual de control de acceso puede exigir:", ["Comprobación limitada a materiales muy voluminosos, como único criterio", "Una autorización o justificante que acredite dicha salida", "Escasa comprobación, con carácter general", "Impedir la salida de cualquier material, sin excepción"], 1, "Contar con una autorización o justificante para la salida de material es una medida de control habitual frente a posibles sustracciones."],
[20, "La comunicación fluida entre los distintos turnos del personal de control de acceso es importante para:", ["Eliminar la necesidad de identificación de visitantes", "Reducir la necesidad de protocolos de actuación", "Eliminar la necesidad de un protocolo de cambio de turno", "Garantizar la continuidad en el seguimiento de incidencias o situaciones pendientes"], 3, "Un buen traspaso de información entre turnos evita que incidencias o situaciones pendientes queden desatendidas."],
[21, "En la preparación de una sala de reuniones, una de las primeras comprobaciones a realizar es:", ["El presupuesto anual del departamento", "La antigüedad del edificio", "El color de las paredes de la sala", "El número de asistentes previsto para disponer el mobiliario adecuado"], 3, "Conocer el número de asistentes es clave para decidir la disposición de mesas y sillas más adecuada."],
[21, "La disposición de mesas en 'U' en una sala de reuniones es especialmente adecuada para:", ["Reuniones donde se favorece la visibilidad entre todos los asistentes y con la persona ponente", "Conferencias con público muy numeroso sin interacción", "Almacenaje de material de oficina", "Exámenes individuales"], 0, "La disposición en U facilita el contacto visual entre los participantes y con quien dirige la reunión."],
[21, "Antes de una reunión con proyección audiovisual, una comprobación previa recomendable es:", ["Desconectar todos los equipos disponibles en la sala", "Reducir la iluminación de la sala al mínimo posible sin comprobar nada más", "Verificar el correcto funcionamiento del proyector, el sonido y la conexión con el equipo a utilizar", "No comprobar el equipo hasta que llegue la persona ponente"], 2, "Comprobar previamente el equipo audiovisual evita incidencias técnicas durante el desarrollo de la reunión."],
[21, "El papelógrafo es un elemento de apoyo utilizado habitualmente en reuniones para:", ["Anotar ideas o esquemas de forma visible para el conjunto de asistentes", "Determinar el orden del día de la reunión", "Grabar el audio de la reunión", "Proyectar contenido digital"], 0, "Es un soporte de hojas grandes sobre un caballete, utilizado para anotar ideas visibles durante una reunión o formación."],
[21, "Tras la finalización de una reunión, una tarea habitual de apoyo es:", ["Modificar el contenido de las conclusiones alcanzadas", "Eliminar el acta de la reunión", "Recoger y reordenar el mobiliario y los medios materiales utilizados", "Convocar automáticamente una nueva reunión"], 2, "El apoyo a reuniones incluye tanto la preparación previa como la recogida y reordenación posterior de la sala."],
[21, "Los sistemas de audio en una sala de reuniones (altavoces y micrófonos) deben comprobarse, como buena práctica:", ["En reuniones con más de 50 personas", "Con antelación suficiente al inicio del acto, no en el mismo momento de comenzar", "Si algún asistente se queja durante la reunión, como único momento", "Rara vez, dado que suelen funcionar correctamente"], 1, "Comprobar el sonido con antelación permite solucionar incidencias sin retrasar el inicio del acto."],
[21, "La colocación de agua y material de escritura en una sala de reuniones es una tarea habitual de:", ["Mantenimiento de instalaciones eléctricas", "Apoyo a la preparación de la sala antes del inicio del acto", "Control de acceso al edificio", "Gestión del archivo documental"], 1, "Forma parte de las tareas de preparación logística previa a una reunión o acto, facilitando la comodidad de los asistentes."],
[21, "La disposición de mesas en 'escuela' o 'aula', con filas orientadas hacia un punto central, es habitual en:", ["Actividades formativas o conferencias con un ponente principal", "Reuniones de trabajo en pequeño grupo con alta interacción", "Actividades al aire libre", "Almacenaje de material de oficina"], 0, "Esta disposición favorece la atención hacia quien imparte la formación o conferencia, aunque limita la interacción entre asistentes."],
[21, "Antes de un acto con un número elevado de asistentes, conviene comprobar, entre otros aspectos:", ["El aforo máximo permitido de la sala y las salidas de emergencia", "La marca del proyector, sin comprobar su funcionamiento", "La decoración de la sala", "El color de las sillas disponibles"], 0, "El aforo y las salidas de emergencia son aspectos de seguridad esenciales que deben respetarse en cualquier acto con asistencia de público."],
[21, "El micrófono de solapa, frente al micrófono de mano, se utiliza habitualmente cuando:", ["No se dispone de sistema de megafonía", "Se requiere un mayor alcance de sonido en exteriores", "La persona ponente necesita tener las manos libres durante su intervención", "Se trata de una reunión con escaso ponente principal"], 2, "El micrófono de solapa libera las manos de quien habla, siendo útil en presentaciones que requieren gesticulación o uso de materiales."],
[21, "Al finalizar un acto con proyección de contenido digital, una buena práctica es:", ["Eliminar automáticamente cualquier archivo del ordenador utilizado", "Comprobar que no queden documentos o presentaciones abiertos en el equipo utilizado", "Dejar el equipo encendido de forma indefinida", "Desconectar el proyector sin apagar el resto de equipos"], 1, "Verificar que no quedan documentos sensibles abiertos protege la confidencialidad de la información tras el uso compartido del equipo."],
[21, "La rotulación o cartelería identificativa en una sala de reuniones (nombre del acto, horario) tiene como finalidad:", ["Decorar el espacio con escasa función práctica", "Reducir el aforo permitido de la sala", "Determinar el aforo máximo permitido en la sala", "Facilitar la orientación de las personas asistentes"], 3, "Ayuda a que las personas asistentes localicen fácilmente la sala y confirmen que corresponde al acto al que acuden."],
[21, "Ante un fallo técnico imprevisto durante una videoconferencia en una reunión, la actuación recomendada del personal de apoyo es:", ["Intentar solucionarlo con calma o recurrir a un plan alternativo previamente previsto", "Ignorar el fallo esperando que se resuelva solo sin intervención", "Culpar públicamente al proveedor del servicio durante el acto", "Interrumpir definitivamente la reunión sin buscar alternativas"], 0, "Contar con un plan de contingencia y actuar con calma ante incidencias técnicas minimiza el impacto en el desarrollo del acto."],
[21, "El etiquetado o numeración de los asientos en actos con protocolo institucional sirve para:", ["Determinar el horario de inicio del acto", "Facilitar la ubicación ordenada de las personas conforme al orden protocolario previsto", "Determinar el número de asientos disponibles", "Reducir el número de asistentes permitidos"], 1, "En actos con protocolo, la ubicación ordenada de los asientos refleja el orden de precedencia y facilita la organización del acto."],
[21, "La climatización adecuada de una sala antes de una reunión prolongada es importante porque:", ["Depende del color de las paredes de la sala", "Es relevante de forma preferente en los meses de verano", "Tiene escasa influencia en el desarrollo del acto", "Afecta directamente al confort y la concentración de las personas asistentes"], 3, "Una temperatura inadecuada puede afectar negativamente a la atención y comodidad de los asistentes durante un acto prolongado."],
[21, "Al preparar una sala para una reunión con personas con movilidad reducida, se debe tener en cuenta:", ["Ubicar en plantas sin acceso adaptado", "Situar el mobiliario de forma que dificulte el desplazamiento", "Dejar espacios de paso accesibles y sin obstáculos entre el mobiliario", "Ignorar cualquier necesidad específica de accesibilidad"], 2, "Prever espacios de paso accesibles es una medida básica de atención a la diversidad funcional en la organización de actos y reuniones."],
[21, "El material de apoyo como carpetas, bolígrafos o folletos que se distribuyen en una reunión debe:", ["Determinar el orden de intervención de los ponentes", "Repartirse durante el desarrollo de la reunión con escasa previsión", "Prepararse y colocarse con antelación suficiente al inicio del acto", "Eliminarse de cualquier acto institucional"], 2, "Preparar el material con antelación evita retrasos e improvisaciones justo antes o durante el desarrollo del acto."],
[21, "El uso de alargadores eléctricos para conectar equipos audiovisuales en una sala de reuniones debe hacerse:", ["Sobrecargando el mismo alargador con múltiples equipos sin comprobar su capacidad", "Ocultándolos bajo alfombras con escasa protección", "Dejándolos siempre sueltos por el suelo con escasa fijación", "Evitando que crucen zonas de paso sin la debida protección o señalización"], 3, "Los cables sueltos en zonas de paso son un riesgo de tropiezo; deben protegerse o señalizarse adecuadamente."],
[21, "La previsión de un intérprete de lengua de signos en un acto público debe solicitarse, como buena práctica:", ["Rara vez, al considerarse un servicio prescindible", "Con antelación suficiente para poder organizarlo adecuadamente", "Si asiste una única persona sorda, como criterio exclusivo", "El mismo día del acto, con escasa planificación previa"], 1, "Solicitarlo con antelación permite garantizar la disponibilidad del profesional y una correcta organización del acto."],
[21, "El etiquetado de los cables y conexiones en una sala con equipamiento audiovisual complejo facilita:", ["Aumentar automáticamente la calidad de imagen", "Reducir el consumo eléctrico de los equipos", "Determinar la potencia máxima del equipo", "Su identificación rápida ante una incidencia o desconexión"], 3, "Un cableado bien identificado agiliza la resolución de incidencias técnicas durante el uso de equipos audiovisuales."],
[21, "La previsión de sistemas de traducción simultánea en un acto con asistentes de distintos idiomas requiere:", ["Limitar el acto a los dos idiomas más habituales", "Resolver la necesidad sobre la marcha, sin previsión especial", "Prescindir de equipo técnico adicional siempre que sea posible", "Una planificación técnica previa (cabinas, receptores) según el formato del acto"], 3, "La traducción simultánea exige una planificación técnica específica (cabinas, receptores, técnicos) que debe preverse con antelación."],
[21, "El uso de mamparas o separadores móviles en la organización de un espacio para una reunión permite:", ["Adaptar la configuración del espacio según las necesidades de cada acto", "Eliminar la necesidad de comprobar la accesibilidad de la sala", "Reducir el aforo máximo permitido de forma permanente", "Determinar el aforo máximo autorizado de la sala"], 0, "Los elementos móviles de separación aportan flexibilidad para adaptar un mismo espacio a distintos tipos de actos o reuniones."],
[22, "Ante un atasco de papel en una fotocopiadora, la actuación correcta es:", ["Verter líquidos limpiadores directamente sobre el mecanismo", "Desconectar la máquina de la corriente sin retirar antes el papel atascado si el fabricante lo desaconseja", "Forzar la apertura de cualquier parte de la máquina sin consultar indicaciones", "Seguir las indicaciones del propio equipo o manual para retirar el papel sin forzar los mecanismos"], 3, "Seguir las indicaciones del equipo evita dañar los mecanismos internos al retirar el papel atascado."],
[22, "Las máquinas destructoras de documentos se utilizan principalmente para:", ["Plastificar tarjetas y documentos para su conservación", "Eliminar de forma segura documentación con información sensible o confidencial", "Fotocopiar documentos a doble cara de forma automática", "Encuadernar documentos mediante espiral o canutillo"], 1, "Garantizan la destrucción segura de documentos, evitando que la información pueda ser reconstruida o leída."],
[22, "Al utilizar una guillotina de oficina para cortar papel, una norma de seguridad básica es:", ["Cortar el papel sujetándolo con los dedos cerca de la cuchilla para mayor precisión", "Retirar la protección de seguridad si dificulta la tarea", "Mantener las manos alejadas de la cuchilla y usar la protección o pisador previsto", "Usarla sin comprobar que la cuchilla esté bien fijada"], 2, "Mantener las manos alejadas de la zona de corte y usar los elementos de protección previstos evita cortes y accidentes."],
[22, "El plastificado de documentos tiene como finalidad principal:", ["Reducir el tamaño del documento", "Proteger el documento frente al desgaste, la humedad y la suciedad", "Modificar el contenido original del documento", "Eliminar la necesidad de archivarlo"], 1, "El plastificado añade una capa protectora que alarga la vida útil de documentos de uso frecuente o expuestos a deterioro."],
[22, "Al utilizar una taladradora de oficina para perforar documentos que se archivarán en carpetas de anillas, es importante:", ["Alinear correctamente el papel para que las perforaciones coincidan con el sistema de anillas", "Perforar el papel en cualquier posición sin comprobar la alineación", "Perforar siempre el centro exacto del documento independientemente del formato", "Evitar el uso de la guía de alineación si el equipo la incorpora"], 0, "Una correcta alineación evita que el documento quede mal encajado o dañado al archivarlo en la carpeta."],
[22, "El escaneado de documentos en la oficina permite, entre otros usos:", ["Eliminar automáticamente el documento físico escaneado", "Modificar automáticamente el contenido del documento original", "Obtener una versión digital del documento para su archivo o envío electrónico", "Evitar cualquier necesidad de organización de archivos digitales"], 2, "El escaneo digitaliza el documento para facilitar su gestión, archivo o envío, sin que ello implique necesariamente la eliminación del original."],
[22, "La encuadernación de documentos mediante canutillo o espiral es habitual para:", ["Reducir el número de páginas del documento original", "Documentos que se van a destruir inmediatamente", "Documentos de varias páginas que se consultan con frecuencia y requieren apertura completa", "Documentos de una sola página"], 2, "Este tipo de encuadernación facilita la consulta cómoda de documentos extensos, permitiendo que el documento se abra completamente plano."],
[22, "El mantenimiento básico de una fotocopiadora, como la limpieza periódica de los cristales de escaneado, tiene como finalidad:", ["Aumentar la velocidad máxima de impresión del equipo", "Reducir el tiempo de calentamiento del equipo", "Evitar manchas o líneas defectuosas en las copias realizadas", "Reducir el consumo eléctrico del equipo"], 2, "Los cristales de escaneado sucios son una causa habitual de manchas o líneas en las copias, por lo que su limpieza periódica es una tarea básica de mantenimiento."],
[22, "Al elegir el gramaje del papel para una encuadernación con canutillo, conviene tener en cuenta:", ["La marca de la fotocopiadora utilizada", "El idioma del documento", "El número de páginas y el uso previsto del documento", "El color del papel"], 2, "El gramaje adecuado facilita una encuadernación resistente y proporcional al volumen de páginas del documento."],
[22, "Ante un documento confidencial que ya no es necesario conservar, la actuación adecuada es:", ["Dejarlo en la papelera común con escasa precaución", "Regalarlo como papel de borrador a cualquier persona", "Destruirlo mediante la máquina destructora de documentos", "Depositarlo en el contenedor de papel ordinario"], 2, "La destrucción mediante máquina destructora garantiza que la información confidencial no pueda ser reconstruida ni leída por terceros."],
[22, "El uso de una plastificadora requiere, entre otras precauciones:", ["Prescindir del tiempo de calentamiento recomendado por el fabricante", "Introducir el material sin verificar su compatibilidad con el equipo", "Utilizar la temperatura máxima disponible, con independencia del material", "Comprobar la temperatura adecuada según el grosor del material a plastificar"], 3, "Una temperatura inadecuada puede dañar el documento o no sellar correctamente la funda plastificadora."],
[22, "Al preparar un envío masivo de correspondencia con múltiples copias idénticas, una tarea auxiliar habitual es:", ["El fotocopiado o impresión en serie del documento base", "La destrucción del documento original tras la primera copia", "La eliminación de cualquier control de calidad de las copias", "El escaneado individual de cada copia enviada"], 0, "La reproducción en serie es la forma habitual de preparar múltiples copias idénticas para un envío masivo de correspondencia."],
[22, "El correcto etiquetado de carpetas y archivadores en una oficina facilita:", ["Reducir el espacio físico ocupado por los archivadores", "Reducir el espacio de almacenamiento necesario", "La localización rápida de la documentación archivada", "Eliminar la necesidad de índices o inventarios"], 2, "Un etiquetado claro y sistemático es clave para la localización eficiente de documentos en el archivo de oficina."],
[22, "Al recibir un atasco de grapas en una grapadora eléctrica, la actuación recomendada es:", ["Desconectar el equipo antes de intentar retirar el atasco", "Intentar resolver el atasco con el equipo aún conectado a la corriente", "Ignorar el atasco y continuar usando la máquina igualmente", "Forzar el mecanismo sin desconectar la máquina"], 0, "Desconectar el equipo antes de manipular un atasco es una medida básica de seguridad frente a movimientos accidentales del mecanismo."],
[22, "El escaneado de documentos con reconocimiento óptico de caracteres (OCR) permite:", ["Imprimir automáticamente el documento escaneado", "Eliminar la necesidad de archivo del documento original", "Convertir el texto de una imagen escaneada en texto editable y buscable", "Certificar automáticamente la validez legal del texto obtenido"], 2, "El OCR reconoce los caracteres de una imagen escaneada, permitiendo convertirlos en texto digital editable y buscable."],
[22, "Ante un volumen elevado de fotocopiado con múltiples departamentos solicitantes, es recomendable:", ["Atender las solicitudes de forma desordenada con escaso criterio", "Duplicar cada solicitud sin verificar la necesidad real", "Rechazar sistemáticamente las solicitudes urgentes", "Establecer un orden de prioridad o turno claro para gestionar las solicitudes"], 3, "Organizar las solicitudes con un criterio claro de prioridad mejora la eficiencia y evita conflictos entre departamentos."],
[22, "El consumo de tóner o tinta de una impresora debe revisarse periódicamente para:", ["Aumentar automáticamente la velocidad de impresión", "Reducir la calidad de impresión de forma intencionada", "Determinar el color predeterminado de impresión", "Evitar interrupciones en la impresión de documentos urgentes"], 3, "Anticipar el agotamiento del consumible evita retrasos e interrupciones en tareas de impresión urgentes."],
[22, "Al organizar el archivo de documentos administrativos por orden cronológico, el criterio habitual es:", ["Ordenar por el color del documento", "Ordenar los documentos según su fecha de creación o recepción", "Ordenar de forma aleatoria con escaso criterio", "Ordenar por el nombre del remitente"], 1, "El orden cronológico, basado en la fecha, es uno de los criterios de clasificación documental más habituales en archivos de oficina."],
[22, "Ante un mal funcionamiento recurrente de un equipo de oficina (fotocopiadora, destructora, etc.), la actuación adecuada es:", ["Ignorar el problema mientras el equipo siga funcionando parcialmente", "Intentar repararlo sin la formación técnica adecuada", "Intentar repararlo por cuenta propia sin formación técnica", "Comunicarlo al servicio de mantenimiento o proveedor correspondiente"], 3, "Comunicar la incidencia al servicio técnico adecuado evita agravar el problema y garantiza una reparación correcta."],
[22, "El papel reciclado, frente al papel estándar, se caracteriza por:", ["Tener siempre mayor gramaje", "Estar fabricado a partir de fibras de papel recuperado", "Ser exclusivo para impresión a color", "No poder utilizarse en fotocopiadoras convencionales"], 1, "El papel reciclado se elabora reutilizando fibras de papel ya utilizado, siendo compatible con la mayoría de equipos de oficina."],
[22, "Al archivar documentos duplicados innecesarios, una buena práctica de gestión documental es:", ["Conservar todas las copias indefinidamente con escaso criterio", "Eliminar las copias no necesarias conforme al procedimiento de gestión documental", "Destruir también el documento original sin necesidad", "Archivar cada copia en una ubicación distinta sin relación entre ellas"], 1, "Evitar la acumulación de duplicados innecesarios facilita la organización y el uso eficiente del espacio de archivo."],
[22, "La numeración de páginas al encuadernar un documento extenso ayuda a:", ["Eliminar la necesidad de un índice", "Reducir el número total de páginas", "Detectar posibles errores de orden o páginas faltantes antes de finalizar la encuadernación", "Reducir el tamaño del documento encuadernado"], 2, "Revisar la numeración antes de encuadernar permite detectar a tiempo errores de orden o ausencias de páginas."],
[22, "La conservación de copias de seguridad de documentos digitalizados es importante para:", ["Eliminar la necesidad de organizar carpetas digitales", "Aumentar el tamaño de los archivos digitales", "Eliminar la obligación legal de conservar documentos originales", "Prevenir la pérdida de información ante fallos técnicos o errores humanos"], 3, "Las copias de seguridad son una medida básica de prevención frente a la pérdida de información digital por fallos técnicos o errores."],
[23, "El acuse de recibo en un envío postal certificado tiene como finalidad:", ["Acelerar el reparto sin garantía de entrega", "Dejar constancia documental de que el destinatario ha recibido el envío", "Reducir el coste del envío certificado", "Anular la necesidad de sello postal"], 1, "El acuse de recibo es el documento que certifica que el destinatario (o persona autorizada) ha recibido efectivamente el envío."],
[23, "Un envío certificado, frente a un envío ordinario, se caracteriza por:", ["No poder utilizarse para documentos de carácter oficial", "Quedar registrado, con constancia de su curso y entrega", "Ser más lento, sin control adicional relevante", "Ser gratuito, con carácter general"], 1, "El envío certificado se registra y controla en cada fase de su curso, a diferencia del envío ordinario, que no deja este rastro documental."],
[23, "El reembolso en un envío postal es un servicio que permite:", ["Anular el envío antes de su curso", "Devolver automáticamente el envío al remitente sin entrega", "Enviar el paquete con escaso coste asociado", "Cobrar al destinatario un importe en el momento de la entrega, que se remite después al remitente"], 3, "Es un servicio en el que el destinatario paga una cantidad al recibir el envío, cantidad que posteriormente se transfiere al remitente."],
[23, "Los telegramas, como servicio de correspondencia, se caracterizan por:", ["Ser de uso preferentemente privado, no oficial", "Dejar escaso registro de su envío", "Ser un medio de comunicación escrita de carácter urgente y con acuse de recibo posible", "Permitir el envío de textos extensos sin límite de caracteres"], 2, "Aunque en desuso frente a medios electrónicos, el telegrama sigue siendo un medio formal de comunicación urgente con valor probatorio."],
[23, "El giro telegráfico o postal es un servicio que permite:", ["Enviar documentación oficial de carácter confidencial", "Enviar dinero de una persona a otra a través del servicio postal", "Realizar transferencias bancarias internacionales", "Enviar documentos con escaso valor económico"], 1, "Es un servicio postal que permite el envío de dinero, con distintas modalidades según la rapidez y el medio utilizado."],
[23, "La correcta cumplimentación de un envío de correspondencia oficial exige, entre otros datos:", ["El nombre del destinatario, con carácter principal", "Identificación clara del remitente y destinatario y la dirección completa y correcta", "El número de teléfono del remitente, como dato más relevante", "El código postal, con carácter prioritario"], 1, "Una dirección incompleta o incorrecta es la causa más habitual de incidencias en la entrega de correspondencia."],
[23, "Un envío urgente, frente a uno ordinario, se caracteriza por:", ["Ser siempre gratuito", "Eliminar la necesidad de dirección del destinatario", "Ofrecer un plazo de entrega más rápido, con un coste generalmente mayor", "Tener escasa diferencia de plazo"], 2, "El servicio urgente prioriza la rapidez de entrega frente al servicio ordinario, con un coste asociado mayor."],
[23, "Al recibir un paquete en las dependencias administrativas, una buena práctica antes de firmar la recepción es:", ["Firmar sin comprobar nada, dando prioridad a la rapidez", "Abrir el paquete delante del transportista, como norma general", "Comprobar que el paquete no presenta daños visibles evidentes", "Rechazar los paquetes de aspecto poco habitual, como criterio general"], 2, "Verificar el estado externo antes de firmar la recepción facilita, en su caso, dejar constancia de una incidencia visible."],
[23, "Al recibir un envío con reembolso a nombre de un organismo público, el importe a cobrar debe:", ["Poder modificarse a criterio del receptor", "Requerir escasa comprobación previa", "Coincidir exactamente con el indicado en la documentación del envío", "Cobrarse siempre en una cantidad superior por precaución"], 2, "El importe del reembolso viene fijado por el remitente y debe respetarse tal como consta en la documentación del envío."],
[23, "La correspondencia dirigida a un departamento concreto de un organismo, al recibirse en la unidad de registro o conserjería, debe:", ["Destruirse si no se conoce el destinatario exacto", "Distribuirse internamente conforme al procedimiento establecido de reparto", "Devolverse automáticamente al remitente", "Abrirse siempre antes de su distribución interna"], 1, "El reparto interno conforme al procedimiento asegura que la correspondencia llegue al departamento o persona correcta."],
[23, "Un envío con acuse de recibo, a diferencia de uno sin él, permite al remitente:", ["Reducir el coste del envío", "Enviar el paquete de forma anónima", "Obtener constancia documental de que el destinatario lo ha recibido", "Evitar cualquier registro del envío"], 2, "El acuse de recibo aporta al remitente una prueba formal de que la entrega se ha producido efectivamente."],
[23, "Ante un envío postal dirigido erróneamente a una persona o departamento que ya no se encuentra en el organismo, la actuación adecuada es:", ["Abrirlo para conocer su contenido antes de decidir qué hacer", "Destruir el envío directamente", "Dejarlo indefinidamente sin resolver su destino", "Gestionar su devolución o reenvío conforme al procedimiento interno establecido"], 3, "Gestionar la devolución o el reenvío conforme al procedimiento evita la pérdida o el extravío de correspondencia mal dirigida."],
[23, "El franqueo de un envío postal se refiere a:", ["La firma del destinatario al recibir el envío", "El registro interno de entrada del organismo", "La clasificación del envío por su contenido", "El pago del servicio postal correspondiente al tipo y peso del envío"], 3, "El franqueo es el importe abonado por el servicio postal, calculado según el tipo de envío, su peso y destino."],
[23, "Un paquete que llega con el embalaje visiblemente dañado debe, como buena práctica:", ["Rechazarse siempre de forma automática", "Reflejarse esa incidencia antes de firmar su recepción", "Abrirse en presencia de terceros ajenos al organismo", "Aceptarse con escasa anotación ni comprobación"], 1, "Dejar constancia de la incidencia visible en el momento de la recepción facilita, en su caso, una reclamación posterior."],
[23, "El servicio de correspondencia interna dentro de un organismo con varios edificios o sedes tiene como finalidad:", ["Facilitar el traslado ordenado de documentación entre las distintas dependencias", "Reducir significativamente el volumen de correspondencia externa", "Aplicarse de forma preferente a la correspondencia electrónica", "Eliminar la necesidad de registro de salida"], 0, "Permite gestionar de forma organizada el flujo de documentación entre las distintas sedes o dependencias de un mismo organismo."],
[23, "La clasificación de la correspondencia recibida según su urgencia o prioridad ayuda a:", ["Aumentar el volumen total de correspondencia recibida", "Determinar el destinatario final de cada documento", "Gestionar de forma más eficiente su reparto y tramitación", "Reducir la necesidad de identificar al destinatario"], 2, "Clasificar por urgencia permite priorizar la distribución de aquella correspondencia que requiere una atención más inmediata."],
[23, "Un burofax, como servicio de envío urgente con acreditación de contenido, se utiliza habitualmente para:", ["Correspondencia interna dentro del mismo edificio", "Comunicaciones que requieren dejar constancia fehaciente de su contenido y envío", "Envíos con escasa relevancia jurídica", "Envíos de paquetería voluminosa"], 1, "El burofax certifica tanto el envío como el contenido del documento, siendo útil en comunicaciones con relevancia jurídica o administrativa."],
[23, "La correcta cumplimentación de la etiqueta de un envío urgente exige, entre otros datos:", ["El color del paquete", "La fecha de caducidad del contenido, como dato principal", "El peso y las señas completas del destinatario", "El nombre del remitente, como único dato relevante"], 2, "Unas señas completas y el peso correcto son datos esenciales para evitar incidencias en el curso del envío."],
[23, "El servicio de correos con valor declarado se utiliza cuando:", ["El envío tiene escaso valor especial", "Se quiere reducir el coste del envío al máximo", "El contenido del envío tiene un valor económico que se desea proteger ante pérdida o daño", "El destinatario reside en el extranjero"], 2, "El valor declarado permite una indemnización acorde al valor real del contenido en caso de pérdida, robo o daño durante el envío."],
[23, "La notificación administrativa por correo postal certificado con acuse de recibo tiene especial relevancia porque:", ["Tiene escasa relevancia jurídica especial", "Elimina cualquier necesidad de conservar el justificante", "Requiere el pago de una tasa adicional en su tramitación", "Permite acreditar la fecha en que el interesado recibió la notificación, relevante para el cómputo de plazos"], 3, "La fecha de recepción certificada es clave para determinar el inicio del cómputo de plazos administrativos, como el de un posible recurso."],
[23, "La correcta gestión de la paquetería recibida a título personal en el centro de trabajo, sin relación con la actividad administrativa, debe:", ["Tratarse siempre con la misma prioridad que la correspondencia oficial", "Abrirse por el personal de recepción sin autorización del destinatario", "Regirse por el criterio o protocolo interno establecido al respecto", "Rechazarse sistemáticamente con escaso criterio"], 2, "Muchas organizaciones cuentan con criterios internos específicos para diferenciar la gestión de paquetería personal frente a la oficial."],
[24, "El almacenamiento de materiales pesados en estanterías debe realizarse, como norma general de seguridad:", ["En las baldas superiores, con escasa limitación de peso", "En las baldas inferiores, para mantener el centro de gravedad bajo", "Indistintamente en cualquier altura", "En el suelo, evitando el uso de estanterías"], 1, "Colocar los materiales más pesados en las baldas bajas reduce el riesgo de vuelco y facilita una manipulación más segura."],
[24, "El almacenamiento de materiales peligrosos (inflamables, corrosivos, etc.) exige, entre otras medidas:", ["Prescindir de cualquier ventilación en el espacio de almacenamiento", "Eliminar el etiquetado de los envases para ahorrar espacio", "Almacenar todos los productos juntos sin distinción", "Separar los productos incompatibles entre sí y señalizar adecuadamente la zona"], 3, "La separación de productos incompatibles y la señalización adecuada son medidas básicas de seguridad en el almacenamiento de sustancias peligrosas."],
[24, "Los colgadores y perchas en un almacén se utilizan principalmente para:", ["Almacenar líquidos a granel", "Materiales que requieren mantenerse suspendidos o extendidos, evitando pliegues o daños", "Almacenar materiales peligrosos", "Ocupar menos espacio que una estantería convencional"], 1, "Permiten conservar en buen estado materiales que se dañarían si se apilaran o doblaran (por ejemplo, ciertos tejidos o prendas)."],
[24, "La correcta organización del espacio de almacenamiento debe tener en cuenta, entre otros factores:", ["El orden alfabético del nombre del producto, como criterio principal", "El color del embalaje, con carácter prioritario", "La fecha de fabricación del estante", "La frecuencia de uso de cada material, situando lo más utilizado en zonas de fácil acceso"], 3, "Situar los materiales de uso frecuente en zonas accesibles optimiza el tiempo y el esfuerzo en las tareas de almacén."],
[24, "Las fichas de seguridad de un producto químico almacenado deben estar:", ["Guardadas bajo llave sin acceso del personal", "Disponibles y accesibles para el personal que manipula dicho producto", "Eliminadas una vez almacenado el producto", "Sustituidas por el etiquetado"], 1, "Las fichas de datos de seguridad informan sobre riesgos, manipulación y primeros auxilios ante un producto químico, y deben ser accesibles."],
[24, "El principio de rotación de materiales almacenados ('primero en entrar, primero en salir') tiene como finalidad:", ["Eliminar la necesidad de control de existencias", "Evitar el deterioro o caducidad de materiales que llevan más tiempo almacenados", "Reducir el número de estanterías necesarias", "Aumentar el volumen total del almacén"], 1, "Esta práctica (conocida como FIFO) evita que materiales con fecha de caducidad o deterioro queden olvidados en el fondo del almacén."],
[24, "El etiquetado de las estanterías de un almacén, indicando el tipo de material almacenado en cada ubicación, tiene como finalidad:", ["Reducir la necesidad de ventilación del almacén", "Aumentar el peso máximo permitido en cada balda", "Indicar el precio de venta al público de cada material", "Facilitar la localización rápida y ordenada de los materiales"], 3, "Un etiquetado claro de las ubicaciones agiliza tanto la búsqueda como la reposición de materiales en el almacén."],
[24, "Los pasillos de circulación dentro de un almacén deben mantenerse:", ["Cerrados salvo autorización expresa", "Libres de obstáculos para permitir un tránsito seguro", "Reducidos al mínimo posible independientemente del uso", "Ocupados con material de uso poco frecuente"], 1, "Mantener los pasillos despejados es esencial para la seguridad y eficiencia en el tránsito de personas y materiales dentro del almacén."],
[24, "La capacidad máxima de carga de una estantería debe:", ["Respetarse conforme a las especificaciones técnicas del fabricante", "Reducirse siempre a la mitad de la indicada", "Ignorarse si los materiales parecen ligeros", "Ampliarse a criterio del propio personal si el material lo permite"], 0, "Superar la capacidad de carga indicada por el fabricante puede provocar el colapso de la estructura, con el consiguiente riesgo para las personas y materiales."],
[24, "El almacenamiento conjunto de productos oxidantes y combustibles debe evitarse porque:", ["Puede aumentar significativamente el riesgo de incendio o explosión", "Existe escaso riesgo asociado a esa combinación", "Es una práctica recomendada por la normativa de seguridad", "Mejora la organización del espacio de almacenamiento"], 0, "Los productos oxidantes favorecen la combustión, por lo que su cercanía con materiales combustibles incrementa notablemente el riesgo de incendio."],
[24, "La ventilación adecuada de una zona de almacenamiento de productos químicos es importante para:", ["Aumentar la temperatura ambiente de la zona", "Eliminar el riesgo de inhalación sin más medidas", "Reducir la necesidad de etiquetado de los productos", "Evitar la acumulación de vapores potencialmente peligrosos"], 3, "Una ventilación adecuada reduce la concentración de vapores que puedan resultar tóxicos, inflamables o irritantes."],
[24, "El uso de pictogramas normalizados en el etiquetado de sustancias peligrosas tiene como finalidad:", ["Indicar el precio del producto", "Detallar el precio y proveedor de la sustancia", "Identificar de forma rápida y universal el tipo de peligro que presenta el producto", "Decorar el envase del producto"], 2, "Los pictogramas normalizados permiten una identificación visual rápida del riesgo, independientemente del idioma del envase."],
[24, "Al recibir un nuevo lote de material en el almacén, antes de ubicarlo es recomendable:", ["Destruir el embalaje antes de cualquier verificación", "Ubicarlo inmediatamente con escasa comprobación", "Mezclarlo con material de lotes anteriores sin distinción", "Comprobar que corresponde al pedido y que no presenta daños visibles"], 3, "Verificar la correspondencia con el pedido y el estado del material evita errores de almacenamiento y facilita detectar incidencias del transporte."],
[24, "El uso de estanterías compactas o móviles en un almacén tiene como principal ventaja:", ["Aumentar el riesgo de accidentes de forma significativa", "Reducir la capacidad de almacenamiento respecto a estanterías fijas", "Optimizar el espacio disponible al reducir el número de pasillos fijos", "Eliminar la necesidad de etiquetado"], 2, "Las estanterías móviles permiten aprovechar mejor el espacio, ya que solo se abre un pasillo cuando se necesita acceder a una fila concreta."],
[24, "El uso de bandejas apilables en un almacén de oficina facilita:", ["Eliminar la necesidad de etiquetado", "Aumentar el peso máximo permitido por unidad de superficie", "Optimizar el espacio vertical disponible de forma ordenada", "Reducir el peso máximo soportado por cada balda"], 2, "Las bandejas apilables permiten aprovechar el espacio en altura manteniendo el material organizado y accesible."],
[24, "Antes de almacenar un producto químico nuevo, es recomendable consultar:", ["La marca del fabricante, con carácter principal", "El color de su envase", "Su ficha de datos de seguridad para conocer sus condiciones de almacenamiento", "Su precio de adquisición, como criterio principal"], 2, "La ficha de datos de seguridad indica las condiciones adecuadas de almacenamiento y las incompatibilidades a evitar."],
